  - A list of outlier posts and common traits (format, hook, day).  \n3. **Consult Tab 2** for the automatically calculated averages and percentages.  \n4. **Derive three concrete actions** (e.g., increase tutorial volume, test new hook styles for concepts, add more behind‑the‑scenes stories).  \n5. **Update the 90‑day plan (Tab 5)** with revised pillar allocations for the next month.  \n\n### Use Case 2 – Quarterly Growth Forecast & Content Mix Optimization  \n\n1. **Gather follower counts** for the past 3–6 months in Tab 4.  \n2. **Invoke the “Growth Forecasting” prompt**, supplying the target follower count. The AI projects the timeline, required growth rate, and visualises current vs. accelerated trajectories.  \n3. **Identify the pillar(s) that most influence follower acquisition** (usually the Tutorial or Social‑Proof pillars).  \n4. **Run the “Content Mix Planning” prompt**, providing the desired posting frequency and platform distribution. The AI outputs a percentage split across pillars, justification, and a draft 30‑day calendar with placeholder titles.  \n5. **Implement the calendar**, monitor results in the next month, and repeat the loop.  \n\n## 7. Prerequisites  \n\n- Basic proficiency with Excel (creating tables, navigating tabs).  \n- Access to a recent version of Excel that includes the Agent‑Mode (or equivalent LLM integration).  \n- Ability to export or manually record platform metrics (views, saves, comments, link clicks, etc.) after each post.  \n- A minimum posting cadence of 2–3 pieces per week to generate sufficient data for meaningful analysis.  \n\n## 8. Recommended Next Resources  \n\n- **Advanced Excel for Creators** – Deep‑dive into dynamic arrays, Power Query, and custom dashboards to extend the five‑tab system.  \n- **Prompt Engineering for Business LLMs** – Techniques for crafting more nuanced Agent‑Mode commands and chaining multiple prompts.  \n- **Platform‑Specific Analytics APIs** (TikTok for Developers, Instagram Graph API, YouTube Data API) – Automate metric extraction to feed the spreadsheet without manual entry.  \n- **Content Strategy Frameworks** – Study of audience segmentation, value ladders, and funnel mapping to complement the pillar approach.  \n\n---  \n\n*By institutionalising the pillar taxonomy, leveraging a lightweight spreadsheet, and automating insight generation with AI prompts, creators can transition from guesswork to a disciplined, data‑first content operation.*"}, {"id": "AI-037", "slug": "the-cold-outreach-playbook", "title": "The Cold Outreach Playbook", "category": "Building & Monetising", "subcategory": "Agency & Client Acquisition", "difficulty": "Intermediate", "description": "A complete system for turning cold strangers into booked calls. Ideal client targeting, first-email anatomy, a four-email follow-up sequence, and the proof assets that turn interest into a meeting.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "Chapter 01, What to Know", "Define your ideal client first", "Build your ICP: nail these five", "Chapter 02, What to Say", "The first email: six parts", "Agency & Client Acquisition"], "ai_tools": ["Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-037_the-cold-outreach-playbook.html", "summary_file": "summaries/AI-037.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-037 - The Cold Outreach Playbook  \n\n- **Category:** Building & Monetising | **Subcategory:** Agency & Client Acquisition  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide presents a repeatable framework for converting completely cold prospects into scheduled discovery calls. It begins by insisting that outreach must be anchored in a crystal‑clear definition of the target persona, their immediate pain points, and a timely trigger that justifies the contact. Once the Ideal Customer Profile (ICP) is locked down, the playbook walks through the anatomy of a high‑response email—six distinct sections that together convey relevance, credibility, a concise value proposition, social proof, and a low‑effort call‑to‑action—all while staying under 150 words.  \n\nBeyond the first touch, the material outlines a four‑step follow‑up cadence that incrementally adds proof (case studies, screenshots, custom landing pages, short videos) and nudges the prospect toward a meeting without ever asking for a call too early. The final chapters cover channel selection, disciplined timing, and the mechanics of moving a warm reply into a calendar slot. Throughout, the author emphasizes that the entire system is portable across email, LinkedIn, direct messages, or phone calls, provided the same contextual logic is applied.\n\n## 2. Why It Matters  \nIn a landscape where inboxes are saturated and generic mass‑mailing yields diminishing returns, this playbook offers a high‑efficiency alternative: one hyper‑targeted message per campaign rather than thousands of scattershot emails. By leveraging contextual triggers (new product launches, funding rounds, hiring events) the approach dramatically raises reply rates, turning outreach from a numbers‑game into a precision‑engineered conversion funnel. The disciplined sequence also reduces wasted effort—each follow‑up must contribute new evidence, preventing the “bump” fatigue that erodes brand perception. For agencies and solo founders alike, the methodology shortens sales cycles, improves lead quality, and maximizes the ROI of prospecting time and tools.\n\n## 3. Target Audience  \n- **Agency founders** who need a scalable, repeatable prospecting system for B2B services.  \n- **Freelancers / solopreneurs** selling consulting, SaaS, or high‑ticket products.  \n- **Business development managers** tasked with outbound lead generation in tech, marketing, or professional services.  \n- **Growth hackers** looking for a structured email/DM workflow that can be automated after the initial manual research phase.  \nAll of these roles should have at least a basic understanding of email deliverability and be comfortable iterating copy based on response data.\n\n## 4. Key Concepts & Principles  \n\n- **Ideal Customer Profile (ICP) Precision**: Break the target down into industry niche, company size, decision‑maker role, core pain, and a recent catalyst. This granularity ensures every line of copy feels tailor‑made.  \n- **Contextualisation vs. Flattery**: Instead of merely referencing a prospect’s background, embed a real‑time event or change they’re experiencing. This creates urgency and demonstrates that the outreach is timely, not generic.  \n- **Six‑Part Cold Email Blueprint**: A repeatable structure—subject, opener, hook, value, proof, ask—that forces brevity and relevance while guiding the reader toward a single, low‑commitment reply.  \n- **Value‑First Follow‑Up Sequence**: A four‑email progression (opener → value drop → proof → nudge) where each step introduces fresh collateral (case study, screenshot, custom page, video) and only later asks for a meeting, thereby building trust before the sales pitch.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (AI text‑generation assistant)**: Used for rapid extraction of prospect pain points from web content and for trimming draft emails to the 150‑word limit while preserving key elements.  \n- **Email Authentication Suite (SPF, DKIM, DMARC)**: Configured to improve inbox placement and protect deliverability, ensuring that the meticulously crafted messages actually reach the prospect’s primary inbox.  \n\n*(Other implied tools include standard email clients, URL shorteners for custom landing pages, and basic video recording software for 60‑second walkthroughs.)*\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – B2B SaaS Agency Targeting New Funding Rounds  \n1. **Research**: Scan recent press releases or Crunchbase for companies that just secured Series A funding.  \n2. **ICP Confirmation**: Verify they are within the agency’s niche (e.g., “mid‑size e‑commerce platforms”) and identify the CTO or VP of Product as the decision‑maker.  \n3. **Trigger Extraction**: Feed the funding announcement into Claude to surface three likely operational challenges (e.g., scaling infrastructure, hiring engineers).  \n4. **Compose Email**: Use the six‑part template, opening with a line like “Congrats on the $10M raise—most teams at this stage hit X bottleneck within 90 days.” Keep the body under 150 words.  \n5. **Send & Track**: Ensure SPF/DKIM/DMARC are active, send via a warm‑up email service, and monitor replies.  \n6. **Follow‑Up**: If no reply after 3 days, send the “value drop” email with a one‑page case study of a similar client who reduced churn by 20% after implementing the agency’s solution. Continue with proof and nudge steps as outlined.  \n\n### Use Case 2 – Freelance Consultant Pitching to Boutique Fitness Studios  \n1. **Identify Niche**: Filter LinkedIn for “boutique fitness studio” owners with 5‑20 employees.  \n2. **Trigger Hunt**: Look for recent announcements of new studio openings or equipment purchases.  \n3. **Claude Prompt**: Paste the studio’s website and latest Instagram post; ask Claude to list the top three operational pain points (e.g., member retention, class scheduling).  \n4. **Draft Email**: Subject line “Quick idea for your new location” followed by a concise hook referencing the new opening and a single benefit (“increase class fill‑rate by 15%”).  \n5. **Deploy**: Send the email, then after 48 hours, follow with a short video (screen‑recorded walkthrough of a scheduling dashboard) linked via an image thumbnail.  \n6. **Close**: Once the prospect replies positively, propose a 15‑minute call with two concrete time slots, leveraging the “close the loop” principle.\n\n## 7. Prerequisites  \n\n- Access to a reliable email service provider with SPF, DKIM, and DMARC records configured.  \n- Basic proficiency with a generative AI assistant (Claude) for research and copy refinement.  \n- Ability to produce lightweight collateral: one‑page case studies, screenshots, a simple custom landing page (e.g., using Carrd or Webflow), and a 60‑second video (recorded via Loom or similar).  \n- Familiarity with prospecting tools (LinkedIn Sales Navigator, Crunchbase, or similar) to locate trigger events.\n\n## 8. Recommended Next Resources  \n\n- **Advanced Email Deliverability**: Deep dive into inbox placement, warm‑up strategies, and reputation monitoring.  \n- **Multichannel Outreach Automation**: Guides on integrating LinkedIn messaging, retargeting ads, and SMS into the same contextual framework.  \n- **A/B Testing Cold Email Copy**: Methodologies for systematically testing subject lines, hooks, and asks to optimize reply rates.  \n- **Data‑Driven Prospect Scoring**: Building a scoring model that ranks prospects based on trigger relevance, firmographics, and engagement history.  \n\nThese follow‑up topics will help you scale the single‑prospect, high‑response methodology into a sustainable outbound engine."}, {"id": "AI-038", "slug": "5-ai-services-you-can-sell-this-week", "title": "5 AI Services You Can Sell This Week", "category": "Building & Monetising", "subcategory": "Agency & Client Acquisition", "difficulty": "Beginner", "description": "Five AI services you can start selling immediately with no coding required. AI copywriting, content repurposing, chatbot setup, email outbound systems, and vibe-coded web design, with pricing, tools, and first-client steps for each.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "Service 01, AI-Powered Copywriting", "How to get started", "Service 02, AI Content Repurposing", "The core tool stack", "Agency & Client Acquisition"], "ai_tools": ["Claude", "ChatGPT", "GPT-4", "v0", "Apollo"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-038_5-ai-services-you-can-sell-this-week.html", "summary_file": "summaries/AI-038.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-038 - 5 AI Services You Can Sell This Week  \n\n- **Category:** Building & Monetising | **Subcategory:** Agency & Client Acquisition  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide outlines a practical, no‑code playbook for launching a micro‑agency that delivers five distinct AI‑driven services. It walks a newcomer through the mental shift from writing code to exercising creative direction: the core skill is defining the desired output, curating prompts, and polishing the AI‑generated material to match a client’s brand voice. For each service—AI‑assisted copywriting, content repurposing, chatbot creation, outbound email automation, and “vibe‑coded” web design—the author enumerates a minimal toolset, a quick‑start workflow, and pricing brackets that can be used to secure the first paying client within days.  \n\nUnderlying the tactics is a repeatable architecture: (1) ingest raw client assets, (2) run them through a large language model (Claude, ChatGPT, or a niche‑specific generator) to produce a draft, (3) apply a secondary refinement step (often another LLM or a specialized SaaS) to enforce tone and format, and (4) deliver a polished deliverable while positioning yourself as the strategic overseer. The resource also stresses the importance of building a small spec portfolio before outreach, leveraging free‑tier SaaS accounts, and converting one‑off projects into monthly retainers.\n\n## 2. Why It Matters  \nIn the current AI boom, the bottleneck is not model access but human judgment—knowing what “good” looks like and how to steer the model toward it. By framing AI as a productivity accelerator rather than a replacement, the guide enables freelancers to command premium rates without deep technical backgrounds. Each service taps a high‑value pain point (poor copy, under‑utilised media, clunky support bots, low‑ROI email outreach, and slow web‑dev cycles) and offers a scalable, repeatable delivery model. The approach dramatically reduces time‑to‑revenue: a typical copy project that once required days of drafting can be turned around in a few hours, while a chatbot or website can be spun up in a single afternoon. This efficiency translates into higher margins, faster client acquisition, and the ability to layer multiple services for a single client, creating a sticky, multi‑channel growth engine.\n\n## 3. Target Audience  \n- **Aspiring solo‑entrepreneurs** who want to start a service‑based business with minimal upfront investment.  \n- **Marketers or copywriters** looking to augment their skill set with AI‑assisted production.  \n- **Consultants and agency staff** seeking new revenue streams that don’t require hiring developers.  \n- **Recent graduates or career‑switchers** with strong communication or design instincts but limited coding experience.  \n\nAll of these personas benefit from the low barrier to entry (free SaaS tiers, no code) and the clear pricing frameworks that accelerate cash flow.\n\n## 4. Key Concepts & Principles  \n\n- **Prompt Engineering as Creative Direction**: Treat the prompt like a storyboard; the clearer the brief, the more aligned the AI output. Iterative refinement—draft → LLM polish → brand‑tone check—is the core production loop.  \n- **Zero‑Code Service Architecture**: Each offering relies on SaaS integrations (e.g., Claude + Castmagic, Botpress + GPT‑4) rather than custom scripts, allowing rapid deployment and easy scaling.  \n- **Retainer‑First Mindset**: Position the initial project as a proof‑of‑concept, then lock the client into a monthly maintenance or content‑generation contract to stabilize income.  \n- **Brand‑Voice Specialization**: Differentiating yourself as a “voice steward” rather than a generic writer commands higher fees because you guarantee consistency across all client touchpoints.  \n\n## 5. Tools & Technologies Mentioned  \n\n| Tool | Role & Typical Use‑Case |\n|------|--------------------------|\n| **Claude** (Anthropic) | General‑purpose LLM for drafting copy, refining transcripts, and generating chatbot responses. |\n| **ChatGPT** (OpenAI) | Alternative LLM for quick drafts; useful when Claude access is limited. |\n| **Jasper.ai** | Specialized in long‑form content (e.g., blog posts, whitepapers). |\n| **Copy.ai** | Optimized for short‑form sales copy, ad headlines, and social snippets. |\n| **Castmagic.io** | Audio/video transcription service that outputs structured text ready for LLM refinement. |\n| **Opus Clip (opus.pro)** | Auto‑generates short video highlights from longer recordings, feeding the repurposing pipeline. |\n| **Repurpose.io** | Automates cross‑platform distribution of repurposed assets (LinkedIn, TikTok, YouTube, etc.). |\n| **Botpress** | No‑code chatbot builder with visual flow editor and native LLM connectors; ideal for entry‑level bots. |\n| **Voiceflow** | More advanced flow designer for multi‑step or voice‑enabled bots; useful after landing 2‑3 clients. |\n| **Apollo.io** | B2B prospect database, enrichment, and basic email sequencing; the foundation of outbound pipelines. |\n| **Instantly.ai** | Dedicated email‑sending infrastructure handling warm‑up, deliverability, and high‑volume dispatch. |\n| **Clay** | Advanced data enrichment platform for building richer lead lists when scaling. |\n| **Lovable.dev** | “Vibe‑coding” platform that turns plain‑English design prompts into full‑stack web apps. |\n| **Bolt.new** | Similar to Lovable but offers higher token limits and clean code export for more complex sites. |\n| **v0.dev (Vercel)** | UI‑component generator for polished front‑ends; requires a bit more technical context. |\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – AI‑Powered Copywriting Service  \n1. **Skill Up**: Complete a free copy‑writing crash course (e.g., Copyhackers’ “Copy School”).  \n2. **Tool Setup**: Create accounts on Claude (or ChatGPT) and a niche‑specific generator (Jasper for long‑form, Copy.ai for ads).  \n3. **Portfolio Creation**: Draft three spec pieces—landing page, 5‑email sequence, and a set of three social ads—for a chosen industry. Store them in a shared Google Drive folder.  \n4. **Client Acquisition**: Pitch as a “brand‑voice specialist” on freelance platforms or via LinkedIn outreach, quoting a £300‑£2,000 range depending on scope.  \n5. **Delivery Pipeline**:  \n   - Input client brief into Claude with a detailed prompt (tone, target persona, CTA).  \n   - Generate first draft, then run the output through a second LLM pass to tighten persuasion and ensure brand consistency.  \n   - Perform a manual QA for factual accuracy and compliance, then deliver the final copy in a branded PDF.  \n6. **Retainer Upsell**: Offer a monthly package (e.g., £800 for 4 landing pages + 2 email sequences) to lock recurring revenue.  \n\n### Use Case 2 – AI Content Repurposing Service  \n1. **Identify a Content‑Rich Client**: Target a podcast network, webinar host, or YouTube channel with a backlog of long‑form media.  \n2. **Toolchain Assembly**:  \n   - Upload raw audio/video to **Castmagic.io** → obtain a clean transcript.  \n   - Feed transcript into **Claude** with a prompt to extract key takeaways, rewrite as a blog post, and generate LinkedIn carousel captions.  \n   - Use **Opus Clip** to auto‑create 30‑second highlight reels.  \n   - Push final assets to **Repurpose.io** for scheduled posting across chosen platforms.  \n3. **Workflow Timing**: After the initial learning curve, each episode can be processed in ~30 minutes (transcription + LLM refinement).  \n4. **Pricing Model**: Charge a one‑off fee (£300‑£500) for a pilot batch of three episodes, then transition to a retainer (£500‑£1,200/month) based on volume.  \n5. **Automation Tip**: Set up Zapier or Make.com triggers that move a newly uploaded video from a Google Drive folder into Castmagic, then into Claude, and finally into Repurpose.io, achieving near‑hands‑off operation.  \n\n## 7. Prerequisites  \n\n- **Fundamental copywriting or content strategy knowledge** (free online courses suffice).  \n- **Active accounts** on the listed SaaS tools (most have free tiers; ensure API keys are generated where needed).  \n- **Basic project management setup** (e.g., Trello board or Notion workspace) to track client briefs, deliverables, and revision cycles.  \n- **A reliable internet connection** and a modern browser capable of handling web‑based AI interfaces.  \n- **Optional**: Familiarity with Zapier/Make.com for workflow automation; basic understanding of email deliverability concepts for outbound services.  \n\n## 8. Recommended Next Resources  \n\n- **Prompt Engineering Mastery** – Deep‑dive courses (e.g., “Prompt Engineering for Developers” on Coursera) to sharpen LLM steering skills.  \n- **Advanced Email Deliverability** – Guides on warm‑up strategies, SPF/DKIM setup, and inbox placement (e.g., “The Ultimate Guide to Email Deliverability” by Mailgun).  \n- **Chatbot UX Design** – Resources on conversational flow best practices (e.g., “Designing Voice & Chat Interfaces” by Google).  \n- **Automation Platforms** – Tutorials for Zapier, Make.com, or n8n to fully automate the repurposing pipeline.  \n- **Growth Agency Playbooks** – Books like *“Agency Blueprint”* or *“Predictable Revenue”* to refine client acquisition and upsell tactics.  \n\nBy mastering these foundational concepts and integrating the outlined tools, a beginner can launch"}, {"id": "AI-039", "slug": "5-things-that-break-your-claude-code-app", "title": "5 Things That Will Break Your Claude Code App Before Launch", "category": "Claude Code", "subcategory": "Testing & Reliability", "difficulty": "Intermediate", "description": "Five launch-breaking failures in Claude Code apps and exactly how to fix each one. Custom 404 pages, Sentry error tracking, resilient forms, proper loading states, and error boundaries, with ready-to-use Claude Code prompts for each fix.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Chapter 04, Broken Loading States", "Chapter 05, The Blank White Screen", "Your App Is Ready to Ship.", "Testing & Reliability"], "ai_tools": ["Claude Code", "Claude", "Sentry"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-039_5-things-that-break-your-claude-code-app.html", "summary_file": "summaries/AI-039.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-039 – 5 Things That Will Break Your Claude Code App Before Launch  \n\n- **Category:** Claude Code | **Subcategory:** Testing & Reliability  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide walks developers through the five most common failure points that surface when a Claude Code‑generated front‑end is released to real users. It explains how to detect and remediate dead links, invisible crashes, fragile form handling, inadequate loading feedback, and unguarded component errors. For each symptom, the article supplies a concise Claude Code prompt that can be pasted into the IDE to generate the necessary code automatically, eliminating the need for manual boiler‑plate writing.  \n\nBeyond the individual fixes, the resource emphasizes a systematic reliability mindset: embed a custom 404 page, integrate automated error collection (via Sentry), make forms resilient to backend failures, provide explicit UI states for every asynchronous request, and protect the component tree with error boundaries. By treating these patterns as non‑optional pre‑launch checklist items, developers can ship a polished experience that gracefully degrades rather than crashes outright.\n\n## 2. Why It Matters  \nIn production‑grade web apps, the first interaction a user has with an error heavily influences retention. A missing route, a frozen spinner, or a blank screen erodes trust faster than any missing feature. Implementing the five safeguards described reduces support tickets, improves Net Promoter Scores, and shortens the feedback loop for bug resolution because errors are captured automatically (Sentry) and presented with clear recovery options.  \n\nFrom an engineering efficiency perspective, leveraging Claude Code to generate the boilerplate for 404 pages, error boundaries, and stateful UI components accelerates the reliability‑by‑design phase. Teams can focus on core business logic while the AI handles repetitive, error‑prone scaffolding, leading to faster time‑to‑market without sacrificing quality.\n\n## 3. Target Audience  \n- **Front‑end engineers** building React (or similar) applications with Claude Code assistance.  \n- **Product engineers** responsible for shipping MVPs who need a rapid reliability checklist.  \n- **DevOps / Site‑Reliability engineers** who want to ensure observability (Sentry) is baked in from day one.  \n- **Intermediate‑level developers** comfortable with component‑based UI frameworks and basic CI/CD pipelines, but who may not have deep experience in error‑handling patterns.\n\n## 4. Key Concepts & Principles  \n\n- **Graceful degradation via custom 404 handling** – Detect navigation to undefined routes or missing assets and render a styled fallback page that guides users back to a safe entry point, rather than exposing raw browser errors.  \n- **Observability through automated error tracking** – Integrate a monitoring SDK (Sentry) that captures uncaught exceptions, rejected promises, and contextual metadata (URL, user agent, action trace) so developers receive actionable crash reports without waiting for user complaints.  \n- **Resilient form architecture** – Preserve user input in local component state until the server confirms success, supplement with inline validation, and surface loading, success, and error feedback directly on the submit control.  \n- **Explicit async UI states** – For every data‑fetching call, render three distinct visual cues: a loading skeleton or spinner, an error panel with a retry mechanism, and an empty‑state illustration when the payload is valid but contains no items.  \n- **Error boundaries as containment shields** – Wrap large sections of the component tree in a catch‑all boundary that swaps a friendly error message and reset button when a child throws, preventing a single fault from collapsing the entire UI.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code** – An AI‑driven code generation assistant that can be prompted to scaffold pages, audit assets, and inject reliability patterns directly into the project repository.  \n- **Sentry** – A cloud‑based error‑monitoring platform; the free tier suffices for early‑stage apps. The SDK is installed via npm/yarn, initialized with a DSN, and automatically records unhandled errors and promise rejections.  \n\n*(The guide assumes a React‑style front‑end, but the principles translate to Vue, Svelte, or any component framework.)*\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Deploying a Robust 404 Experience  \n1. **Prompt Claude Code** with a request to generate a 404 component that matches the existing design system (colors, typography, layout).  \n2. Insert the component into the router configuration as the catch‑all route (`*` or `fallback`).  \n3. Ask Claude Code to scan the codebase for `<img>` tags and internal `<a>` links, flagging any that reference missing files or undefined routes.  \n4. Resolve the flagged items or replace them with placeholders, then run a quick local navigation test to confirm the custom page appears for invalid URLs.  \n\n### Use Case 2 – End‑to‑End Error Visibility & Recovery  \n1. **Install Sentry**: `npm install @sentry/react @sentry/tracing` (or the equivalent for your stack).  \n2. **Prompt Claude Code** to add the initialization snippet in the app’s entry point, inserting the DSN you obtained from the Sentry project settings.  \n3. Verify that the SDK captures a test exception (`throw new Error('test')`) and appears in the Sentry dashboard.  \n4. For any runtime error you observe in Sentry, copy the stack trace, paste it back into Claude Code with a prompt to “fix the issue,” and let the AI propose a patch.  \n5. Complement the observability layer by adding a global error boundary (via `react-error-boundary` or a class component) that displays a concise message and a “Retry” button, ensuring the UI remains usable even when a component fails.\n\n## 7. Prerequisites  \n\n- A functional Claude Code workspace with access to the project’s source files.  \n- Node.js environment (≥14) and a package manager (npm or yarn).  \n- Basic familiarity with the routing library used (e.g., React Router).  \n- A Sentry account and a DSN for the target environment (development or production).  \n- Ability to run the app locally to validate UI states (e.g., `npm start` or `vite dev`).  \n\n## 8. Recommended Next Resources  \n\n- **“Implementing Skeleton Loaders in React”** – Deep dive into UI patterns that keep users engaged during data fetches.  \n- **“Advanced Sentry Configuration for Front‑End Apps”** – Covers performance monitoring, release tracking, and source‑map upload.  \n- **“Designing Accessible Error Messages”** – Ensures that fallback UI complies with WCAG guidelines.  \n- **Claude Code Prompt Engineering Guide** – Techniques for crafting precise prompts that yield reliable, production‑ready code snippets.  \n- **React Error Boundaries – Official Documentation** – Explores class‑based vs. hook‑based implementations and best practices for scoping boundaries."}, {"id": "AI-040", "slug": "the-7-boring-automations", "title": "The 7 Boring Automations", "category": "Building & Monetising", "subcategory": "Business Automation", "difficulty": "Intermediate", "description": "Seven high-value automations that real businesses pay for every month. Covers home services, law firms, accounting, dental practices, recruitment, insurance, and property management, with full build steps, tool stacks, pricing, and sales pitches for each.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "What's inside", "Why Boring Wins", "Boring = recurring pain", "Boring = recurring revenue", "Boring = easy to prove", "Boring = same shape every time", "Business Automation"], "ai_tools": ["Claude", "GPT-4", "n8n"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-040_the-7-boring-automations.html", "summary_file": "summaries/AI-040.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-040 - The 7 Boring Automations\n\n- **Category:** Building & Monetising | **Subcategory:** Business Automation  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide presents a repeatable framework for turning everyday, low‑visibility pain points into high‑value, AI‑driven services. It starts by explaining why “boring” tasks—those that drain time, money, and morale—are the most lucrative automation targets. From there, it introduces a **universal stack** (trigger → orchestrator → AI brain → tools → human gate) that can be applied to any industry.  \n\nA five‑phase delivery method is laid out:  \n1. **Audit** the bottleneck and quantify its cost.  \n2. **Map** the workflow in a diagram that isolates decision points.  \n3. **Build & integrate** using n8n or Make, inserting LLM calls only where judgment is required.  \n4. **Test** against real, messy data to ensure reliability.  \n5. **Deploy behind a human gate** and set up monitoring for drift.  \n\nThe guide then walks through seven concrete automations (home services, law, accounting, medical, recruitment, insurance, property management), each with a detailed stack, flow diagram, and pricing model. Finally, it offers a pragmatic “first 30 days” playbook for launching a service business around these automations.  \n\n## 2. Why It Matters  \n- **Recurring revenue**: Boring problems never go away; they need ongoing monitoring, tuning, and ownership, turning a one‑off build into a retainer.  \n- **Clear ROI**: Because the value is expressed in recovered revenue or saved hours, clients can see the return on investment immediately.  \n- **Scalability**: The same architectural pattern can be cloned across dozens of clients, reducing learning curves and speeding up delivery.  \n- **Competitive edge**: Most agencies focus on flashy demos; this guide shows how to capture the “quiet” market that pays well for practical solutions.  \n\n## 3. Target Audience  \n- **Automation consultants** looking to expand their service catalog.  \n- **AI integrators** who already own workflow tools but lack a repeatable delivery model.  \n- **Small‑to‑mid‑size business owners** who want to outsource routine processes without hiring full‑time staff.  \n- **Freelance developers** who can build and sell turnkey solutions.  \n- **Product managers** seeking to prototype AI‑enhanced workflows quickly.  \n\n## 4. Key Concepts & Principles  \n- **Boring Wins**: The most profitable automations solve mundane, recurring pain points that bleed money daily.  \n- **Universal Stack**: A modular pipeline—trigger → orchestrator → LLM → business tools → human gate—that can be swapped out per client.  \n- **Five‑Phase Delivery**: A disciplined approach that turns a problem into a product: audit, map, build, test, deploy.  \n- **Pricing by Value**: Charge based on the dollar amount of pain removed, not on effort or hours spent.  \n\n## 5. Tools & Technologies Mentioned  \n- **n8n**: Open‑source workflow engine; ideal for complex, data‑heavy automations.  \n- **Make (formerly Integromat)**: Visual no‑code builder for rapid prototyping.  \n- **Vapi**: Voice orchestration platform that bundles STT, TTS, and LLM calls into a single API.  \n- **Twilio**: Telephony and SMS provider for inbound/outbound voice and messaging.  \n- **Claude (Anthropic)**: LLM used for judgment, drafting, and extraction tasks.  \n- **ElevenLabs**: Text‑to‑speech engine for natural‑sounding voice responses.  \n- **Xero MCP**: Official Xero micro‑service platform for secure API access.  \n- **Notion / Clio / Asana**: Case‑management tools for legal workflows.  \n- **AppFolio / Buildium**: Property‑management systems for tenant communications.  \n\n## 6. Practical Use Cases & Workflows  \n### 6.1 Home Services Voice Agent  \n1. **Trigger**: Incoming call via Twilio.  \n2. **Orchestrator**: Vapi captures audio, converts to text, sends to Claude.  \n3. **LLM Decision**: Claude triages emergency vs routine, collects lead data.  \n4. **Tool Calls**: Function calls to n8n webhook that checks ServiceTitan calendar, books slot, sends SMS confirmation.  \n5. **Human Gate**: Optional review of unaccepted quotes before final dispatch.  \n6. **Outcome**: 62 % of missed calls answered, jobs booked automatically, follow‑up reminders sent.  \n\n### 6.2 Small Law Firm Intake‑to‑Draft  \n1. **Trigger**: Web form submission (matter type, parties, description).  \n2. **Orchestrator**: Make/n8n fires a scenario.  \n3. **LLM Extraction**: Claude parses facts, checks conflict against client list.  \n4. **Tool Calls**: Create a Notion/Clio brief, auto‑populate with draft letter using the firm’s clause library.  \n5. **Human Gate**: Slack notification to fee‑earner for review; no draft leaves the system without sign‑off.  \n6. **Outcome**: Enquiries answered in minutes, first draft ready, billable hours reclaimed.  \n\n## 7. Prerequisites  \n- **API access**: Twilio, Vapi, Claude, ElevenLabs, Xero MCP, and any client‑specific tools.  \n- **Basic workflow knowledge**: Familiarity with n8n or Make, JSON, webhooks.  \n- **LLM prompting fundamentals**: Ability to craft system prompts and function‑calling schemas.  \n- **Data privacy awareness**: Understanding of GDPR/HIPAA where applicable.  \n- **Billing setup**: Ability to create retainer contracts and track usage costs.  \n\n## 8. Recommended Next Resources  \n- **Advanced Prompt Engineering**: Deep dive into few‑shot, chain‑of‑thought, and retrieval‑augmented prompting.  \n- **Low‑Code Automation Platforms**: Explore Zapier, Power Automate, and their integration limits.  \n- **API Security & Governance**: Learn OAuth2, rate‑limiting, and audit logging best practices.  \n- **AI‑Driven Business Modeling**: Study how to quantify value, build pricing models, and create outcome‑based contracts.  \n- **Data Privacy & Compliance**: GDPR, HIPAA, and industry‑specific regulations for handling sensitive data.  \n\n---"}, {"id": "AI-041", "slug": "claude-power-moves", "title": "Claude Power Moves", "category": "Claude Code", "subcategory": "CLI Workflows", "difficulty": "Intermediate", "description": "Four moves to stop correcting Claude and start delegating to it. Plan mode, the clarifying-questions prompt, bypass permissions, and CLAUDE.md, with the exact commands and settings for each.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "What's inside", "Plan Mode", "Ask Questions", "Bypass Permissions", "The CLAUDE.md File", "The Problem Is Probably You", "CLI Workflows"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-041_claude-power-moves.html", "summary_file": "summaries/AI-041.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-041 – Claude Power Moves  \n\n- **Category:** Claude Code | **Subcategory:** CLI Workflows  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide explains how to shift from a “correct‑and‑repeat” interaction pattern with Claude to a true delegation model. It introduces a four‑step methodology that leverages Claude Code’s built‑in permission layers and a persistent markdown configuration file. First, users learn to activate *plan mode*, a read‑only state where Claude can scan the repository, propose a detailed execution plan, and solicit clarification without touching any files. Second, the guide shows how to embed a “clarifying‑questions‑first” directive so Claude only proceeds once it reaches a high confidence threshold, eliminating most guesswork. Third, once the plan is approved, the workflow switches to a *bypass‑permissions* mode that lets Claude run the entire sequence of edits autonomously, dramatically reducing latency caused by per‑step approvals. Finally, the material describes the purpose and maintenance of a project‑level `CLAUDE.md` file that acts as a long‑term memory store for conventions, preferences, and learned rules, keeping the model aligned across sessions. Together, these techniques form a repeatable architecture for reliable, hands‑off code generation and refactoring within the Claude Code environment.  \n\n## 2. Why It Matters  \nIn typical AI‑assisted development cycles, developers spend a disproportionate amount of time iterating on prompts and correcting unexpected edits. By front‑loading alignment (plan mode + targeted questioning) and then granting Claude uninterrupted execution, teams can cut the number of feedback loops by an order of magnitude. This not only accelerates delivery but also reduces cognitive load, allowing engineers to focus on higher‑level design decisions rather than micromanaging each change. Moreover, the `CLAUDE.md` artifact creates a lightweight, version‑controlled knowledge base that persists across sessions, ensuring consistency and making onboarding of new team members or AI agents faster. The combination of safety (plan mode, explicit permission bypass) and speed (single‑pass execution) makes the approach suitable for both isolated sandbox projects and trusted production pipelines.  \n\n## 3. Target Audience  \n- **Software engineers** who already use Claude Code for code assistance and want to scale its usage beyond ad‑hoc suggestions.  \n- **DevOps / tooling specialists** responsible for integrating AI assistants into CI/CD or local development environments.  \n- **Technical leads** seeking a repeatable process to delegate routine refactoring, scaffolding, or documentation tasks to an LLM while maintaining governance.  \n- **Intermediate‑level AI practitioners** familiar with prompt engineering but looking for structured workflow patterns rather than trial‑and‑error prompting.  \n\n## 4. Key Concepts & Principles  \n\n- **Plan‑Only Mode**: A read‑only permission setting where Claude can explore the codebase, generate a step‑by‑step plan, and ask clarification questions, but cannot modify any files until the user explicitly approves the plan.  \n\n- **Confidence‑Driven Questioning**: Embedding a directive that forces Claude to ask sequential clarification queries until it reaches a predefined certainty level (e.g., 95 %). This eliminates hidden assumptions and reduces downstream correction cycles.  \n\n- **Permission Bypass (Uninterrupted Execution)**: After the plan is locked, the model can be launched with a flag that suppresses per‑action confirmations, allowing it to apply all edits in one continuous run while still respecting deny‑rules and safety classifiers.  \n\n- **Persistent `CLAUDE.md` Memory**: A markdown file automatically loaded at session start that stores project‑specific conventions, style guides, and learned preferences. Keeping it concise (≈200 lines) preserves prompt context and ensures the model consistently respects the documented rules.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code CLI**: The command‑line interface that provides mode switching, permission control, and integration with local file systems. It is the primary execution environment for the described workflow.  \n\n- **`claude` Command**: The executable used to launch Claude with specific flags, such as `--permission-mode plan` for plan‑only sessions or `--dangerously-skip-permissions` for full bypass.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Automated Refactor of a Legacy Module  \n1. **Initialize Plan Mode**  \n   ```bash\n   claude --permission-mode plan\n   ```  \n2. **Describe Goal** – “Modernize `utils.js` to use ES6 modules, add JSDoc, and enforce the project’s lint rules.”  \n3. **Claude scans the repository**, lists affected files, and returns a multi‑step plan (e.g., backup, convert `require` → `import`, run lint fix, add docs).  \n4. **Insert Clarifying Prompt** at the top of the request:  \n   ```\n   Before proceeding, ask me any clarification questions until you are 95% confident about the intended changes. Do not assume anything.\n   ```  \n5. **Answer Claude’s questions** until the confidence threshold is met.  \n6. **Approve the plan** – the CLI automatically exits plan mode.  \n7. **Run with Bypass**:  \n   ```bash\n   claude --dangerously-skip-permissions\n   ```  \n8. **Review final report** generated by Claude; commit the changes if the output matches expectations.  \n\n### Use Case 2 – Generating Consistent Project Documentation  \n1. **Create/Update `CLAUDE.md`** with a section:  \n   ```markdown\n   ## Documentation Style  \n   - Use Markdown headings H2 for top‑level sections.  \n   - Include a “Purpose” paragraph at the start of every file.  \n   - Limit line length to 100 characters.  \n   ```  \n2. **Start a new session**; Claude automatically loads the updated `CLAUDE.md`.  \n3. **Enter Plan Mode** (`claude --permission-mode plan`) and ask Claude to produce README files for three micro‑services.  \n4. **Claude asks clarification** (e.g., “Should the API reference be generated from JSDoc or manually written?”). Answer until confidence is high.  \n5. **Approve the plan**; Claude proceeds in bypass mode to write the README files directly into the repository.  \n6. **Commit** the generated docs, knowing they adhere to the style rules stored in `CLAUDE.md`.  \n\n## 7. Prerequisites  \n\n- A functional Claude account with access to Claude Code (desktop, IDE plugin, or CLI).  \n- Installation of the Claude Code CLI (`npm install -g @anthropic/claude-code` or equivalent).  \n- Basic familiarity with JSON configuration files (`.claude/settings.json`).  \n- A Git‑tracked codebase where you have write permissions.  \n- Optional: Knowledge of the project’s deny‑rule policy to safely use the bypass flag.  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code – Permission Modes Deep Dive** – Explores fine‑grained allow/deny rule creation and safe sandboxing.  \n- **Prompt Engineering for LLMs** – Covers techniques for shaping model behavior beyond the “plan‑first” pattern.  \n- **Version‑Controlled AI Prompt Repositories** – Guides on storing prompts, `CLAUDE.md`, and model configurations alongside code.  \n- **Automated Safety Classifiers in Claude** – Details on the built‑in classifier that reviews actions in Auto mode, useful for teams that need a middle ground between full bypass and per‑step approval."}, {"id": "AI-042", "slug": "your-brutally-honest-ai-cofounder", "title": "Your Brutally Honest AI Cofounder", "category": "Prompts & Skills", "subcategory": "Custom Skills", "difficulty": "Beginner", "description": "Drop Sam Altman's Startup Playbook into Claude and pressure-test your idea. The full cofounder prompt scores your idea across five fronts and surfaces the quiet ways you're most likely to kill it yourself.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "What's inside", "The Opportunity", "The Rule That Matters Most", "Read & Forget", "Run It Through Claude", "The Three Inputs", "Custom Skills"], "ai_tools": ["Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-042_your-brutally-honest-ai-cofounder.html", "summary_file": "summaries/AI-042.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-042 - Your Brutally Honest AI Cofounder  \n\n- **Category:** Prompts & Skills | **Subcategory:** Custom Skills  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide demonstrates how to turn Sam Altman’s free “Startup Playbook” into an automated, no‑code co‑founder that critiques a nascent business concept. By feeding three discrete inputs—(1) the full text of the Playbook, (2) a specially crafted prompt that instructs Claude to act as a brutally honest partner, and (3) a concise description of the user’s idea—learners acquire a repeatable pattern for rapid, structured validation. The process leverages Claude’s large‑language‑model reasoning to score the idea across five critical dimensions (problem‑market fit, product love, defensibility, first‑move tactics, and timing) and to surface the most dangerous self‑inflicted pitfalls.  \n\nBeyond the mechanics of copy‑pasting, the tutorial embeds a mindset shift: rather than treating the Playbook as a one‑off reading assignment, it becomes an active evaluation engine that forces founders to confront hidden weaknesses before committing development resources. The architecture is deliberately lightweight—no code, no API keys, just a free Claude account—making it accessible to anyone with a web browser.\n\n## 2. Why It Matters  \nIn early‑stage ventures, the biggest failure mode is founder‑driven “suicide”—mis‑aligned product decisions, premature scaling, or ignoring market signals. Traditional validation methods (surveys, MVPs) can be time‑consuming and still miss systemic blind spots. By automating a pressure‑test against a distilled body of YC wisdom, founders obtain an immediate, data‑light diagnostic that highlights the highest‑leverage corrective action. This reduces wasted engineering cycles, shortens the feedback loop, and aligns the team around concrete, evidence‑based priorities. Moreover, the approach democratizes access to high‑quality mentorship: anyone with internet access can replicate a seasoned co‑founder’s critical eye without paying for consulting fees.\n\n## 3. Target Audience  \n- **First‑time founders** who need a quick sanity check before building an MVP.  \n- **Side‑hustle creators** looking for a low‑cost way to validate market potential.  \n- **Product managers** in early‑stage startups who want an external, unbiased audit of a concept.  \n- **Innovation coaches or incubator mentors** seeking a repeatable, scalable assessment tool for multiple teams.  \nAll of the above benefit from a minimal technical setup and a focus on strategic, not tactical, feedback.\n\n## 4. Key Concepts & Principles  \n\n- **Prompt‑Driven Evaluation**: The core idea is to encode a set of evaluation criteria inside a natural‑language prompt, allowing the LLM to act as a rule‑based assessor without any programming.  \n- **Five‑Front Scoring Framework**: The Playbook’s wisdom is operationalized into five categories—Problem & Market, Product Love, Unfair Edge, First Moves, and Why Now—each receiving a 0‑10 rating plus a concise justification.  \n- **Self‑Sabotage Detection**: The prompt explicitly asks the model to surface the founder’s most likely “suicide” mistake, shifting focus from external threats to internal execution risks.  \n- **Iterative Pressure‑Testing**: After acting on the top recommendation, the user can re‑run the same workflow with an updated idea description, creating a rapid loop of hypothesis‑refinement.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic’s conversational LLM)**: Serves as the inference engine that parses the Playbook, interprets the co‑founder prompt, and generates the multi‑dimensional feedback. No API key is required for the free web interface.  \n- **Sam Altman’s Startup Playbook**: A publicly available PDF/HTML document that aggregates YC’s core startup doctrines; it provides the knowledge base against which Claude evaluates the idea.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Quick Idea Vetting  \n1. Open a fresh Claude chat window to avoid context contamination.  \n2. Copy the entire Startup Playbook text and paste it as the first message.  \n3. Immediately paste the “co‑founder” prompt (provided in the guide) beneath the Playbook.  \n4. Write a 3‑5 sentence summary of your product, target audience, and revenue model.  \n5. Submit the combined input.  \n6. If Claude asks a clarification, answer succinctly, then let it return the full analysis.  \n7. Review the five scores, the ranked vulnerabilities, the self‑sabotage hypothesis, and the single high‑impact action.  \n8. Execute the recommended action, then repeat the process with an updated description to measure improvement.  \n\n### Use Case 2 – Portfolio Review for an Incubator  \n1. Collect each startup’s one‑pager (problem, solution, market, monetization).  \n2. For each, open a separate Claude session and repeat steps 2‑5 from Use Case 1.  \n3. Export Claude’s structured output (scores, weaknesses, action items) into a spreadsheet.  \n4. Prioritize mentorship resources toward the startups with the lowest scores or highest self‑sabotage risk.  \n5. Re‑run the assessment after each cohort’s milestone to track progress quantitatively.  \n\n## 7. Prerequisites  \n\n- A free Claude account (web‑based chat).  \n- Access to Sam Altman’s Startup Playbook (downloadable from playbook.samaltman.com).  \n- Ability to write a clear, honest one‑paragraph description of your idea.  \n- Basic familiarity with copy‑paste operations and web navigation; no programming or API configuration required.  \n\n## 8. Recommended Next Resources  \n\n- **“Prompt Engineering for LLMs”** – deeper techniques for shaping model behavior beyond simple prompts.  \n- **Y Combinator’s “How to Start a Startup” lecture series** – expands on the concepts embedded in the Playbook.  \n- **Anthropic’s Claude documentation** – covers advanced features like system messages, temperature control, and token limits for more nuanced assessments.  \n- **Lean Startup Validation Canvas** – a complementary framework for building experiments after the initial AI‑driven diagnosis."}, {"id": "AI-043", "slug": "the-competitor-intelligence-engine", "title": "The Competitor Intelligence Engine", "category": "Building & Monetising", "subcategory": "Monetisation Strategy", "difficulty": "Advanced", "description": "The first service sold to a paying client, built end to end. A system that scrapes competitor content on a schedule, analyses it, finds the gaps, and delivers content drafts in the client's voice. Full architecture, stack, schema, and n8n workflow.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "What's inside", "The Service We Sold", "BEFORE: Manual & guesswork", "AFTER: A running engine", "The Architecture", "The Stack", "Monetisation Strategy"], "ai_tools": ["Claude Code", "Claude Haiku", "Claude", "n8n", "Apify", "Supabase"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-043_the-competitor-intelligence-engine.html", "summary_file": "summaries/AI-043.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-043 – The Competitor Intelligence Engine  \n\n- **Category:** Building & Monetising | **Subcategory:** Monetisation Strategy  \n- **Difficulty:** Advanced  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \n\nThis guide walks the reader through the end‑to‑end construction of a fully automated competitor‑watching service that turns raw social‑media posts into a weekly intelligence brief and ready‑to‑publish content drafts. The core learning outcome is how to stitch together a multi‑layer pipeline—scraping, storage, AI‑driven analysis, gap detection, content generation, and delivery—using a combination of low‑code orchestration (n8n), managed data services (Supabase), third‑party scrapers (Apify), and Anthropic’s Claude models.  \n\nBeyond the technical stack, the material demonstrates a productisation mindset: the system is sold as a managed SaaS‑style offering rather than a one‑off prompt collection. Readers see how to design a repeatable architecture, keep operational costs low through model tiering and batch API calls, and package the solution with clear pricing tiers (setup fee + monthly retainer).  \n\n## 2. Why It Matters  \n\nIn a landscape where many agencies rely on manual competitor audits, an automated engine creates a defensible moat. It delivers quantifiable market intelligence every week without human intervention, turning a traditionally labor‑intensive activity into a recurring revenue stream. By normalising data at ingestion and persisting structured analysis, the pipeline enables rapid querying, trend spotting, and content ideation that are far more accurate than guesswork.  \n\nFrom an AI‑ops perspective, the guide showcases best practices for cost‑effective LLM usage: cheap “filter” models (Claude Haiku) prune low‑value items, while a more capable model (Claude Sonnet) handles the heavy analytical work. Batch requests cut API spend by roughly half, and caching of system prompts guarantees consistent brand voice while avoiding repeated prompt engineering. The result is a scalable, low‑maintenance service that can be replicated across clients and niches.  \n\n## 3. Target Audience  \n\n- **AI product engineers** who need to build end‑to‑end pipelines that combine scraping, data warehousing, and LLM reasoning.  \n- **Growth/marketing consultants** looking to add a high‑margin, data‑driven service to their portfolio.  \n- **Technical founders** interested in turning a niche AI workflow into a subscription business.  \n- **DevOps / low‑code specialists** comfortable with n8n, Supabase, and CI/CD pipelines, and who can manage API keys and scheduled jobs.  \n\nA solid grasp of TypeScript/JavaScript, REST APIs, and relational databases is assumed; prior exposure to LLM prompting is helpful but not mandatory.  \n\n## 4. Key Concepts & Principles  \n\n- **Layered Pipeline Architecture** – The system is split into six sequential layers (Ingestion → Store → Analyse → Gap Detection → Generate → Deliver). Each layer has a single responsibility, produces a clean JSON contract, and can be unit‑tested in isolation before wiring to the next stage.  \n\n- **Schema‑First Normalisation** – All scraped payloads are mapped to a unified `posts` table at ingest time. This eliminates downstream field‑mapping logic and guarantees that downstream LLM calls receive a predictable structure.  \n\n- **Cost‑Optimised Model Strategy** – Use a cheap model (Claude Haiku) to filter out obvious low‑performers, then feed the remaining items to a higher‑tier model (Claude Sonnet). Batch the weekly analysis calls to leverage the 50 % discount offered by the Claude batch endpoint.  \n\n- **Voice‑Profile Prompt Caching** – Build a static system prompt (`/voice/profile.md`) that captures the client’s tone, preferred phrasing, and prohibited words. Store this prompt in a file or Supabase row and reference it on every generation request, ensuring brand consistency without re‑sending the full prompt each time.  \n\n## 5. Tools & Technologies Mentioned  \n\n| Tool | Role in the Engine | Typical Commands / Config |\n|------|-------------------|---------------------------|\n| **Apify** | Executes pre‑built “actors” that scrape Instagram, TikTok, and YouTube. Handles rotating proxies and anti‑scraping defenses. | In n8n: *Apify → Run Actor* node with `actorId=instagram-scraper`, `input={handles:[…]}`, `waitForFinish=true`. |\n| **Supabase** | Hosted PostgreSQL + auto‑generated API layer. Stores normalized posts, analysis JSON, and generated drafts. | `supabase db push` for migrations; `INSERT INTO posts (…) VALUES (…) ON CONFLICT (platform, post_id) DO UPDATE …`. |\n| **Claude API (Anthropic)** | Provides LLM reasoning for classification, gap detection, and draft generation. | `curl https://api.anthropic.com/v1/messages -H \"x-api-key: $ANTHROPIC_KEY\" -d '{\"model\":\"claude-sonnet-4-6\",\"messages\":[…],\"max_tokens\":…}'`. |\n| **n8n** | Low‑code workflow orchestrator that schedules the weekly run, connects all nodes, and pushes results to Slack/Notion. | Create a *Cron* trigger (e.g., `0 6 * * MON`), then chain *Supabase → Apify → Code → Claude → Notion* nodes. |\n| **Claude Code** | Terminal‑based AI assistant that scaffolds the TypeScript repo, writes migration files, and generates code snippets on demand. | `claude-code init` → creates `src/`, `.env.example`; `claude-code add ingestion` → writes ingestion module. |\n| **Next.js (optional)** | Front‑end dashboard for clients to view the competitor feed, weekly brief, and approve/reject drafts. | `npx create-next-app@latest dashboard && cd dashboard && npm install @supabase/supabase-js`. |\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Deploy a Weekly Competitor‑Intelligence Engine for a SaaS Brand  \n\n1. **Provision Infrastructure** – Spin up a Supabase project, enable the Postgres database, and create an API key.  \n2. **Configure n8n** – Install n8n on Railway or a VPS, add environment variables for Apify, Supabase, and Anthropic keys.  \n3. **Create the Posts Table** – Run the supplied SQL migration (see Section 4) via Supabase SQL editor.  \n4. **Set Up Scrapers** – In n8n, add two *Apify Run Actor* nodes (Instagram & TikTok) with the client’s competitor handles as input. Enable “wait for finish”.  \n5. **Normalise & Upsert** – Use a *Code* node (JavaScript) to map actor output to the unified schema, then call Supabase’s `upsert` endpoint.  \n6. **Batch Analyse** – Invoke Claude’s batch endpoint with the week’s new rows, passing a JSON schema that forces output fields (`hook_type`, `format`, `topic`, `pillar`, `engagement_score`, `why_it_worked`). Store the JSON in `posts.analysis`.  \n7. **Detect Gaps** – Run a second Claude call (once per week) that receives the aggregated analysis and returns the intelligence brief JSON (top patterns, rising/fading topics, gaps, recommended mix).  \n8. **Generate Drafts** – For each gap, call Claude with the cached voice profile and a prompt that specifies hook, format, and pillar. Persist drafts in a `drafts` table with status `pending_review`.  \n9. **Deliver** – Push the brief and draft links to a Notion page and a Slack channel via n8n’s *Notion* and *Slack* nodes. Optionally expose a Next.js dashboard for client approvals.  \n\n### Use Case 2 – Turn the Engine into a White‑Label SaaS Product  \n\n1. **Parameterise Handles** – Store each client’s competitor list in a `clients` table; the n8n workflow reads the list dynamically.  \n2. **Multi‑Tenant Supabase Schema** – Add a `client_id` foreign key to `posts`, `analysis`, and `drafts` tables; enforce row‑level security policies so each tenant only sees its own data.  \n3. **Dynamic Voice Profiles** – When onboarding a new client, run a one‑off Claude call that analyses the client’s top 20 owned posts and writes a `/voice/profile_{client_id}.md` file. Store the file path in the `clients` table.  \n4. **Billing Automation** – Integrate Stripe with n8n to create a subscription per client; on each successful payment, trigger the weekly pipeline for that client only.  \n5. **Monitoring & Alerts** – Add n8n error‑handling branches that send a Slack alert if any Apify actor fails or if Claude returns an error status.  \n\n## 7. Prerequisites  \n\n- **Developer tooling**: Node ≥ 18, npm/yarn, Git.  \n- **API access**: Valid keys for Apify (actor execution), Anthropic (Claude), Supabase (service_role), and optionally Notion/Slack.  \n- **Database knowledge**: Ability to run SQL migrations and understand JSONB columns in PostgreSQL.  \n- **n8n familiarity**: Creating workflows, using the *Code* node, and configuring cron triggers.  \n- **Basic prompting skill**: Crafting system prompts that enforce JSON output and brand voice.  \n\n## 8. Recommended Next Resources  \n\n- **“Prompt Engineering for Structured Output”** – Deep dive into JSON‑schema‑guided prompting with Claude and other LLMs.  \n- **“Scaling Low‑Code Orchestration with n8n”** – Advanced patterns for error handling, parallelism, and secret management.  \n- **“Building Multi‑Tenant SaaS on Supabase”** – Row‑"}, {"id": "AI-044", "slug": "how-to-reduce-claude-token-usage", "title": "How to Reduce Claude Token Usage", "category": "Getting Started", "subcategory": "Usage & Optimization", "difficulty": "Beginner", "description": "Ten practical techniques to stop burning through your Claude usage limit without losing output quality. Covers model routing, effort levels, batching context, output caps, and memory files for long-running projects.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "What's inside", "The Prompt", "Template", "Usage & Optimization"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-044_how-to-reduce-claude-token-usage.html", "summary_file": "summaries/AI-044.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-044 – How to Reduce Claude Token Usage  \n\n- **Category:** Getting Started | **Subcategory:** Usage & Optimization  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide equips users with a toolbox of ten concrete tactics for stretching the token budget when working with Anthropic’s Claude models, especially the top‑tier “most capable” variants. It explains how the internal “effort dial” influences token consumption, why sending prompts in large batches is cheaper than turn‑by‑turn interaction, and how to deliberately cap the model’s output length.  \n\nBeyond the mechanics, the article establishes a decision‑making framework that treats the most powerful Claude model as a planner/orchestrator while delegating the heavy‑lifting to cheaper sub‑models (e.g., Sonnet). By pairing this routing mindset with explicit effort‑level tags, goal‑oriented prompts, and persistent memory files, practitioners can keep usage within the limits of Pro, Max, Team, or Enterprise plans without sacrificing answer quality.  \n\n## 2. Why It Matters  \nToken consumption translates directly into cost and session‑time constraints on Claude‑based applications. Unchecked usage can exhaust the 5‑hour daily window or weekly quota, forcing users to pause work or upgrade plans. Implementing the recommended habits reduces waste by up to 50 % in many real‑world scenarios, allowing teams to allocate the expensive “high‑effort” model only to problems that truly need deep reasoning. This efficiency gain is especially critical for long‑running projects, automated agents, or any workflow that repeatedly calls Claude in a loop.  \n\n## 3. Target Audience  \n- **Product managers** building AI‑augmented features who need to forecast usage costs.  \n- **Developers / Prompt engineers** integrating Claude into SaaS tools, chatbots, or internal assistants.  \n- **Data scientists** experimenting with Claude Code for code‑review or multi‑step analysis pipelines.  \n- **Technical writers** who want to generate content at scale while staying within budget.  \nAll of the above should have at least a basic familiarity with Claude’s model families (Sonnet, Claude‑3‑Opus, etc.) and access to an Anthropic subscription plan.  \n\n## 4. Key Concepts & Principles  \n\n- **Effort‑Level Tuning**: Claude Code exposes a parameter that controls how much internal reasoning is applied. Lower levels (e.g., *low* or *medium*) are ideal for simple Q&A, while *high* or *xhigh* should be reserved for multi‑step or code‑review tasks. Explicitly stating the desired level in the prompt prevents the model from defaulting to maximum effort and burning extra tokens.  \n\n- **Planner‑Executor Split**: Use the most capable model solely to outline a plan, then hand off each sub‑task to a cheaper model (commonly Sonnet). This “orchestrator” pattern leverages the strengths of each tier without paying the premium for full‑stack execution.  \n\n- **Batch‑First Prompting**: Provide all necessary context—background, constraints, and desired output format—in a single message. Avoid incremental “drip‑feeding” because each new turn forces the model to re‑run its reasoning cycle, inflating token usage.  \n\n- **Explicit Output Capping**: Attach a concrete word‑ or bullet‑count limit to every request (e.g., “max 250 words” or “no more than 5 bullet points”). Claude can otherwise generate up to 128 k tokens in one go, which is rarely needed and can quickly deplete the quota.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (most capable models)** – The primary LLM used for high‑level planning and complex reasoning. Operates under a 2× usage multiplier on subscription plans.  \n- **Sonnet** – A lower‑cost Claude variant suited for execution of routine content creation, standard coding, and short‑form research. Recommended for the bulk of day‑to‑day tasks.  \n- **Claude Code** – The interface that exposes the effort‑level knob and supports agentic sub‑calls. Provides a status bar showing remaining session time and weekly budget.  \n- **Memory Files (e.g., `DECISIONS.md`)** – Persistent markdown files that store decisions, constraints, and outcomes across sessions, reducing the need to resend the same context.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Large‑Scale Code Refactor  \n1. **Planning Prompt (high‑effort)**:  \n   ```text\n   Use the most capable model to outline a refactor plan for the repository at /src, targeting modularization and type safety. Return a bullet list of steps and required files.\n   ```  \n2. **Execution Loop (Sonnet, low‑effort)**:  \n   - For each step, send a concise Sonnet prompt: “Apply step 1 to file X, output the diff only, keep under 200 words.”  \n   - Append the diff to a `CHANGES.md` file.  \n3. **Memory Update**: After each step, have Claude write a short entry to `DECISIONS.md` summarizing the rationale and any constraints.  \n4. **Final Review**: Run a single high‑effort Claude call to verify that all success criteria are met, capping the output to 300 words.  \n\n### Use Case 2 – Multi‑Stage Market Research Report  \n1. **Context Batch**: Gather raw articles, data tables, and research questions into a single prompt. Include a directive: “Produce a 5‑section report, each section ≤ 150 words, bullet‑point summary only.”  \n2. **Effort Setting**: Tag the request with `medium` effort because the task is summarisation, not deep reasoning.  \n3. **Output Cap**: Explicitly request “no more than 750 words total.”  \n4. **Memory File**: Store the final report in `REPORT.md` and log key insights in `DECISIONS.md` for future reference.  \n\n## 7. Prerequisites  \n\n- Active Anthropic subscription with access to both the most capable Claude model and Sonnet.  \n- Familiarity with Claude’s API or web UI, including how to set the `effort` parameter.  \n- Basic scripting environment (e.g., Python with `anthropic` SDK) to automate batch prompts and file handling.  \n- A version‑controlled repository or cloud storage location for persisting memory files (`DECISIONS.md`, etc.).  \n\n## 8. Recommended Next Resources  \n\n- **Anthropic API Reference** – Deep dive into request payloads, token accounting, and model selection.  \n- **Prompt Engineering Playbook** – Strategies for crafting goal‑oriented prompts and minimizing token waste.  \n- **Agentic Workflow Design Patterns** – How to orchestrate multiple sub‑agents safely while monitoring concurrent usage.  \n- **Cost‑Optimization Dashboard Guides** – Setting up alerts and visualizations for daily/weekly token consumption.  \n\n---  \n\n*By internalizing the routing habit—delegating simple work to Sonnet, reserving the top‑tier model for planning, and consistently applying effort levels and output caps—teams can transform token budgeting from a reactive concern into a predictable, repeatable part of their Claude‑powered pipelines.*"}, {"id": "AI-045", "slug": "build-digital-product-claude-canva", "title": "Build a Digital Product With Claude + Canva", "category": "Building & Monetising", "subcategory": "Startup & Products", "difficulty": "Beginner", "description": "The exact process for turning one prompt into a finished, sellable digital product using Claude and Canva. Covers the prompt structure, formatting for Canva, template workflow, the native Canva connector, and a reusable formula for any product type.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "The Opportunity", "Step 1 - Write The Prompt", "Step 2 - Structure It For Canva", "Step 3 - Build It In Canva", "Option A: Drop it into a template", "Startup & Products"], "ai_tools": ["Claude", "Canva"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-045_build-digital-product-claude-canva.html", "summary_file": "summaries/AI-045.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-045 - Build a Digital Product With Claude + Canva  \n\n- **Category:** Building & Monetising | **Subcategory:** Startup & Products  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide demonstrates a repeatable, end‑to‑end pipeline for turning a single natural‑language prompt into a market‑ready digital asset—without any prior design expertise. It first shows how to craft a precise prompt that instructs Claude (Anthropic’s conversational model) to generate the full body of the product, then how to ask Claude to reshape that output into a page‑by‑page structure that aligns perfectly with Canva’s layout blocks.  \n\nThe second half of the workflow covers two practical ways to bring the formatted text into Canva: (a) manually pasting the content into a pre‑designed template, and (b) leveraging Claude’s built‑in Canva connector to automate the design creation from within the chat interface. The material culminates in a compact “formula” that can be reused for any niche digital product, from meal plans to Instagram template packs, enabling creators to spin up a sellable file in a single evening.  \n\n## 2. Why It Matters  \nTraditional digital‑product creation is bottlenecked by two separate skill sets: copywriting and visual design. By delegating the writing to Claude and the styling to Canva, the process collapses a week‑long effort into a few hours, dramatically lowering the entry barrier for solo entrepreneurs and side‑hustlers. The approach also maximises the value of free‑tier accounts—Claude’s free quota and Canva’s basic plan are sufficient for a first launch—so cash‑flow‑constrained creators can test ideas without upfront software costs.  \n\nFrom a strategic perspective, the method creates a rapid‑prototype loop: an idea can be validated, packaged, and listed for sale within a day, allowing creators to iterate on market feedback at speed. The reusable prompt formula further standardises output, ensuring consistency across product lines and reducing cognitive load for future launches.  \n\n## 3. Target Audience  \n- **Aspiring solopreneurs** who want to monetize knowledge without hiring writers or designers.  \n- **Content marketers** looking for a fast way to produce lead‑magnet assets (e.g., checklists, guides).  \n- **Freelance creators** who need a repeatable system for client deliverables such as workout plans or recipe cards.  \n- **Beginner‑level AI enthusiasts** comfortable with chat interfaces but lacking design software expertise.  \n\n## 4. Key Concepts & Principles  \n\n- **Prompt Precision**: A well‑scoped prompt must specify product type, target persona, desired outcome, page count, tone, and a directive to format for Canva. This eliminates ambiguity and yields a ready‑to‑use draft.  \n- **Page‑Shape Normalisation**: By instructing Claude to output each page as a title, a brief paragraph, and up to five bullet points, the content aligns with a single Canva template, removing the need for manual re‑arrangement.  \n- **Two‑Path Design Integration**:  \n  - *Template Insertion*: Manually replace placeholder text in a Canva template that matches the product genre.  \n  - *Connector Automation*: Activate Claude’s native Canva connector to create or edit designs directly from the chat, keeping the workflow within a single UI.  \n- **Reusable Prompt Skeleton**: A compact “fill‑in‑the‑blank” formula that can be stored in a note‑taking app and executed in under a minute for any new product concept.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic)** – A conversational LLM used for content generation and formatting. It receives the initial product prompt and a secondary formatting prompt, returning structured text ready for design.  \n- **Canva** – A cloud‑based design platform offering free templates, drag‑and‑drop editing, and a native connector that lets Claude push designs straight into a user’s Canva workspace.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Manual Template Workflow (Ideal for first‑time creators)  \n1. **Define the product**: Write a prompt following the “Create a [product] for [audience] who want [outcome]…” pattern.  \n2. **Generate content**: Submit the prompt to Claude; receive the full draft.  \n3. **Structure for design**: Immediately follow with the formatting prompt (“Break this into individual pages…”) to get page‑shaped chunks.  \n4. **Select a Canva template**: Search Canva using the exact product name (e.g., “7‑day meal plan”) and pick a layout that includes title, body, and bullet placeholders.  \n5. **Populate the template**: Copy each page’s title, paragraph, and bullets into the corresponding placeholders on the Canva canvas.  \n6. **Export**: Download the finished PDF or PNG set for distribution.  \n\n### Use Case 2 – Connector‑Driven Automation (Best for rapid scaling)  \n1. **Connect Claude to Canva**: In Claude’s settings, enable the Canva connector and authenticate the Canva account.  \n2. **Activate the connector per session**: In a new chat, toggle the Canva tool on.  \n3. **Run the same two prompts** (content + formatting) to obtain structured text.  \n4. **Issue a design command**: Prompt Claude with a concise instruction such as “Create a modern‑style Canva design for my 7‑day meal plan, one page per day plus a shopping list page, using the formatted content.”  \n5. **Review in Canva**: Claude will generate a new design file in the linked Canva account; open Canva to make any minor tweaks.  \n6. **Export**: Publish the asset directly from Canva.  \n\n## 7. Prerequisites  \n\n- A free (or paid) Claude account with access to the chat interface.  \n- A Canva account (free tier suffices for basic templates).  \n- Basic familiarity with copy‑and‑paste operations and navigating Canva’s template library.  \n- Optional: Internet connection capable of handling file uploads/downloads.  \n\n## 8. Recommended Next Resources  \n\n- **Prompt Engineering for LLMs** – Deep‑dive tutorials on crafting high‑precision prompts for content generation.  \n- **Canva Design Fundamentals** – Short courses covering template customization, brand kit setup, and export settings.  \n- **Claude API Integration Guide** – For developers who want to script the content‑generation step or batch‑process multiple products.  \n- **Digital Product Marketplace Playbooks** – Guides on pricing, landing‑page creation, and fulfillment (e.g., Gumroad, Shopify Digital Downloads).  \n\n---  \n\n*By internalising the prompt formula and the two Canva integration paths, creators can reliably produce polished digital products on a nightly schedule, turning ideas into revenue streams with minimal overhead.*"}, {"id": "AI-046", "slug": "how-to-get-most-out-of-claude-fable-5", "title": "How to Get the Most Out of Claude Fable 5", "category": "Getting Started", "subcategory": "Core Fundamentals", "difficulty": "Beginner", "description": "Anthropic's most powerful model, included free on Pro and Max plans until June 22. Fact-checked benchmarks, the four use cases where Fable 5 pulls furthest ahead, a two-minute setup guide, and how to prompt it differently.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "What Fable 5 Actually Is", "The Free Window", "The Benchmarks, Fact-Checked", "Where Fable 5 Shines", "Setup Guide", "Prompt It Differently", "Core Fundamentals"], "ai_tools": ["Claude Code", "Claude Fable 5", "Claude", "GPT-5", "Gemini", "Cursor"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-046_how-to-get-most-out-of-claude-fable-5.html", "summary_file": "summaries/AI-046.md", "copyright_st
