prompts (e.g., summarize, identify margins, build pivot, chart) gives the model context and improves accuracy.  \n- **Pivot Table Automation**: Copilot can generate pivot tables on demand, eliminating the manual drag‑and‑drop process and ensuring consistent field selection.  \n- **Chat‑Based Exploratory Analysis**: Switching to chat mode allows users to pose “what‑if” scenarios and receive textual explanations without altering the workbook, supporting hypothesis testing before committing to visualizations.  \n\n## 5. Tools & Technologies Mentioned  \n- **Microsoft Excel Copilot**: An AI assistant integrated into Excel that processes natural‑language prompts, generates tables, charts, and forecasts, and can operate in edit or chat mode.  \n- **Power Query**: Suggested for consolidating data from multiple workbooks into a single table, ensuring Copilot has a unified dataset to work with.  \n\n## 6. Practical Use Cases & Workflows  \n- **Use Case 1: Monthly Health Check**  \n  1. **Prepare**: Store the workbook on OneDrive/SharePoint, enable AutoSave, and convert the data range to a table (`Ctrl+T`).  \n  2. **Open Copilot**: Launch the Copilot pane.  \n  3. **Prompt Sequence**:  \n     - “Summarize revenue by service type for the last three months.”  \n     - “Identify which service contributes most to margin.”  \n     - “Create a pivot table of revenue and margin by service and month.”  \n     - “Generate a line chart of revenue trends per service.”  \n  4. **Review**: Inspect the generated visuals and pivot; adjust if necessary.  \n  5. **Chat**: Ask follow‑up questions such as “What’s driving the margin difference between Service A and Service B?”  \n\n- **Use Case 2: Forecasting & Cross‑Workbook Integration**  \n  1. **Data Consolidation**: Use Power Query to merge the current month’s revenue sheet with the previous month’s expenses workbook into a single table.  \n  2. **Copilot Prompt**: “Forecast next quarter’s revenue by service type based on the current trend.”  \n  3. **Result**: Receive projected figures and a chart illustrating the forecast.  \n  4. **Scenario Analysis**: In chat mode, pose a “what‑if” question like “If I increase Service C’s price by 10%, how will overall margin change?”  \n\n## 7. Prerequisites  \n- Microsoft 365 subscription with Copilot enabled (or a Copilot license assigned by an administrator).  \n- Workbook saved in the cloud (OneDrive or SharePoint) with AutoSave turned on.  \n- Data formatted as an Excel table (`Ctrl+T`).  \n- Basic familiarity with Excel’s ribbon and pivot table creation.  \n\n## 8. Recommended Next Resources  \n- **Excel Advanced Formulas & Functions** – deepen formula skills to complement AI‑generated insights.  \n- **Power BI Fundamentals** – learn how to build interactive dashboards that can ingest Copilot‑generated tables.  \n- **Data Modeling & Power Pivot** – explore relational modeling for multi‑table analysis.  \n- **Prompt Engineering for Business Analytics** – refine the art of writing effective prompts across AI tools.  \n- **AI Ethics & Governance in Finance** – understand responsible use of AI in financial reporting."}, {"id": "AI-065", "slug": "15-claude-routines-to-automate-your-business", "title": "15 Claude Routines", "category": "Getting Started", "subcategory": "Usage & Optimization", "difficulty": "Intermediate", "description": "The 5 routines from the video fully broken down, plus 10 more worth building right after, content, ads, competitors, error reports, email, briefings and triage. Every prompt, what each routine needs to work, and a setup checklist so nothing breaks on day one.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Contents", "What You'll Find Inside", "What Claude Routines Actually Are", "How To Set One Up", "The 5 Routines From The Video", "Usage & Optimization"], "ai_tools": ["Claude Code", "Claude", "n8n"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-065_15-claude-routines-to-automate-your-business.html", "summary_file": "summaries/AI-065.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-065 - 15 Claude Routines\n\n- **Category:** Getting Started | **Subcategory:** Usage & Optimization  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide demystifies “Claude Routines” by explaining that they are essentially scheduled tasks within Claude Cowork. It walks readers through the end‑to‑end process of creating, testing, and deploying these tasks, from initial prompt design to connector configuration and cadence selection. The material emphasizes that each routine runs in a fresh Cowork session, giving it access to any pre‑connected tools, skills, or plugins. By breaking down five example routines—content generation, ad reporting, competitor analysis, error monitoring, and email handling—the guide illustrates how to translate business needs into concise, actionable prompts. It also expands the concept with ten additional routine ideas, providing a catalog of potential automations that can be tailored to a wide range of workflows.  \n\n## 2. Why It Matters  \nAutomating repetitive, data‑driven tasks frees up human bandwidth for higher‑value activities. Claude Routines enable continuous, unsupervised operation that can run even when a user’s machine is off, thanks to scheduled execution. This reliability is especially valuable for time‑sensitive reporting (e.g., daily ad spend summaries) and real‑time monitoring (e.g., n8n error alerts). By integrating with common productivity tools—Gmail, Slack, Google Drive, and third‑party connectors—these routines become a central hub for information flow, reducing context switching and the risk of manual errors. In a landscape where AI is increasingly used to augment business processes, mastering scheduled routines positions teams to scale operations without proportionally increasing staffing costs.  \n\n## 3. Target Audience  \n- **Digital marketers** looking to automate reporting and content ideation.  \n- **Product managers** who need regular status updates from multiple tools.  \n- **Small‑business owners** seeking low‑maintenance automation for email triage and lead follow‑up.  \n- **AI enthusiasts** with a paid Claude plan who want to apply prompt engineering to real workflows.  \n- **Operations teams** that rely on Slack, Gmail, and spreadsheets for day‑to‑day coordination.  \n\nThe guide assumes familiarity with basic prompt construction and the ability to navigate Claude’s interface, making it ideal for users who have moved beyond the introductory “Hello World” stage.  \n\n## 4. Key Concepts & Principles  \n- **Scheduled Task Architecture**: Each routine is a self‑contained script that triggers at a defined cadence (hourly, daily, weekly, or on‑event). The task is stored in Claude Cowork and can be paused, edited, or run on demand.  \n- **Connector‑Driven Execution**: Routines depend on pre‑configured connectors (e.g., Gmail, Slack, Google Sheets). Without a connector, the routine will explicitly state its limitation rather than fabricate data.  \n- **Approval Modes**: “Automatically approve” still performs safety checks before each action, while “Skip all approvals” bypasses these checks entirely—recommended only for fully vetted routines.  \n- **Modular Prompt Design**: A well‑structured prompt should specify the trigger time, data sources, desired output format, and any constraints (e.g., tone, length). This clarity reduces the chance of ambiguous or incomplete runs.  \n\n## 5. Tools & Technologies Mentioned  \n- **Claude Cowork**: The primary interface for creating, scheduling, and monitoring routines.  \n- **Claude Code**: A research‑preview feature that supports event‑driven triggers via webhooks, useful for real‑time error reporting.  \n- **n8n**: An open‑source workflow automation tool that can be integrated with Claude Code to send error payloads to a routine.  \n- **Gmail Connector**: Allows reading inboxes, drafting replies, and (in certain plans) sending messages.  \n- **Slack Connector**: Enables scanning messages and posting summaries or to‑do lists.  \n- **Google Drive / Sheets Connector**: Provides access to spreadsheets and documents for data ingestion and report drafting.  \n- **Third‑Party Ad Connectors**: Optional connectors for Meta Ads, Google Ads, or other platforms that expose spend and performance data.  \n\n## 6. Practical Use Cases & Workflows  \n- **Daily Content Generator**  \n  1. **Connect**: Ensure the Gmail, Slack, and Google Drive connectors are active.  \n  2. **Prompt**: “Every day at 9 AM, research trending topics in [niche] on Reddit, Instagram, and X. Select the most promising short‑form idea and write a script in my voice.”  \n  3. **Schedule**: Set cadence to daily at 9 AM.  \n  4. **Output**: Script saved to a designated Drive folder for review.  \n\n- **Daily Ad Report**  \n  1. **Connect**: Add a connector that pulls ad spend from your chosen platform (or a Google Sheet that you update manually).  \n  2. **Prompt**: “Every day at 7 AM, pull yesterday’s ad performance, summarize total spend, ROAS, and pipeline movement in three sentences, then tabulate by platform.”  \n  3. **Schedule**: Daily at 7 AM.  \n  4. **Output**: Email draft or Drive document with the report, ready for quick approval.  \n\n## 7. Prerequisites  \n- A paid Claude subscription (Pro, Max, Team, or Enterprise).  \n- At least one pre‑configured connector relevant to the routine (e.g., Gmail, Slack, Drive).  \n- Basic familiarity with Claude’s prompt syntax and the Cowork interface.  \n- For event‑driven routines, an API key for Claude Code and a webhook endpoint (e.g., from n8n).  \n\n## 8. Recommended Next Resources  \n- **Prompt Engineering Deep Dive**: Techniques for crafting precise, unambiguous prompts that reduce runtime errors.  \n- **Custom Connector Development**: Building your own connectors to bridge Claude with niche tools or APIs.  \n- **Workflow Orchestration Platforms**: Integrating Claude routines with Zapier, Make, or n8n for broader automation.  \n- **AI Safety & Ethics**: Understanding how to configure approval modes and monitor for unintended outputs.  \n- **Advanced Reporting**: Leveraging Claude’s summarization capabilities to create executive dashboards or KPI trackers."}, {"id": "AI-066", "slug": "9-things-youre-still-paying-for-that-claude-builds-for-free", "title": "9 Things You're Still Paying For That Claude Builds for Free", "category": "Tools & Integrations", "subcategory": "Third-Party Connectors", "difficulty": "Intermediate", "description": "Nine real builds, one per role, each set up with the specific Claude feature that fits the job: Projects, Skills, Chrome, Mobile + Memory, Artifacts, Cowork, Excel, Word and Code. Full setup steps and the exact prompt for each, from interior designer to meal planner.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Tools & Integrations", "Build 01 of 09: Interior Designer", "The Build", "Build 02 of 09: Copywriter", "Build 03 of 09: Travel Agent", "Build 04 of 09: Language Tutor", "Third-Party Connectors"], "ai_tools": ["Claude Code", "Claude Projects", "Claude Desktop", "Claude Skills", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-066_9-things-youre-still-paying-for-that-claude-builds-for-free.html", "summary_file": "summaries/AI-066.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-066 - 9 Things You're Still Paying For That Claude Builds for Free\n\n- **Category:** Tools & Integrations | **Subcategory:** Third-Party Connectors  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide demonstrates how to harness Claude’s suite of specialized features—Projects, Skills, Chrome extension, Mobile Memory, Artifacts, Cowork, and the desktop Code tab—to replace a range of paid professional services. Rather than treating Claude as a one‑off chat bot, the author shows how to configure persistent contexts, automate repeatable tasks, and embed Claude directly into existing workflows (Excel, Word, web pages). Each of the nine “builds” is a concrete example of turning a recurring human role (designer, copywriter, travel planner, etc.) into a self‑contained, reusable Claude workflow that retains state across sessions and interacts with live data sources. The underlying architecture relies on Claude’s ability to store project knowledge, trigger skills based on prompt patterns, and persist artifacts that survive chat closures.  \n\n## 2. Why It Matters  \nBy converting paid services into in‑house Claude workflows, users can dramatically cut recurring costs while gaining full control over data and output. The approach also boosts productivity: a single, well‑configured skill can generate copy for every campaign, a project can evolve a room layout over months, and an artifact can track a social‑media calendar week after week. Integrating Claude with Microsoft 365 or the Chrome browser means that the AI works with the exact files or web pages you already use, eliminating the friction of manual data entry. For teams, this means a consistent, auditable process that scales without hiring additional staff.  \n\n## 3. Target Audience  \n- **Freelancers & solopreneurs** who outsource design, copy, or coaching and want to keep costs low.  \n- **Small‑to‑mid‑size teams** looking to standardize recurring tasks (e.g., content calendars, training plans).  \n- **Product managers & developers** who need to prototype or automate workflows without writing code.  \n- **Power users of Claude** who already have a paid plan and are ready to explore advanced features.  \n\n## 4. Key Concepts & Principles  \n- **Persistent Context Management**: Using Projects or Artifacts to keep photos, budgets, or calendars alive across sessions.  \n- **Skill Automation**: Defining reusable prompt templates that fire automatically when a specific request pattern is detected.  \n- **Live Data Extraction**: Leveraging the Chrome extension or desktop Code tab to pull real‑time information from web pages or user‑provided files.  \n- **Tool‑Specific Integration**: Embedding Claude directly into Excel, Word, or the desktop environment to work on the same documents you already use.  \n\n## 5. Tools & Technologies Mentioned  \n- **Claude Projects** – Stores images, budgets, and instructions for long‑term design or planning tasks.  \n- **Claude Skills** – Encapsulates a repeatable prompt logic that can be invoked automatically.  \n- **Claude in Chrome** – Reads the current web page and generates content based on live data.  \n- **Claude Mobile App + Memory** – Retains conversational context across sessions for language practice.  \n- **Artifacts** – Persistent, check‑off lists that survive chat closures, ideal for content calendars.  \n- **Claude Cowork** – Background task runner that hands off multi‑step projects (e.g., workout plans).  \n- **Claude for Excel** – Adds a sidebar to Excel that can read and analyze your workbook.  \n- **Claude for Word** – Allows in‑document editing and formatting via the Word add‑in.  \n- **Claude Code (Desktop)** – Generates small, reusable scripts or tools without requiring the user to write code.  \n\n## 6. Practical Use Cases & Workflows  \n- **Interior Designer Project**  \n  1. In Claude, click **Projects → Create project** and name it (e.g., “Living Room Redesign”).  \n  2. Paste a concise instruction block into **Project Instructions** that tells Claude to act as a designer, outputting layout, palette, and buyable furniture.  \n  3. Upload photos of the room, a folder of inspiration images, and a budget file into **Project Knowledge**.  \n  4. Start a new chat inside the project, describe the room, and let Claude generate a full design.  \n  5. Return to the project later; the photos and budget remain, so you can tweak the layout without re‑uploading.  \n\n- **Copywriter Skill**  \n  1. Open **Settings → Customize → Skills** and click **+ Create skill**.  \n  2. Name the skill “Conversion Copy Reviewer” and paste a prompt that instructs Claude to write copy, then list objections, and rewrite to pre‑empt them.  \n  3. Toggle the skill on.  \n  4. In any chat, paste your offer and audience; the skill will fire automatically, producing ready‑to‑publish copy.  \n\n## 7. Prerequisites  \n- A Claude account with a paid plan (Pro, Max, Team, or Enterprise) for most builds.  \n- Microsoft 365 subscription for Excel and Word integrations.  \n- Google Chrome for the Claude in Chrome extension.  \n- Claude Desktop app for Cowork, Code, and some Chrome‑based workflows.  \n- Basic familiarity with Claude’s UI (Projects, Skills, Artifacts).  \n\n## 8. Recommended Next Resources  \n- **Claude API & Prompt Engineering** – Learn how to programmatically trigger skills and manage context.  \n- **Advanced Prompt Templates** – Study patterns for objection handling, tone adjustment, and data extraction.  \n- **Claude for Developers** – Explore the add‑in SDKs for Excel and Word to build custom extensions.  \n- **Automation Platforms** – Combine Claude with Zapier or Make to trigger skills from external events (e.g., new email, form submission).  \n- **Data Privacy & Governance** – Understand how to keep sensitive information secure when using persistent storage."}, {"id": "AI-067", "slug": "5-claude-code-plugins-every-vibe-coder-needs", "title": "5 Claude Code Plugins Every Vibe Coder Needs", "category": "Claude Code", "subcategory": "Model & Tool Interop", "difficulty": "Intermediate", "description": "The exact plugins for databases, security testing, browser QA, design cloning and live docs: Supabase, Strix, Playwright CLI, SkillUI and Context7, each with the install command and a prompt to confirm it's working.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Why These Five", "Plugin 01 · Database: Supabase", "What it does", "Install", "Plugin 02 · Security: Strix", "Model & Tool Interop"], "ai_tools": ["Claude Code", "Claude", "ChatGPT", "Supabase", "Playwright"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-067_5-claude-code-plugins-every-vibe-coder-needs.html", "summary_file": "summaries/AI-067.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-067 - 5 Claude Code Plugins Every Vibe Coder Needs\n\n- **Category:** Claude Code | **Subcategory:** Model & Tool Interop\n- **Difficulty:** Intermediate\n- **Local Asset:** N/A (Web Only)\n- **Status:** WEB_ONLY\n\n## 1. What This Resource Teaches\nThis resource outlines a strategic extension of the Claude Code terminal agent by integrating five specialized plugins that address specific limitations of Large Language Models (LLMs) in autonomous coding environments. The core pedagogical objective is to transition from \"vibe coding\"—where the AI guesses based on training data—to \"verified coding,\" where the AI interacts with live systems to validate its output. The guide demonstrates how to bridge the gap between static text generation and dynamic system interaction by providing direct connections to databases, security scanners, browser automation engines, design extraction tools, and live documentation sources.\n\nArchitecturally, the resource focuses on the \"Agent Skill\" and \"MCP (Model Context Protocol)\" paradigms. It teaches that an LLM’s intelligence is bounded by its context window and training cutoff; therefore, augmenting the agent with external tools that provide real-time state (such as current database schemas or live DOM structures) significantly reduces hallucination rates. The workflow emphasizes a modular approach where each plugin solves a distinct class of error: schema mismatch (Supabase), security vulnerability (Strix), visual/layout failure (Playwright), stylistic inconsistency (SkillUI), and API obsolescence (Context7).\n\n## 2. Why It Matters\nIn modern AI-assisted development, the primary bottleneck is no longer code generation speed but verification accuracy. Without these integrations, developers must manually cross-reference AI-generated code against live environments, which negates the efficiency gains of AI coding. This resource matters because it automates the verification loop. By allowing the AI to \"see\" its own output (via screenshots), \"test\" its own security (via pentesting agents), and \"read\" its own database state, the developer shifts from a manual debugger role to a high-level architect role.\n\nStrategically, this approach reduces technical debt accumulation. AI models often generate code that is syntactically correct but semantically broken due to outdated library versions or incorrect assumptions about backend state. By integrating live documentation and database introspection, the workflow ensures that the generated code is not just plausible, but actually functional within the specific constraints of the project. This is critical for production-ready applications where subtle errors in authentication flows or data integrity can lead to significant security or operational failures.\n\n## 3. Target Audience\n- **AI-Augmented Full-Stack Developers**: Engineers who use terminal-based AI agents (like Claude Code) for daily development and seek to reduce manual testing and debugging cycles.\n- **Indie Hackers & Solo Founders**: Individuals building MVPs rapidly who lack dedicated QA or DevOps teams and need the AI to handle security and infrastructure checks autonomously.\n- **Technical Leads & Architects**: Professionals designing AI-assisted development pipelines who need to understand how to extend agent capabilities via MCPs and custom skills to ensure reliability.\n- **Intermediate Coders**: Developers comfortable with CLI environments and basic JavaScript/TypeScript who are moving beyond simple chat-based coding into agentic workflows.\n\n## 4. Key Concepts & Principles\n- **Agentic Tool Interop (MCP & Skills)**: The principle that LLMs should not rely solely on internal weights for factual or state-based information. Instead, they should be equipped with tools (via MCP servers or agent skills) that allow them to query external systems (databases, browsers, doc servers) in real-time. This transforms the LLM from a static text predictor into a dynamic system operator.\n- **Closed-Loop Verification**: The workflow principle where the AI generates code, then immediately uses a tool to test that code (e.g., running Playwright to screenshot the UI, or Strix to attempt an exploit). The feedback from the tool is fed back into the context, allowing the AI to self-correct without human intervention.\n- **Contextual Grounding via Live Data**: Addressing the \"stale knowledge\" problem by injecting live, version-specific data into the prompt context. For example, using Context7 to pull current API documentation ensures the AI does not hallucinate deprecated methods, and using Supabase to read the actual schema prevents column name mismatches.\n- **Design System Extraction as Code**: The concept that visual design is not just an aesthetic choice but a structured data set (colors, spacing, typography) that can be programmatically extracted and enforced. By converting a website's design into a machine-readable skill file, the AI can maintain visual consistency without requiring the developer to manually describe CSS variables.\n\n## 5. Tools & Technologies Mentioned\n- **Claude Code**: The primary terminal-based AI agent. It serves as the orchestrator that interprets user prompts, executes commands, and utilizes the installed plugins/skills to perform complex tasks.\n- **Supabase**: A backend-as-a-service platform. In this context, it is used via a plugin to allow the AI to execute SQL queries, manage migrations, and generate TypeScript types directly from the live database schema, ensuring data layer accuracy.\n- **Strix**: An open-source AI-powered penetration testing tool. It acts as an adversarial agent that attempts to exploit vulnerabilities (SQLi, XSS, IDOR) in the codebase, providing proof-of-concept exploits to validate security fixes.\n- **Playwright CLI**: A browser automation framework. It enables the AI to launch a headless or headed browser, navigate through the application, interact with UI elements, and capture screenshots/console logs, providing visual and functional feedback.\n- **SkillUI**: A static analysis tool that crawls websites to extract design tokens (colors, fonts, spacing). It packages these into a `CLAUDE.md` or `SKILL.md` file, allowing the AI to replicate a specific design system in new code generation.\n- **Context7**: An MCP server that provides access to live, version-matched documentation for thousands of libraries. It ensures the AI references current API signatures and best practices rather than relying on potentially outdated training data.\n\n## 6. Practical Use Cases & Workflows\n- **Automated UI Regression Testing**:\n    1.  Install Playwright CLI and register it as a skill for Claude Code.\n    2.  Prompt the AI: \"Test the sign-up flow on localhost:3000. Take screenshots of every step and flag any layout issues or console errors.\"\n    3.  The AI launches a browser, executes the user journey, captures visual evidence, and analyzes the screenshots for broken layouts or missing elements.\n    4.  The AI reports specific bugs (e.g., \"Button overlaps text on mobile view\") and suggests CSS fixes, which it can then implement and re-test.\n\n- **Secure Database Schema Evolution**:\n    1.  Install the Supabase plugin and connect it to the project’s environment variables.\n    2.  Prompt the AI: \"Add a 'last_login' timestamp to the users table and generate the corresponding TypeScript interface.\"\n    3.  The AI queries the live database to confirm the current schema, writes the migration SQL, executes it, and then reads the updated schema to generate accurate type definitions.\n    4.  This prevents errors caused by the AI guessing column names or types that do not exist in the production environment.\n\n- **Design-Consistent Feature Development**:\n    1.  Run `skillui --url <competitor_or_brand_site>` to extract the design system.\n    2.  Open the generated folder in Claude Code, which automatically loads the design tokens into context.\n    3.  Prompt the AI: \"Build a new pricing page that matches the extracted design system.\"\n    4.  The AI uses the specific hex codes, font families, and spacing scales from the skill file to generate CSS/Tailwind classes, ensuring the new page visually aligns with the existing brand without manual styling instructions.\n\n## 7. Prerequisites\n- **Claude Code Installation**: A working installation of Anthropic’s Claude Code CLI agent.\n- **Node.js & npm**: Required for installing global packages like Playwright CLI and SkillUI.\n- **Docker (Optional but Recommended)**: Needed for running Strix locally for full security scanning capabilities.\n- **API Keys**:\n    -   Supabase project access tokens.\n    -   LLM API keys for Strix (if running locally) to power its autonomous agents.\n    -   Optional Context7 API key for higher rate limits.\n- **Basic CLI Proficiency**: Comfort with terminal commands, environment variable management, and navigating file systems.\n- **Understanding of MCP (Model Context Protocol)**: Basic familiarity with how AI agents connect to external tools via MCP servers.\n\n## 8. Recommended Next Resources\n- **Advanced MCP Server Development**: Learn how to build custom MCP servers for proprietary internal tools or APIs to further extend Claude Code’s capabilities.\n- **CI/CD Integration for AI Agents**: Explore how to integrate Strix and Playwright into GitHub Actions or GitLab CI to block vulnerable or broken code before it reaches the main branch.\n- **Prompt Engineering for Agentic Workflows**: Deep dive into structuring prompts that effectively chain multiple tools (e.g., \"Use Context7 to find the API, then use Supabase to verify the schema, then write the code\").\n- **Security Hardening for AI-Generated Code**: A broader study on common vulnerabilities in AI-generated code and how to systematically audit them using tools like Strix and Snyk.\n- **Design Token Management**: Learn about standardizing design tokens across teams and how to automate their synchronization with codebases using tools like Style Dictionary or Figma Tokens."}, {"id": "AI-068", "slug": "4-ways-to-get-ahead-of-everyone-else-using-ai", "title": "4 Ways To Get Ahead Of Everyone Else Using AI", "category": "Getting Started", "subcategory": "Core Fundamentals", "difficulty": "Intermediate", "description": "The four systems worth building before everyone else catches on: an AI second brain, one real chained workflow, a specialised AI teammate, and one automation that runs itself. Full setup and prompts for both Claude and ChatGPT.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Contents: The Four Systems", "What this looks like", "Core Fundamentals"], "ai_tools": ["Claude", "ChatGPT"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-068_4-ways-to-get-ahead-of-everyone-else-using-ai.html", "summary_file": "summaries/AI-068.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-068 - 4 Ways To Get Ahead Of Everyone Else Using AI\n\n- **Category:** Getting Started | **Subcategory:** Core Fundamentals  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide presents a four‑layered framework that turns a generic LLM into a tightly integrated, business‑centric assistant.  \n1. **AI Second Brain** – A persistent knowledge base that remembers your personal style, business context, and operational rules so every new conversation starts with full context.  \n2. **AI Workflow** – A single‑prompt chain that stitches together research, drafting, and production notes, eliminating the need for multiple back‑and‑forth messages.  \n3. **AI Teammate** – A role‑specific project that focuses the model on one concrete task (e.g., writing a newsletter or generating a weekly report), allowing it to become highly proficient in that niche.  \n4. **AI Automation** – A scheduled task that runs autonomously on a fixed cadence, delivering ready‑to‑use outputs without any manual trigger.  \n\nEach layer builds on the previous one: the second brain supplies context, the workflow leverages that context to produce end‑to‑end content, the teammate refines the output for a single function, and the automation removes the final human touch. The guide walks through concrete setup steps for both Claude and ChatGPT, covering custom instructions, project creation, memory toggles, web search, and scheduled task configuration.\n\n## 2. Why It Matters  \n- **Contextual Consistency**: By embedding your voice, rules, and data into the model’s memory, you eliminate repetitive explanations and reduce cognitive load.  \n- **Process Efficiency**: End‑to‑end workflows cut the number of prompts needed to produce a finished asset, saving time and reducing error propagation.  \n- **Specialization Over Generalization**: Assigning a single, well‑defined role to the AI turns it into a high‑performance specialist rather than a mediocre generalist.  \n- **Hands‑Off Automation**: Scheduled tasks free you from repetitive weekly chores, allowing you to focus on strategy and creative decisions.  \n- **Scalability**: The same architecture can be replicated across multiple projects or teams, enabling rapid expansion without proportional increases in effort.\n\n## 3. Target Audience  \n- **Solo founders & small‑team entrepreneurs** who need to juggle multiple roles.  \n- **Content creators** (bloggers, podcasters, video producers) looking to streamline ideation, scripting, and production.  \n- **Marketing & operations managers** who require consistent reporting and competitor monitoring.  \n- **Product managers** who want quick, data‑driven insights without building custom dashboards.  \n- Anyone with an intermediate understanding of LLMs who is ready to move beyond one‑off prompts.\n\n## 4. Key Concepts & Principles  \n- **AI Second Brain**: A persistent repository of personal and business knowledge that the model consults automatically.  \n- **End‑to‑End AI Workflow**: A single prompt that chains multiple stages (research → drafting → production notes) so the model outputs a finished product in one response.  \n- **Role‑Based AI Teammate**: A project dedicated to a single function, with its own instruction set and knowledge base, ensuring the model focuses on that niche.  \n- **Scheduled AI Automation**: A timer‑driven task that runs at a fixed interval, delivering outputs without any user interaction.\n\n## 5. Tools & Technologies Mentioned  \n- **Claude (Anthropic)**  \n  - *Role*: Primary LLM for all four layers.  \n  - *Features*: Projects, custom instructions, memory (search & reference), web search, scheduled tasks (Cowork).  \n- **ChatGPT (OpenAI)**  \n  - *Role*: Alternative LLM with similar capabilities.  \n  - *Features*: Projects, custom instructions, memory (saved memories & reference chat history), browsing, scheduled tasks (Business/Pro/Enterprise).  \n- **Projects**  \n  - *Purpose*: Isolate context and instructions for each layer or role.  \n- **Custom Instructions**  \n  - *Purpose*: Define who you are, your business, and your preferred working style.  \n- **Memory Settings**  \n  - *Purpose*: Enable the model to retain and reference past interactions automatically.  \n- **Web Search / Browsing**  \n  - *Purpose*: Provide up‑to‑date trend data or competitor information during a workflow.  \n- **Scheduled Tasks**  \n  - *Purpose*: Automate recurring jobs (e.g., weekly competitor check) on a fixed cadence.\n\n## 6. Practical Use Cases & Workflows  \n### Use Case 1 – Content Creation Pipeline  \n1. **Set up a “Content” project** with custom instructions that include your brand voice, tone, and preferred content length.  \n2. **Enable memory** so the model learns from every script you produce.  \n3. **Create a workflow prompt** that:  \n   - Searches for trending topics in your niche.  \n   - Selects the top topic and writes a script in your voice.  \n   - Generates production notes (shots, pacing, captions).  \n4. **Run the workflow** once per week; the output is a ready‑to‑record script and a shot list.  \n5. **Optional**: Save the workflow as a scheduled task to run automatically every Friday at 10 AM.\n\n### Use Case 2 – Weekly Competitor Monitoring Automation  \n1. **Create a “Competitor Watch” project** with instructions that list the three main competitors.  \n2. **Enable memory** to track changes over time.  \n3. **Draft a scheduled task** that:  \n   - Visits each competitor’s pricing page and recent announcements.  \n   - Summarizes any shifts in pricing or positioning.  \n   - Highlights one actionable insight.  \n4. **Schedule the task** for every Monday at 8 AM.  \n5. **Receive the report** in your inbox or a shared workspace without any manual effort.\n\n## 7. Prerequisites  \n- Active accounts on **Claude** and/or **ChatGPT**.  \n- A paid plan (Pro, Business, or Enterprise) for full knowledge‑base and scheduled‑task capabilities.  \n- Basic familiarity with LLM prompt syntax and project management within the platform.  \n- Access to the internet for web search or browsing during workflows.  \n- Optional: Integration with a task‑management tool (e.g., Notion, Trello) to receive scheduled outputs.\n\n## 8. Recommended Next Resources  \n- **Prompt Engineering Fundamentals** – Deep dive into crafting precise, reusable prompts.  \n- **Advanced Memory Management** – Techniques for fine‑tuning what the model remembers and how it references past data.  \n- **API Integration for Automations** – Building custom connectors to push AI outputs into CRM, email, or content‑management systems.  \n- **Data‑Driven Decision Making with AI** – Using LLMs to analyze metrics and generate actionable insights.  \n- **AI‑Powered Content Strategy** – Scaling content production while maintaining brand consistency.  \n- **Ethical AI Use & Governance** – Ensuring transparency, bias mitigation,"}, {"id": "AI-069", "slug": "3-free-ways-to-actually-learn-claude", "title": "3 Free Ways to Actually Learn Claude", "category": "Getting Started", "subcategory": "Education & Courses", "difficulty": "Beginner", "description": "The official course library (Claude Academy), the official Claude Skills repo, and the community-built Awesome Claude Code Subagents collection, fully researched and verified link by link, plus a sensible order to actually use all three together.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Contents: What You'll Learn", "Why This Is Worth Your Time", "What makes it worth using", "Why this one matters", "Education & Courses"], "ai_tools": ["Claude Code", "Claude Skills", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-069_3-free-ways-to-actually-learn-claude.html", "summary_file": "summaries/AI-069.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-069 - 3 Free Ways to Actually Learn Claude\n\n- **Category:** Getting Started | **Subcategory:** Education & Courses  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide presents a structured, zero‑cost pathway to mastering Claude and its ecosystem. It starts with Claude Academy, a self‑paced curriculum directly authored by Anthropic, covering everything from basic chat usage to advanced code‑generation workflows. Next, it introduces the Claude Skills Library, a repository of reusable “briefing packs” that let Claude perform specialized tasks—such as brand‑consistent document creation or workflow‑specific code generation—without manual re‑prompting. Finally, it explores the community‑driven Awesome Claude Code Subagents, a curated set of over 150 specialist agents that can be plugged into Claude Code to automate niche tasks like security audits or database optimization. Together, these resources teach how to layer training, tooling, and automation to unlock Claude’s full potential.\n\n## 2. Why It Matters  \nIn an era where AI can rapidly concentrate economic advantage, the guide emphasizes that the real differentiator is not raw technical skill but the depth of integration with available free resources. By combining structured learning, official plug‑in libraries, and community‑built agents, users can:\n\n- **Accelerate adoption**: Skip trial‑and‑error by following proven curricula.  \n- **Improve consistency**: Skills enforce repeatable, brand‑aligned outputs.  \n- **Scale productivity**: Subagents automate repetitive or complex tasks, freeing human time for higher‑value work.  \n- **Maintain cost‑efficiency**: All three components are free, lowering the barrier to entry for individuals and small teams.\n\n## 3. Target Audience  \n- **New AI users** who want a guided introduction to Claude’s capabilities.  \n- **Developers and engineers** looking to integrate Claude into code‑generation or CI/CD pipelines.  \n- **Product managers and marketers** who need consistent brand‑aligned content creation.  \n- **Security and compliance teams** interested in automated audit workflows.  \n- **Educators and trainers** who wish to build AI‑centric curricula without licensing fees.\n\n## 4. Key Concepts & Principles  \n- **Self‑Paced AI Fluency**: Structured learning tracks that teach delegation, description, discernment, and diligence, enabling users to think strategically about AI interactions.  \n- **Skill‑Based Prompt Engineering**: Reusable instruction bundles (SKILL.md) that encapsulate context, constraints, and desired output formats, reducing the need for ad‑hoc prompting.  \n- **Subagent Isolation**: Each specialist agent runs in its own context window with defined tool permissions, preventing cross‑talk and ensuring predictable behavior.  \n- **Model‑Specific Routing**: Agents are pre‑wired to the most suitable Claude model (Opus, Sonnet, Haiku) based on task complexity, optimizing performance and cost.\n\n## 5. Tools & Technologies Mentioned  \n- **Claude Academy** (`academy.claude.com`): Web‑based learning platform with courses, tutorials, and quizzes.  \n- **Claude Skills Library** (`github.com/anthropics/skills`): GitHub repo containing skill folders with `SKILL.md` files.  \n- **Claude Code**: Integrated development environment for building and running Claude agents.  \n- **Awesome Claude Code Subagents** (`github.com/VoltAgent/awesome-claude-code-subagents`): Community repo of specialized agents.  \n- **Plugin Marketplace Commands**:  \n  ```bash\n  /plugin marketplace add anthropics/skills\n  /plugin install example-skills@anthropic-agent-skills\n  /plugin marketplace add VoltAgent/awesome-claude-code-subagents\n  /plugin install voltagent-lang\n  ```\n\n## 6. Practical Use Cases & Workflows  \n- **Use Case 1: Brand‑Consistent Content Generation**  \n  1. Complete the “Claude 101” and “AI Capabilities” courses to understand Claude’s strengths.  \n  2. Browse the Skills Library for a `brand_style` skill; install it via the plugin command.  \n  3. In Claude Code, invoke the skill with a prompt like “Write a product description in our brand voice.”  \n  4. Review the output; tweak the skill’s `SKILL.md` if necessary.  \n\n- **Use Case 2: Automated Security Audit Pipeline**  \n  1. Finish the “Claude Code 101” course to grasp agent construction.  \n  2. Install the `security-auditor` subagent:  \n     ```bash\n     /plugin install security-auditor\n     ```  \n  3. Configure the agent’s tool permissions to include `Read`, `Grep`, and `Bash`.  \n  4. Run the agent against a codebase:  \n     ```bash\n     /run security-auditor --path ./src\n     ```  \n  5. Export the audit report and integrate it into the CI pipeline.\n\n## 7. Prerequisites  \n- A Claude account (free tier suffices for learning).  \n- Basic familiarity with command‑line interfaces.  \n- Optional: A paid Claude plan if you wish to use skills directly in Claude.ai (code execution required).  \n- Internet access to clone GitHub repositories and install plugins.\n\n## 8. Recommended Next Resources  \n- **Claude Platform API Docs** – for building custom integrations.  \n- **Model Context Protocol (MCP) Tutorials** – to fine‑tune prompt context length.  \n- **Prompt Engineering Playbooks** – advanced techniques for crafting high‑quality prompts.  \n- **Security‑First AI Design** – guidelines for ensuring compliance when automating audits.  \n- **Community Forums** – stay updated on new subagents and skill releases."}, {"id": "AI-070", "slug": "3-free-skills-that-kill-the-ai-look", "title": "3 Free Skills That Kill The AI Look", "category": "Prompts & Skills", "subcategory": "Custom Skills", "difficulty": "Intermediate", "description": "Three free Claude Code skills that stop your builds looking like every other vibe-coded site: Emil Kowalski's motion skill, Impeccable's design system and polish command, and the Taste anti-slop skill. Install commands and what each one actually fixes.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "Contents: What You'll Set Up", "Why these three", "Why Every AI Site Looks The Same", "The three tells", "What each skill fixes", "Custom Skills"], "ai_tools": ["Claude Code", "Claude Desktop", "Claude", "Cursor"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-070_3-free-skills-that-kill-the-ai-look.html", "summary_file": "summaries/AI-070.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-070 - 3 Free Skills That Kill The AI Look\n\n- **Category:** Prompts & Skills | **Subcategory:** Custom Skills\n- **Difficulty:** Intermediate\n- **Local Asset:** N/A (Web Only)\n- **Status:** WEB_ONLY\n\n## 1. What This Resource Teaches\nThis resource outlines a specialized workflow for enhancing the visual quality of AI-generated frontend code by installing three distinct \"skills\" into the Claude Code environment. The core premise is that Large Language Models (LLMs) default to homogeneous, generic design patterns (often referred to as \"AI slop\") due to training data biases. By injecting specific, curated instruction sets into the agent's context, developers can override these defaults to achieve professional-grade aesthetics without manually rewriting CSS or design logic.\n\nThe technical foundation relies on the modular architecture of Claude Code, where skills are installed via the terminal and stored locally within the project's `.claude/skills/` directory. These skills act as persistent system prompts or specialized sub-agents that trigger automatically based on the nature of the user's request (e.g., building a component, reviewing UI code). The guide details the installation and usage of three specific tools: one focused on motion physics and easing, one providing a deterministic design system with audit capabilities, and one that injects high-level design reasoning and \"taste\" into the decision-making process.\n\n## 2. Why It Matters\nIn the era of \"vibe coding,\" where developers rapidly prototype applications using AI agents, the primary bottleneck has shifted from code generation to aesthetic differentiation. Without intervention, AI-generated interfaces suffer from a \"uncanny valley\" of mediocrity, characterized by predictable color gradients, uniform typography, and static layouts. This resource addresses the strategic need for **design consistency** and **professional polish** in AI-assisted development.\n\nThe value proposition lies in the separation of concerns: rather than forcing the LLM to guess at design best practices, these skills provide explicit, expert-level constraints. This reduces the cognitive load on the developer, who no longer needs to micromanage every pixel or animation curve. Furthermore, by standardizing the design system through tools like Impeccable, teams can ensure that AI-generated components integrate seamlessly with existing brand guidelines, significantly reducing the time spent on manual UI refinement and QA.\n\n## 3. Target Audience\n- **Frontend Engineers & Full-Stack Developers**: Professionals using AI coding assistants (specifically Claude Code) who want to elevate the visual fidelity of their prototypes and production code without becoming UI designers.\n- **Indie Hackers & Solo Founders**: Individuals building MVPs rapidly who need their products to look credible and polished to attract users or investors, but lack the time or budget for dedicated design resources.\n- **AI-Augmented Designers**: Designers who use code generation tools to create interactive prototypes and need to enforce specific motion languages and design systems within the generated code.\n- **Technical Leads**: Managers overseeing AI-assisted development pipelines who need to establish guardrails to prevent \"design debt\" from accumulating in the codebase.\n\n## 4. Key Concepts & Principles\n- **The \"AI Default\" Bias**: The phenomenon where LLMs converge on a narrow set of safe, common design patterns (e.g., purple/blue gradients, Inter font, zero motion) because these patterns are over-represented in their training data. Understanding this bias is the first step in counteracting it.\n- **Contextual Skill Injection**: The architectural principle that specific, high-quality design instructions can be modularized and injected into the LLM's context window. These \"skills\" act as specialized lenses, forcing the model to apply specific reasoning (e.g., \"use ease-out for entry animations\") rather than generic heuristics.\n- **Deterministic Design Systems**: The use of tools that enforce strict rules for typography, spacing, and color (like Impeccable) to ensure consistency. This moves AI generation from probabilistic guessing to rule-based execution, allowing for automated audits of alignment and accessibility.\n- **Design Reasoning vs. Pattern Matching**: The distinction between simply copying a visual pattern and understanding the *why* behind a design choice. The \"Taste\" skill emphasizes teaching the model the rationale for spacing and layout decisions, enabling it to make appropriate choices for novel interfaces rather than just repeating known templates.\n\n## 5. Tools & Technologies Mentioned\n- **Claude Code**: The primary execution environment. It is a terminal-based AI coding agent that supports the installation of custom skills via `npx` commands. It reads local skill files to augment its behavior during coding sessions.\n- **Emil Kowalski’s Motion Skill (`emilkowalski/skills`)**: A specialized skill bundle that encodes expert knowledge on UI animation. It focuses on correct easing curves, timing, and restraint, ensuring that motion feels intentional and physically plausible. It triggers automatically when the user requests animation-related tasks.\n- **Impeccable (`pbakaus/impeccable`)**: A comprehensive design system skill that provides 23 specific commands for managing typography, color, and layout. Its key feature is the `/impeccable polish` command, which performs a final pass to fix alignment, spacing, and detail issues before deployment. It also includes audit and critique commands for accessibility and UX clarity.\n- **Taste Skill (`Leonxlnx/taste-skill`)**: A highly popular skill (70k+ stars) that injects high-level design judgment into the model. It offers multiple variants (e.g., minimalist, brutalist) and focuses on the reasoning behind design choices, allowing the AI to make defensible aesthetic decisions for new projects.\n- **npx**: The Node.js package runner used to execute the installation commands for these skills directly from the terminal, ensuring the latest versions are deployed to the local project directory.\n\n## 6. Practical Use Cases & Workflows\n- **Workflow 1: The \"Pre-Ship\" Polish Pipeline**\n    1.  **Setup**: In your project root, run `npx impeccable install` to add the design system skill.\n    2.  **Initialization**: Run `/impeccable init` to establish the baseline design tokens and rules for the project.\n    3.  **Development**: Build your UI components using Claude Code as usual.\n    4.  **Refinement**: Before committing or deploying, execute `/impeccable polish`. This command scans the UI for misalignments, inconsistent spacing, and other \"slop\" indicators, automatically applying fixes based on the defined design system.\n    5.  **Verification**: Review the diff to ensure the changes align with brand expectations.\n\n- **Workflow 2: Intentional Motion Design**\n    1.  **Setup**: Install the motion skill via `npx skills@latest add emilkowalski/skills`.\n    2.  **Request**: Ask Claude to \"Build a modal that fades in when it opens\" or \"Review the animations in this component.\"\n    3.  **Automatic Application**: The skill triggers, guiding Claude to select appropriate easing functions (e.g., `cubic-bezier` for natural deceleration) and durations, avoiding the common mistake of using linear or overly bouncy animations.\n    4.  **Iteration**: If the motion still feels \"off,\" ask Claude to \"fix the hover effect,\" and the skill will re-evaluate the timing and curve based on its embedded best practices.\n\n- **Workflow 3: Establishing Design \"Taste\" for New Projects**\n    1.  **Setup**: Install the Taste skill using `npx skills add https://github.com/Leonxlnx/taste-skill`.\n    2.  **Selection**: Choose a variant that matches your brand (e.g., `design-taste-frontend` for general use, or a specific aesthetic like `minimalist`).\n    3.  **Generation**: When building new pages, the skill influences the model's choices for layout variance, visual density, and color palettes, ensuring the output reflects a coherent design philosophy rather than random defaults.\n    4.  **Comparison**: Compare the generated UI against a baseline without the skill to observe the difference in aesthetic coherence and professional quality.\n\n## 7. Prerequisites\n- **Claude Code Installation**: The user must have Claude Code installed and configured on their local machine.\n- **Node.js Environment**: Since the installation commands use `npx`, a working Node.js and npm environment is required.\n- **Project Directory**: The commands must be run from the root directory of the project where the `.claude/skills/` folder will be created.\n- **Basic Frontend Knowledge**: While the tools handle the specifics, the user should have a fundamental understanding of frontend concepts (HTML/CSS/JS) to evaluate the output and understand the context of the design decisions.\n- **Terminal Proficiency**: Comfort with using the command line to execute installation scripts and manage project dependencies.\n\n## 8. Recommended Next Resources\n- **Advanced CSS Architecture**: Resources on BEM, CSS Modules, or Tailwind CSS to better understand how the design systems enforced by these skills are implemented in code.\n- **UI Animation Principles**: Deeper dives into motion design theory, such as \"The Principles of Animation\" or specific courses on UI micro-interactions, to complement the practical application of the Motion Skill.\n- **Accessibility Standards (WCAG)**: Guides on Web Content Accessibility Guidelines to ensure that the \"polished\" UI generated by Impeccable also meets legal and ethical accessibility requirements.\n- **Design System Implementation**: Tutorials on building and maintaining design tokens, as the Impeccable skill relies on a consistent set of variables for typography and spacing.\n- **Other Claude Code Skills**: Exploration of other available skills in the Claude Code ecosystem for backend logic, database schema design, or API integration to build a full-stack AI-assisted development workflow."}, {"id": "AI-071", "slug": "the-5-checks-full-verification-guide", "title": "The 5 Checks: Full Verification Guide", "category": "Claude Code", "subcategory": "Testing & Reliability", "difficulty": "Intermediate", "description": "The exact prompts, setup and failure patterns for catching AI coding agents that report a task as done when it hasn't actually been tested. Requirement, Test, Regression, Diff and Unproven, plus the CLAUDE.md rule, hooks and subagents that enforce it automatically.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Contents: What You'll Learn", "1. REQUIREMENT", "Testing & Reliability"], "ai_tools": ["Claude Code", "Claude", "Cursor"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-071_the-5-checks-full-verification-guide.html", "summary_file": "summaries/AI-071.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-071 - The 5 Checks: Full Verification Guide\n\n- **Category:** Claude Code | **Subcategory:** Testing & Reliability  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide presents a structured, repeatable process for turning an AI‑generated “done” claim into verifiable evidence. It introduces five mandatory checkpoints—**Requirement**, **Test**, **Regression**, **Diff**, and **Unproven**—that must accompany every code change. By embedding these checkpoints into the AI’s workflow (via rule files or hooks), the model is forced to produce concrete artifacts rather than vague confidence statements. The material also covers how to prompt the model for each checkpoint on demand, how to combine them into a single prompt, and how to enforce them automatically with PostToolUse hooks or a dedicated regression sub‑agent.  \n\nThe core mechanics revolve around *persistent rule files* (`CLAUDE.md`, `.cursor/rules`, `AGENTS.md`) that the AI reads at session start, *prompt templates* that elicit precise evidence, and *automation hooks* that run tests and regression checks without human intervention. The architecture is intentionally lightweight: it relies on the AI’s own output and the local test harness, avoiding external orchestration tools.  \n\n## 2. Why It Matters  \nIn modern AI‑augmented development, a model can claim a task is complete simply because the code compiles or the diff looks reasonable. This superficial “confidence” can mask subtle bugs, regressions, or incomplete requirements. By demanding explicit evidence for each checkpoint, the guide transforms the AI from a *confidence‑reporter* into a *proof‑generator*. This yields several strategic benefits:\n\n- **Reduced post‑deployment failures**: Regression checks catch side‑effects before they reach production.  \n- **Higher developer trust**: Concrete test outputs and diff rationales make it easier to audit AI work.  \n- **Scalable quality assurance**: Automation hooks mean the checks run on every edit, eliminating manual oversight.  \n- **Clear accountability**: The Unproven section forces the model to admit uncertainty, preventing blind spots.  \n\nOverall, the methodology aligns AI‑generated code with industry best practices for continuous integration and verification.\n\n## 3. Target Audience  \n- **AI‑augmented developers** who use Claude Code, Cursor, or Codex and want to enforce stricter quality gates.  \n- **Engineering leads** looking to formalize AI‑driven code reviews.  \n- **QA engineers** interested in automating evidence collection for AI‑written changes.  \n- **Intermediate‑level practitioners** who already understand basic testing but need a structured approach to AI‑generated work.  \n\nThe guide is less suited for absolute beginners who have not yet mastered basic version control or testing concepts.\n\n## 4. Key Concepts & Principles  \n- **Requirement**: The exact user story or specification that the change is intended to satisfy.  \n  *Why it matters*: Prevents scope creep and ensures the AI’s output aligns with the original intent.  \n\n- **Test**: The actual execution of a test case and the raw output produced.  \n  *Why it matters*: Provides objective evidence that the change behaves as expected, not just a description of expected behavior.  \n\n- **Regression**: Identification of all code paths, files, or routes that could be affected by the change, along with evidence that they still function correctly.  \n  *Why it matters*: Guards against hidden side‑effects that surface only under specific conditions.  \n\n- **Diff**: A file‑by‑file justification for each modification, explaining why the change was necessary.  \n  *Why it matters*: Detects accidental or unnecessary edits and clarifies intent.  \n\n- **Unproven**: A candid admission of any aspect that could not be verified, with specific reasons.  \n  *Why it matters*: Keeps the audit trail honest and highlights areas that require manual review or future testing.  \n\n## 5. Tools & Technologies Mentioned  \n- **Claude Code**: An AI coding environment that reads `CLAUDE.md` for persistent rules and supports PostToolUse hooks.  \n- **Cursor**: A code‑editing tool that uses `.cursor/rules` for similar persistent rule enforcement.  \n- **Codex**: An AI model that reads `AGENTS.md` for session‑level rules.  \n\nAll three share the same five‑check framework, making the guide broadly applicable across AI coding platforms.\n\n## 6. Practical Use Cases & Workflows  \n- **Use Case / Workflow 1: Automatic Verification in a CI Pipeline**  \n  1. Add the five‑check rule block to `CLAUDE.md` (or the equivalent file for your tool).  \n  2. Configure a PostToolUse hook that runs `npm test` (or your test command) immediately after the AI edits a file.  \n  3. When the AI finishes a change, the hook automatically populates the **Test** section with the real output.  \n  4. A separate regression sub‑agent scans the repository for dependent modules and reports back the **Regression** section.  \n  5. The CI job fails if any of the five sections are missing or contain placeholders.  \n\n- **Use Case / Workflow 2: Manual Prompt‑Based Evidence Collection**  \n  1. After the AI signals “DONE,” the developer issues the combined prompt:  \n     ```\n     Before I accept this as done, give me REQUIREMENT, TEST, REGRESSION, DIFF, and UNPROVEN.  \n     ```  \n  2. The AI returns a structured block with each section populated.  \n  3. The developer reviews the output, verifies the test logs, and checks the diff rationales.  \n  4. If any section is empty, the developer asks for clarification or additional evidence.  \n\n## 7. Prerequisites  \n- Basic familiarity with Git and version control workflows.  \n- A local test harness (e.g., Jest, PyTest, or a custom script) that can be invoked from the command line.  \n- Access to the AI platform’s rule file configuration (e.g., `CLAUDE.md`, `.cursor/rules`, `AGENTS.md`).  \n- Optional: Ability to write simple shell scripts for PostToolUse hooks or to spin up a secondary agent for regression checks.  \n\n## 8. Recommended Next Resources  \n- **“Automating Regression Tests with AI‑Driven Sub‑Agents”** – a deeper dive into building dedicated regression agents.  \n- **“Hooking into AI Code Editors: PostToolUse and Beyond”** – practical guidance on extending AI editors with custom automation.  \n- **“Effective Prompt Engineering for Evidence Generation”** – techniques for crafting prompts that elicit precise, actionable outputs.  \n- **“CI/CD Integration for AI‑Generated Code”** – best practices for embedding AI verification into continuous delivery pipelines."}]
