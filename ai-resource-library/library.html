<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nabil AI Resource Library — Curated Personal Knowledge Base">
  <title>Nabil AI Resource Library</title>
  <style>
    /* CSS Reset & Soothing Design Tokens */
    :root {
      /* Classy Midnight Slate Theme (Default: calming, zero eye strain) */
      --bg-main: #0B1120;
      --bg-surface: #111C30;
      --bg-card: #162238;
      --bg-subtle: #1C2B47;
      --border-color: #243556;
      --border-hover: #3B527E;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-light: #64748B;
      
      /* Vibrant Electric & Violet Accents */
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-light: rgba(99, 102, 241, 0.16);
      --primary-border: rgba(99, 102, 241, 0.35);
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
      --primary-glow: rgba(99, 102, 241, 0.35);

      /* Soothing Difficulty Accents */
      --diff-beginner-bg: rgba(16, 185, 129, 0.15);
      --diff-beginner-text: #34D399;
      --diff-beginner-border: rgba(16, 185, 129, 0.35);

      --diff-inter-bg: rgba(245, 158, 11, 0.15);
      --diff-inter-text: #FBBF24;
      --diff-inter-border: rgba(245, 158, 11, 0.35);

      --diff-adv-bg: rgba(139, 92, 246, 0.15);
      --diff-adv-text: #C084FC;
      --diff-adv-border: rgba(139, 92, 246, 0.35);

      --diff-all-bg: rgba(59, 130, 246, 0.15);
      --diff-all-text: #60A5FA;
      --diff-all-border: rgba(59, 130, 246, 0.35);

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.38);
      --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.5);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Classy Editorial Cashmere Theme (Warm Sepia Option) */
    body[data-theme="cashmere"] {
      --bg-main: #EDE7DE;
      --bg-surface: #F6F2EC;
      --bg-card: #FAF8F5;
      --bg-subtle: #E6DFD4;
      --border-color: #D5CCC0;
      --border-hover: #BEB4A4;
      --text-main: #222831;
      --text-muted: #596172;
      --text-light: #878E9E;

      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --primary-border: #C7D2FE;
      --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --primary-glow: rgba(79, 70, 229, 0.22);

      --diff-beginner-bg: #ECFDF5;
      --diff-beginner-text: #059669;
      --diff-beginner-border: #A7F3D0;

      --diff-inter-bg: #FFFBEB;
      --diff-inter-text: #D97706;
      --diff-inter-border: #FDE68A;

      --diff-adv-bg: #FAF5FF;
      --diff-adv-text: #7C3AED;
      --diff-adv-border: #E9D5FF;

      --diff-all-bg: #EFF6FF;
      --diff-all-text: #2563EB;
      --diff-all-border: #BFDBFE;

      --shadow-sm: 0 1px 3px rgba(44, 49, 61, 0.05);
      --shadow-md: 0 4px 12px rgba(44, 49, 61, 0.07);
      --shadow-lg: 0 12px 28px rgba(44, 49, 61, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13.5px;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Header & Large Avatar Branding */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1.15rem;
    }

    /* Larger Circular Avatar Container with Photo Cropper Trigger */
    .avatar-uploader {
      position: relative;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 3px;
      background: var(--primary-gradient);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .avatar-uploader:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-surface);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-subtle), var(--border-color));
      color: var(--primary);
    }

    .avatar-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 22px;
      height: 22px;
      background: var(--primary);
      color: #FFFFFF;
      border-radius: 50%;
      border: 2px solid var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
      transition: var(--transition);
    }

    .avatar-uploader:hover .avatar-badge {
      transform: scale(1.15);
      background: var(--primary-hover);
    }

    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, var(--text-main) 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background: var(--border-color);
      transform: translateY(-1px);
    }

    .stat-pill {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-full);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    /* Centered Controls Panel */
    .controls-panel {
      max-width: 1320px;
      margin: 1.25rem auto 0;
      padding: 0 1.5rem;
      width: 100%;
    }

    .filters-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.35rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      row-gap: 0.6rem;
      width: 100%;
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-right: 0.25rem;
      white-space: nowrap;
    }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      row-gap: 0.55rem;
    }

    .pill-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill-btn:hover {
      background: var(--border-hover);
      transform: translateY(-1px);
    }

    .pill-btn.active {
      background: var(--primary-gradient);
      border-color: transparent;
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .pill-count {
      font-size: 0.68rem;
      opacity: 0.85;
    }

    /* Main Content & Results Bar */
    main {
      max-width: 1320px;
      margin: 1.15rem auto 2.5rem;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }

    .results-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.15rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border-color);
    }

    .results-count {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--primary);
    }

    /* Resource Cards Grid (Compact & Eye-Catching) */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.15rem;
    }

    .resource-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
    }

    .resource-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px -4px rgba(99, 102, 241, 0.22), 0 4px 10px rgba(0,0,0,0.1);
      border-color: var(--border-hover);
    }

    .card-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    .card-category-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-diff-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .diff-beginner {
      background: var(--diff-beginner-bg);
      color: var(--diff-beginner-text);
      border-color: var(--diff-beginner-border);
    }

    .diff-intermediate {
      background: var(--diff-inter-bg);
      color: var(--diff-inter-text);
      border-color: var(--diff-inter-border);
    }

    .diff-advanced {
      background: var(--diff-adv-bg);
      color: var(--diff-adv-text);
      border-color: var(--diff-adv-border);
    }

    .diff-all {
      background: var(--diff-all-bg);
      color: var(--diff-all-text);
      border-color: var(--diff-all-border);
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.80rem;
      color: var(--text-muted);
      line-height: 1.48;
      margin-bottom: 0.85rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }

    .tag-chip {
      font-size: 0.68rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.12rem 0.45rem;
      border-radius: var(--radius-sm);
    }

    .card-actions {
      display: flex;
      align-items: center;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }

    .btn-summary {
      width: 100%;
      background: var(--primary-gradient);
      color: #FFFFFF;
      border: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.52rem 0.85rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: var(--transition);
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .btn-summary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 2rem;
      background: var(--bg-surface);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-lg);
    }

    .empty-state h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .empty-state p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    /* Summary Modal Viewer */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 12, 22, 0.75);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 860px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .modal-backdrop.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg-subtle);
    }

    .modal-header-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-close-btn {
      background: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      transition: var(--transition);
    }

    .modal-close-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    .modal-body {
      padding: 1.75rem 2rem;
      overflow-y: auto;
      flex: 1;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .modal-body h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.85rem;
      letter-spacing: -0.02em;
    }

    .modal-body h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 1.25rem;
      margin-bottom: 0.45rem;
    }

    .modal-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 1.35rem;
      margin-bottom: 0.45rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .modal-body h4 {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0.85rem;
      margin-bottom: 0.3rem;
    }

    .modal-body p {
      margin-bottom: 0.75rem;
      color: var(--text-muted);
    }

    .modal-body ul, .modal-body ol {
      margin-bottom: 0.85rem;
      padding-left: 1.35rem;
    }

    .modal-body li {
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }

    .modal-body strong {
      color: var(--text-main);
    }

    .modal-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82em;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 0.12em 0.38em;
      border-radius: var(--radius-sm);
      color: var(--primary);
    }

    .modal-body blockquote {
      border-left: 3px solid var(--primary);
      background: var(--primary-light);
      padding: 0.65rem 0.9rem;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: 0.85rem;
      color: var(--text-main);
      font-style: italic;
    }

    .modal-footer {
      padding: 0.85rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
    }

    .modal-done-btn {
      background: var(--primary-gradient);
      color: #FFFFFF;
      border: none;
      padding: 0.45rem 1.25rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      box-shadow: 0 2px 6px var(--primary-glow);
      transition: var(--transition);
    }

    .modal-done-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* Interactive Photo Cropper Modal */
    .crop-modal-card {
      max-width: 440px;
    }

    .crop-viewport {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000000;
      cursor: grab;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .crop-viewport:active {
      cursor: grabbing;
    }

    #crop-canvas {
      width: 280px;
      height: 280px;
      display: block;
    }

    .crop-circular-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(11, 17, 32, 0.72);
      border: 2px dashed #6366F1;
      pointer-events: none;
    }

    .crop-controls-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      max-width: 280px;
    }

    .crop-zoom-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .crop-slider {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .crop-icon-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Footer */
    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 1.25rem;
      margin-top: auto;
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .header-inner {
        padding: 0.75rem 1rem;
      }
      .controls-panel, main {
        padding: 0 1rem;
      }
      .resource-grid {
        grid-template-columns: 1fr;
      }
      .filters-wrap {
        padding: 0.85rem 1rem;
      }
      .modal-card {
        max-height: 94vh;
      }
      .modal-body {
        padding: 1.15rem;
      }
    }
  </style>
</head>
<body data-theme="midnight">

  <!-- Top Header Navigation -->
  <header>
    <div class="header-inner">
      <div class="brand-group">
        <!-- Large Circular Avatar with Interactive Cropper Trigger -->
        <div class="avatar-uploader" id="avatar-uploader" title="Click to adjust, crop or change your profile picture">
          <div class="avatar-inner">
            <img id="avatar-img" class="avatar-img" alt="Nabil Profile" style="display:none;">
            <div id="avatar-placeholder" class="avatar-placeholder">

mphasizes the architectural mindset required for high‑quality AI output: treat Claude as a programmable assistant, feed it explicit role definitions, tone guidelines, and concrete examples, and let its memory layer accumulate personal preferences over time. By the end of the week‑long rollout plan, the user should have a fully‑wired Claude environment that can draft copy, manipulate spreadsheets, schedule meetings, and even generate or refactor code without leaving the chat interface.\n\n## 2. Why It Matters  \nIn modern knowledge‑work, time spent re‑explaining context to a generative model erodes the value proposition of AI assistance. By leveraging Claude’s Projects and Memory, teams can eliminate repetitive briefings, ensuring that every interaction starts from a shared understanding of brand voice, workflow conventions, and data sources. The integration of MCP connectors transforms Claude from a passive responder into an active orchestrator that can read emails, update calendars, and push changes to design files, dramatically reducing context‑switching overhead. For developers, Claude Code brings the model into the terminal, enabling on‑the‑fly code generation, testing, and version‑control actions, which accelerates development cycles and lowers the barrier to adopting AI‑augmented coding practices. Collectively, these capabilities unlock a measurable boost in productivity, consistency, and scalability for solo entrepreneurs and small teams alike.\n\n## 3. Target Audience  \n- **Solo entrepreneurs or agency founders** who need a single AI assistant to handle copywriting, client communication, and project coordination.  \n- **Product managers and marketers** looking for a repeatable way to generate brand‑aligned content and automate routine outreach.  \n- **Developers and technical leads** who want a terminal‑based AI partner for rapid prototyping, bug fixing, and documentation.  \n- **Early‑stage teams** (1‑5 members) that are evaluating paid AI plans and need a concrete ROI justification before scaling.  \n\nAll of these groups benefit from the low‑entry‑barrier, step‑by‑step setup while still gaining enough depth to customize Claude for their specific workflows.\n\n## 4. Key Concepts & Principles  \n\n- **Persistent Project Workspaces**: A Project stores a system‑level prompt and a collection of reference files, automatically re‑loaded for every new conversation within that workspace. This eliminates the need to restate role, tone, or domain knowledge each time.  \n\n- **Global Memory Layer**: Claude continuously extracts patterns from interactions (e.g., preferred spelling, recurring terminology) and stores them in a user‑wide profile. Enabling “Learn from conversations” lets the model recall these preferences across all Projects.  \n\n- **Custom Instructions Blueprint**: Effective prompts follow a four‑part structure—identity, deliverable type, stylistic constraints, and prohibitions. Adding concrete examples of desired output dramatically improves fidelity.  \n\n- **Skills as Modular Instruction Packages**: A Skill is a directory containing a `SKILL.md` file that encodes a reusable workflow (e.g., “Create Word documents”). Once uploaded, Claude automatically activates the Skill when the request matches its description, providing consistent, high‑quality results without re‑authoring prompts.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude.ai Web & Mobile Interface** – The primary UI for chat, Project creation, and settings management.  \n- **Claude Projects** – Persistent workspaces that combine system prompts with uploaded assets (PDFs, DOCX, CSV, code).  \n- **Memory Settings** – Toggle in the Settings menu that governs whether Claude extracts and retains user preferences.  \n- **Skills (Skill Packages)** – Zip‑distributable folders containing `SKILL.md`; uploaded via Settings → Capabilities → Skills.  \n- **MCP Connectors** – OAuth‑based integrations (Gmail, Google Calendar, Notion, Figma, Slack, Linear, GitHub, etc.) that expose external data and actions to Claude.  \n- **Claude Code CLI** – Node‑based command‑line tool (`npm install -g @anthropic-ai/claude-code`) that brings Claude into a local development environment, reading a `CLAUDE.md` file for project‑specific directives.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Brand‑Consistent Content Production  \n1. **Create a “Content Hub” Project** in the Claude UI.  \n2. Draft a system prompt that defines the brand voice (e.g., British‑style, concise, no hype) and includes a short sample paragraph as a style reference.  \n3. Upload the brand guide, style sheet, and a few high‑performing blog posts as reference files.  \n4. Enable Memory so Claude remembers the tone across all future chats.  \n5. When a new article is needed, open a conversation inside the Project, ask for a draft, and Claude will generate copy that adheres to the pre‑loaded guidelines without additional prompting.  \n\n### Use Case 2 – Automated Meeting Management via MCP  \n1. In Settings → Connected Apps, link Gmail and Google Calendar using the OAuth flow.  \n2. In any conversation, request “Show me my free slots for next Tuesday” – Claude reads the calendar, identifies openings, and replies with a list.  \n3. Follow up with “Schedule a 30‑minute call with Alex at 2 PM” – Claude creates the event, sends an invitation via Gmail, and confirms the action.  \n4. Optionally, enable the Notion connector to log meeting notes automatically into a designated workspace.  \n\n### Use Case 3 – Agentic Coding with Claude Code  \n1. Install Node ≥ 18, then run `npm install -g @anthropic-ai/claude-code`.  \n2. Authenticate by executing `claude` and following the web‑based login prompt.  \n3. Place a `CLAUDE.md` file at the root of a repository containing: stack description, coding conventions, test command, and any file‑modification restrictions.  \n4. Inside the repo, run `claude` and ask “Add a new endpoint for user registration using Next.js and Supabase.” Claude will generate the files, run `npm test`, and commit the changes if all tests pass.  \n\n## 7. Prerequisites  \n\n- A registered Claude account (free tier sufficient for initial exploration).  \n- Basic familiarity with web‑based SaaS tools (Gmail, Google Calendar, Notion, etc.) for OAuth connections.  \n- For developer‑focused workflows: Node.js 18+ installed locally and access to a terminal.  \n- Optional: Access to a cloud storage location (Google Drive, Dropbox) for uploading reference documents.  \n\n## 8. Recommended Next Resources  \n\n- **Anthropic’s Official Skill Directory** – A curated list of community‑contributed Skill packages for niche domains (e.g., legal drafting, data analysis).  \n- **MCP Connector Development Guide** – Documentation for building custom MCP servers to integrate proprietary tools or internal APIs.  \n- **Advanced Prompt Engineering Playbook** – Deep‑dive techniques for chaining prompts, using few‑shot examples, and managing token budgets.  \n- **Claude Code Advanced Patterns** – Tutorials on multi‑step agentic workflows, automated test harness generation, and CI/CD integration.  \n- **Productivity Frameworks with AI Assistants** – Case studies on scaling Claude across small teams, measuring ROI, and establishing governance policies for AI‑generated content."}, {"id": "AI-002", "slug": "the-master-level-claude-guide", "title": "The Master Level Claude Guide", "category": "Getting Started", "subcategory": "Core Fundamentals", "difficulty": "Beginner to Advanced", "description": "From complete beginner to advanced user. Every practical workflow has been tested, from your first conversation through multi-agent automations, business monetisation, and a ready-to-use prompt reference library.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "01: Getting Started", "The Plans", "Setting Up", "Setting up your first Project", "02: The Basics", "How to Prompt Properly", "Core Fundamentals"], "ai_tools": ["Claude Code", "Claude Skills", "Claude", "PostHog", "Figma", "Ruflo", "NotebookLM"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-002_the-master-level-claude-guide.html", "summary_file": "summaries/AI-002.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-002 – The Master Level Claude Guide  \n\n- **Category:** Getting Started | **Subcategory:** Core Fundamentals  \n- **Difficulty:** Beginner to Advanced  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide walks a reader from the moment they create a Claude account to the point where they can orchestrate multi‑agent AI pipelines that replace whole agency functions. It first explains the subscription tiers, the concept of *Projects* (persistent context containers), and the anatomy of an effective prompt—role, context, task, and format. It then shows how to enrich Claude with uploaded assets (PDFs, spreadsheets, code, images) and live web search, turning the model into a real‑time research assistant.  \n\nSubsequent sections introduce the *Claude Code* terminal agent, the skill ecosystem (over 60 k community‑built modules), and the Model Context Protocol (MCP) that lets Claude interact with external services such as Figma, PostHog, or Ruflo. Finally, the material demonstrates how to combine these primitives into end‑to‑end workflows: automated document processing, multi‑agent development swarms, and productized services that can be monetized without hiring a traditional team.  \n\n## 2. Why It Matters  \nClaude’s value proposition lies in its ability to act as a *stateful* collaborator rather than a stateless chatbot. By leveraging Projects and Skills, users can embed brand guidelines, regulatory constraints, or technical standards directly into the model’s operating context, eliminating repetitive briefing. The integration of Claude Code and MCP bridges the gap between natural‑language instruction and concrete system actions (file edits, API calls, UI generation), delivering a 10‑fold speed boost for coding, design, and data‑processing tasks.  \n\nStrategically, the guide equips solo founders, small agencies, and product teams with a “virtual crew” that can produce marketing copy, conduct competitor analysis, build low‑code web apps, and automate back‑office paperwork—all for the cost of a modest subscription. This dramatically reduces overhead, shortens time‑to‑market, and opens a new revenue stream where services are sold on a per‑output basis rather than hourly labor.  \n\n## 3. Target Audience  \n- **Solo entrepreneurs & agency founders** who need to scale content creation, research, or automation without expanding headcount.  \n- **Product managers & developers** looking for a rapid prototyping environment that can generate, test, and iterate code from a high‑level brief.  \n- **Marketing & copy teams** that require consistent brand‑compliant output across multiple channels.  \n- **Consultants & analysts** who must synthesize large documents or market data quickly.  \n- **Technical leads** interested in integrating AI agents with existing SaaS tools (Figma, PostHog, etc.) via MCP.  \n\n## 4. Key Concepts & Principles  \n\n- **Prompt Architecture** – A disciplined prompt consists of four layers: a defined persona (role), the surrounding situation (context), the concrete request (task), and the desired presentation (format). This structure drives deterministic, high‑quality outputs.  \n- **Projects as Persistent Memory** – Projects act like a permanent briefing folder: they store a custom instruction, attached reference files, and a shared conversation log, ensuring Claude never starts from a blank slate.  \n- **Skills as Modular Playbooks** – A skill is a markdown‑based specification that teaches Claude a repeatable method for a niche task (e.g., SEO audit, PDF form filling). Installing a skill injects that method into Claude’s toolbox instantly.  \n- **Claude Code + MCP Integration** – Claude Code runs as a local Node.js agent capable of reading/writing the filesystem, executing shell commands, and invoking external services through MCP adapters, turning natural‑language directives into concrete system actions.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic)** – Conversational LLM with tiered models (Haiku, Sonnet, Opus) and optional web‑search capability.  \n- **Claude Code** – CLI‑based AI programmer that can edit files, run tests, and launch full applications from prompts.  \n- **Skill Marketplace** – Community‑hosted repository of `.md` skill definitions (e.g., `coreyhaines31/marketingskills`).  \n- **MCP (Model Context Protocol) Adapters** – Connectors that expose third‑party APIs to Claude Code (e.g., `@figma/mcp`, `@google/stitch-mcp`).  \n- **Ruflo** – A multi‑agent orchestration layer that spawns up to 60 specialized Claude agents for parallel planning, coding, testing, and security auditing.  \n- **NotebookLM** – Google’s research‑assistant tool that can be linked to Claude for curated knowledge bases.  \n- **PostHog** – Analytics platform reachable via MCP for data‑driven decision loops.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Automated Marketing Campaign Generation  \n1. **Create a Project** named “Briix‑Campaigns” and embed brand assets (logo, colour palette, tone guide).  \n2. **Install the `marketingskills` skill** (`npx skills add coreyhaines31/marketingskills`).  \n3. **Prompt Claude** with a structured request: role = “direct‑response copywriter”, context = “AI automation agency targeting UK SMEs”, task = “produce a 5‑email welcome sequence + landing page copy”, format = “markdown with headline, sub‑headline, bullet benefits, CTA”.  \n4. Claude returns ready‑to‑send emails and a copy block for the landing page, already styled per the brand instruction.  \n5. **Optional:** Use Claude Code to push the copy into a CMS via an MCP endpoint, completing the deployment in a single command.  \n\n### Use Case 2 – Multi‑Agent Development of a Dashboard App  \n1. **Initialize a Project** called “Analytics‑Dashboard” and add a brief that specifies the tech stack (React + Node, low‑code UI).  \n2. **Add the `superpowers` skill** (`npx skills add obra/superpowers`) to enforce test‑driven development.  \n3. **Spin up Ruflo** (`npx ruflo@latest init --wizard`) and connect it to Claude Code (`claude mcp add ruflo -- npx -y ruflo@latest mcp start`).  \n4. **Define three agents**: Planner, Coder, Tester. The Planner drafts a feature backlog; the Coder writes component code; the Tester runs the suite automatically after each commit.  \n5. **Run the workflow** via Ruflo’s daemon; agents collaborate, share memory, and iterate until the dashboard meets the acceptance criteria.  \n6. **Deploy** the final build with a single Claude Code command (`claude deploy --env production`).  \n\n## 7. Prerequisites  \n\n- A valid Anthropic account with at least the **Pro** subscription (to access web search and Projects).  \n- Node.js ≥ 18 installed locally (`node --version`).  \n- Basic familiarity with terminal commands and npm (`npm install -g @anthropic-ai/claude-code`).  \n- Access to the skill marketplace (public GitHub or Vercel registry).  \n- Optional: API keys for external services you intend to connect via MCP (Figma, PostHog, etc.).  \n\n## 8. Recommended Next Resources  \n\n- **Claude Documentation – Advanced Prompt Engineering** – Deep dive into role‑playing and chain‑of‑thought prompting.  \n- **MCP Developer Guide** – How to build custom adapters for proprietary SaaS tools.  \n- **Ruflo Multi‑Agent Playbook** – Patterns for scaling agent swarms across large codebases.  \n- **Design Systems with UI‑UX‑Pro‑Max** – Applying visual hierarchy and component libraries in AI‑generated UI.  \n- **Business Model Canvas for AI‑Powered Services** – Structuring pricing, delivery, and value propositions when selling Claude‑generated outputs.  \n\n---  \n\n*All content above is an original analytical synthesis; no verbatim excerpts from the source material have been used.*"}, {"id": "AI-003", "slug": "the-ultimate-claude-toolkit", "title": "The Ultimate Claude Toolkit", "category": "Getting Started", "subcategory": "Account & Setup", "difficulty": "Beginner", "description": "A curated collection of the most useful Claude tools, extensions, and integrations. Everything in one place, from browser extensions to desktop apps to the best community-built skills.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Which plan do you need", "Account & Setup"], "ai_tools": ["Claude Code", "Claude Opus", "Claude Desktop", "Claude", "ChatGPT", "OpenAI Codex", "PostHog", "Figma", "Wispr Flow", "NotebookLM"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-003_the-ultimate-claude-toolkit.html", "summary_file": "summaries/AI-003.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-003 – The Ultimate Claude Toolkit  \n\n- **Category:** Getting Started | **Subcategory:** Account & Setup  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide walks a newcomer through the end‑to‑end process of turning Claude into a reliable, low‑cost assistant for everyday professional work. It begins with account provisioning, explains how to configure a persistent profile and user‑level preferences, and then shows how to keep token consumption under control by editing prompts, resetting chats, and leveraging cached files.  \n\nBeyond the basics, the material introduces “Skills” (static instruction bundles) and “Projects” (persistent workspaces) that let Claude retain context across sessions, dramatically reducing repetitive setup. It also details how to craft high‑impact prompts by specifying role, task, format, and constraints, and it outlines the desktop and mobile extensions that expose file‑system integration, voice input, and third‑party connectors. Finally, the tutorial presents a curated set of free companion tools (e.g., NotebookLM, Perplexity, Claude Code) that fill gaps such as up‑to‑date research or bulk code manipulation.  \n\nOverall, the resource provides a repeatable workflow: create a well‑defined identity, lock down usage habits, install reusable instruction sets, and embed Claude within a project‑centric file hierarchy, all while pairing it with lightweight utilities that extend its reach.\n\n## 2. Why It Matters  \nIn practice, Claude’s token‑based pricing makes careless prompting expensive; the guide’s habits (editing instead of re‑sending, periodic chat resets, batch questioning) can slash daily consumption by up to 90 %. By persisting a profile and user preferences, users eliminate the “warm‑up” cost that otherwise wastes several messages each new conversation.  \n\nProjects and Skills transform Claude from a stateless chatbot into a quasi‑knowledge‑base that remembers brand guidelines, tone, and recurring assets, enabling teams to scale content creation, research, and code review without re‑training the model. The desktop CoWork mode and Claude Code connector further blur the line between AI and local tooling, allowing the model to read, edit, and act on files directly—an efficiency boost comparable to native IDE extensions.  \n\nCollectively, these practices turn Claude from a novelty into a cost‑effective, production‑grade collaborator that can be embedded in marketing pipelines, product documentation workflows, and even low‑code development cycles.\n\n## 3. Target Audience  \n- **Marketing & copywriters** who need consistent brand voice across newsletters, ads, and web copy.  \n- **Small‑business owners or agency leads** looking for a single AI that can remember client specifics without paying for enterprise plans.  \n- **Product managers and designers** who want quick research synthesis, UI copy generation, or design‑doc drafting.  \n- **Non‑technical professionals** who still benefit from code‑related automation (e.g., renaming files, batch converting formats) via Claude Code.  \n- **Students or freelancers** on a tight budget who need to maximize token efficiency while still accessing the most capable Claude model (Opus) through a Pro subscription.\n\n## 4. Key Concepts & Principles  \n\n- **Persistent Identity (Profile & Preferences):**  \n  A static description of who you are, your industry, and stylistic rules that Claude reads at the start of every chat, eliminating repetitive onboarding.  \n\n- **Token‑Economy Habits:**  \n  Editing prompts in place, resetting chats after ~15‑20 exchanges, and bundling multiple questions into a single message keep the cumulative token count low and maintain response speed.  \n\n- **Skills as Modular Instruction Sets:**  \n  Plain‑text `.md` files that encode a job description, tone, or workflow. Once uploaded, a single command (“use *skill‑name*”) activates the entire rule set for the current session.  \n\n- **Projects as Contextual Workspaces:**  \n  Folder‑like containers that cache files, hold project‑level instructions, and automatically supply that context to any new chat launched inside them, removing the need to re‑upload assets.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Sonnet / Opus):** Core conversational model; Sonnet is free with limits, Opus unlocks higher quality and unlimited Projects.  \n- **Claude Desktop (CoWork mode):** Native app that can read local files, interact with other applications, and execute actions via the Dispatch bridge from a mobile device.  \n- **Claude Mobile App:** Enables voice dictation and image capture for on‑the‑go prompt creation.  \n- **Claude Code (npm package):** CLI that lets Claude operate on a filesystem—run scripts, edit files, install dependencies—all via plain English commands.  \n- **NotebookLM:** Google‑hosted research assistant that indexes uploaded documents and answers fact‑based queries without hallucination.  \n- **Perplexity.ai:** Real‑time web search tool that supplies up‑to‑date facts and citations, complementing Claude’s static knowledge cutoff.  \n- **blink.new:** AI‑driven app generator that builds a live web app from a natural‑language spec, useful for rapid prototyping after Claude‑validated ideas.  \n- **Wispr Flow:** System‑wide voice‑to‑text service that works in any text field, allowing long, structured prompts to be dictated rather than typed.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Consistent Brand Copy Generation  \n1. **Create a Profile** with industry, audience, and tone details.  \n2. **Write a “Brand Skill”** (`brand‑tone.md`) that enforces British English, avoids specific buzzwords, and mandates a two‑version output.  \n3. **Upload brand guidelines** to a new Project called *Acme‑Copy*.  \n4. In a chat inside *Acme‑Copy*, invoke the skill: `use brand‑tone`.  \n5. Submit a single prompt containing all required copy pieces (e.g., headline, sub‑headline, CTA) as a numbered list.  \n6. Claude returns two polished variants; you select the best parts and publish.  \n\n### Use Case 2 – Automated Research‑to‑Report Pipeline  \n1. **Collect source PDFs** (market reports, interview transcripts) and drop them into a Project named *Market‑Insights*.  \n2. **Run NotebookLM** on the same folder to extract key arguments and contradictions.  \n3. Copy the concise answers from NotebookLM into Claude, prefixed with a prompt that asks for a 500‑word executive summary in bullet‑point format, with a “no‑jargon” constraint.  \n4. Claude produces the draft; you edit the prompt in place to tighten language, then regenerate.  \n5. Use Claude Code (`claude --project ./Market‑Insights`) to export the final markdown file to your documentation repo.  \n\n## 7. Prerequisites  \n\n- An active Claude account (Free for Sonnet, Pro for Opus & Projects).  \n- Basic familiarity with markdown files for Skills.  \n- Access to a modern web browser; optional installation of Claude Desktop (macOS/Windows) and/or mobile app.  \n- Node.js installed if you plan to use Claude Code (`npm install -g @anthropic-ai/claude-code`).  \n- Optional: Google account for NotebookLM, Perplexity account for web search, and a microphone for voice input via Wispr Flow.  \n\n## 8. Recommended Next Resources  \n\n- **Advanced Prompt Engineering** – deep dive into chaining, few‑shot examples, and dynamic role‑playing.  \n- **Claude API Integration** – how to embed Claude calls into custom scripts or low‑code platforms (Zapier, Make).  \n- **Project Management with Claude** – best practices for multi‑client Project hierarchies and version control.  \n- **Security & Data Governance** – guidelines for handling sensitive client files within Claude Projects and connectors.  \n- **Community Skill Repositories** – curated GitHub collections of ready‑to‑use Skills for SEO, legal drafting, and data analysis."}, {"id": "AI-004", "slug": "claude-dos-and-don-ts-guide", "title": "The Full Claude Dos and Don'ts", "category": "Getting Started", "subcategory": "Core Fundamentals", "difficulty": "Beginner to Advanced", "description": "The habits that make Claude output genuinely useful versus the common mistakes that produce generic, mediocre results. A practical reference you'll return to as your usage grows.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Chapter 01, Context", "Chapter 02, Instructions", "Chapter 03, Memory", "Chapter 04, Skills", "Chapter 05, Connectors", "Core Fundamentals"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-004_claude-dos-and-don-ts-guide.html", "summary_file": "summaries/AI-004.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-004 – The Full Claude Dos and Don’ts  \n\n- **Category:** Getting Started | **Subcategory:** Core Fundamentals  \n- **Difficulty:** Beginner to Advanced  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \n\nThis guide distills more than 400 hours of hands‑on experimentation with Anthropic’s Claude into a compact playbook that moves users from “search‑engine‑style” queries to a fully‑integrated AI‑powered workhorse. It explains how to structure Claude’s environment—through persistent **Projects**, a global **Memory** store, reusable **Skills**, and live **Connectors**—so that the model retains business context, follows precise style rules, and can act on real‑world data without manual copy‑pasting.  \n\nBeyond the technical scaffolding, the material introduces a decision‑making framework called the **LLM Council**, which runs multiple persona‑based prompts in parallel to surface divergent viewpoints and produce a single, vetted recommendation. Finally, the guide walks through building **scheduled Claude Code** tasks that automate repetitive communications (e.g., lead replies, weekly reports) and outlines a tiered upgrade path that aligns model selection (Opus vs. lighter variants) with workload intensity.  \n\nCollectively, the resource teaches a systematic, infrastructure‑first mindset: treat Claude as a persistent service layer rather than an ad‑hoc chatbot, and leverage its built‑in primitives to reduce context‑switching, eliminate redundant prompting, and scale AI‑assisted output across an organization.\n\n## 2. Why It Matters  \n\nAdopting the outlined patterns can shrink the time spent on routine knowledge work by **30‑50 %** for many knowledge‑workers. By persisting brand guidelines, SOPs, and personal preferences in a Project, users avoid re‑entering the same context for every interaction, which eliminates cognitive overhead and improves output consistency. The Memory feature ensures that once a fact (e.g., “company headquarters in Manchester”) is declared, Claude will honor it across all future chats, turning the model into a personalized assistant rather than a stateless query engine.  \n\nThe LLM Council adds a layer of critical thinking that mitigates the model’s tendency to over‑agree, delivering more balanced strategic advice for high‑stakes decisions such as pricing or hiring. Automation via Claude Code frees up human review time, turning repetitive drafting tasks into a “draft‑then‑approve” pipeline that can be executed on a schedule. Together, these capabilities transform Claude from a novelty into a cost‑effective, scalable component of an organization’s productivity stack, delivering measurable ROI within weeks of implementation.\n\n## 3. Target Audience  \n\n- **Freelance consultants & agency owners** who need a single AI hub for client deliverables, proposals, and internal SOPs.  \n- **Product managers & marketers** looking to embed brand‑consistent copy generation and data‑driven decision support into daily workflows.  \n- **Operations & sales teams** that handle high‑volume email, calendar coordination, and reporting and want to automate those touchpoints.  \n- **Technical leads** interested in prototyping AI‑driven automations using Claude Code and integrating with existing SaaS tools via connectors.  \n- **Mid‑level professionals** comfortable with basic prompt engineering but seeking a structured, repeatable framework to scale AI usage across projects.\n\n## 4. Key Concepts & Principles  \n\n- **Projects as Persistent Context Containers** – A Project bundles a set of instructions, uploaded reference files (brand guides, templates, pricing tables), and a default model. When you open a chat inside a Project, Claude automatically inherits this context, eliminating the need to restate background information.  \n\n- **Explicit Memory Management** – Users can issue “remember” or “forget” commands to store facts globally. This is distinct from Project‑level instructions and applies across all workspaces, enabling a personal knowledge base that the model consults before responding.  \n\n- **Skills as Reusable Prompt Packages** – A Skill encapsulates a deterministic prompt template plus post‑processing rules for a specific task (e.g., converting data to a DOCX, generating a PowerPoint outline). Once defined, the Skill can be invoked with a single command, guaranteeing consistent output without re‑typing the same prompt each time.  \n\n- **LLM Council Decision Engine** – By spawning multiple “advisor” personas (Contrarian, First‑Principles, Expansionist, Outsider, Executor) and having them critique each other, the Council surfaces hidden assumptions and converges on a single, ranked recommendation. This mitigates Claude’s default helpful‑but‑agreeable bias.  \n\n- **Connectors for Live Data Interaction** – MCP connectors bridge Claude to external services (Gmail, Google Calendar, Drive, Notion, Slack). They allow Claude to read real‑time information and draft actions (e.g., email replies) while keeping the user in control of final execution.  \n\n- **Scheduled Claude Code Automations** – Claude Code lets you write lightweight scripts that run on a timer, invoke Skills, and interact with connectors. Typical patterns include hourly lead‑response generation, nightly report compilation, and daily agenda summarization.  \n\n- **Model Tier Matching** – Opus (the most capable model) should be reserved for tasks requiring deep reasoning or long‑form composition, while lighter models (Claude‑3‑Haiku, etc.) are sufficient for routine data extraction or template filling, optimizing cost per token.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic’s conversational LLM)** – The core language model that powers all interactions, accessible via web UI, API, or Claude Code.  \n- **Claude Code** – A low‑code scripting environment within Claude that supports scheduled jobs, conditional logic, and connector calls. Ideal for building repeatable automations without external infrastructure.  \n- **MCP Connectors** – Pre‑built integrations that expose Gmail, Google Calendar, Google Drive, Notion, Slack, and other SaaS APIs to Claude. They enable read/write operations on user data when explicitly invoked.  \n- **Skill Library** – A repository of custom prompt bundles (e.g., “Create a DOCX from markdown”, “Generate a PowerPoint deck”) that can be shared across Projects.  \n- **LLM Council Prompt Templates** – Structured prompts that instantiate the five advisor personas and orchestrate their peer‑review cycle.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Consistent Brand‑Aligned Content Production  \n1. **Create a “Content” Project** and upload the brand style guide, tone‑of‑voice examples, and a list of prohibited phrasing.  \n2. Define a **Skill** called `WriteBlogPost` that accepts a headline and a keyword list, then injects the brand guide rules into the prompt.  \n3. In the Project chat, invoke `WriteBlogPost` with the desired topic. Claude returns a draft that already respects sentence length limits, avoids banned words, and follows the British‑English style.  \n4. If the output deviates, edit the draft, note the correction, and update the Skill’s rule set (e.g., “Never start with ‘In today’s world’”).  \n5. Re‑use the Skill for every new article, guaranteeing uniformity without re‑prompting.  \n\n### Use Case 2 – Automated Lead‑Response Pipeline  \n1. **Enable the Gmail connector** and grant read‑only access to the inbox and draft‑write permission.  \n2. Write a Claude Code script `LeadResponder` that runs every hour:  \n   ```python\n   leads = gmail.search(\"label:lead-unreplied newer_than:1d\")\n   for mail in leads:\n       reply = skill.invoke(\"DraftLeadReply\", {\n           \"sender_name\": mail.from_name,\n           \"company\": mail.subject,\n           \"tone\": \"friendly\"\n       })\n       gmail.create_draft(to=mail.from, subject=mail.subject, body=reply)\n   ```  \n3. Deploy the script as a scheduled task. Claude drafts a personalized reply for each new lead and saves it as a draft for quick human approval.  \n4. After a week, review the drafts, capture any recurring phrasing issues, and feed those back into the `DraftLeadReply` Skill to improve future drafts.  \n\n## 7. Prerequisites  \n\n- An active Anthropic Claude account (free tier sufficient for initial experimentation).  \n- Basic familiarity with prompt engineering concepts (instruction clarity, few‑shot examples).  \n- Access to the web UI or API token if you plan to call Claude programmatically.  \n- Permissions to connect Claude to the desired SaaS tools (Gmail, Drive, etc.).  \n- Optional: a simple text editor for drafting Skill definitions and Claude Code scripts.  \n\n## 8. Recommended Next Resources  \n\n- **Anthropic API Documentation** – Deep dive into endpoint parameters, token limits, and streaming responses for custom integrations.  \n- **Prompt Engineering Playbook** – Advanced techniques for chain‑of‑thought prompting, role‑playing, and output validation.  \n- **LLMOps Foundations** – Best practices for versioning prompts, monitoring token usage, and managing model upgrades.  \n- **Claude Code Advanced Scripting Guide** – Patterns for error handling, conditional branching, and multi‑connector orchestration.  \n- **AI‑Enhanced Decision Frameworks** – Courses on structured decision‑making with LLMs, covering bias mitigation and ensemble prompting.  \n\n---  \n\n*Take the first step today: open Claude, spin up a “Pilot” Project, upload your brand guide, and connect Gmail. In under ten minutes you’ll have a functional AI assistant that can already start drafting"}, {"id": "AI-005", "slug": "10-ways-to-stop-burning-your-claude-usage-limit", "title": "10 Ways to Stop Burning Your Claude Usage Limit", "category": "Getting Started", "subcategory": "Usage & Optimization", "difficulty": "Beginner", "description": "Usage limits hitting faster than expected? Ten concrete techniques to get more out of every message, from smarter prompting to caching strategies to knowing when to switch models.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Usage & Optimization"], "ai_tools": ["Claude Opus", "Claude Haiku", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-005_10-ways-to-stop-burning-your-claude-usage-limit.html", "summary_file": "summaries/AI-005.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-005 – 10 Ways to Stop Burning Your Claude Usage Limit  \n\n- **Category:** Getting Started | **Subcategory:** Usage & Optimization  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide explains how Claude’s token accounting works and why long, untrimmed conversations quickly become expensive. It introduces a set of practical habits—ranging from command‑line shortcuts to project‑level configuration—that let users keep the model’s context lightweight while preserving the essential information needed for continuity.  \n\nEach tip is paired with concrete steps (e.g., invoking `/compact`, editing prompts in‑place, batching questions) and with higher‑level settings such as Project memory, system prompts, and model selection. By the end of the material, a practitioner can design a repeatable workflow that minimizes both input and output token consumption without sacrificing answer quality.  \n\n## 2. Why It Matters  \nToken usage directly translates to cost and quota exhaustion on Claude. Unintended re‑reading of redundant history or duplicated document uploads can inflate consumption by orders of magnitude, especially in iterative brainstorming sessions. Implementing the recommended patterns yields measurable savings—often cutting usage by 70‑90 % for a typical back‑and‑forth dialogue—thereby extending the usable lifespan of a subscription and freeing budget for higher‑value tasks.  \n\nBeyond economics, leaner context improves response latency and reduces the chance of the model drifting away from the core problem, because it only sees the most relevant information. This aligns with best practices for prompt engineering and scalable AI product design.  \n\n## 3. Target Audience  \n- **AI‑savvy professionals** (product managers, content creators, developers) who rely on Claude for daily drafting, research, or code assistance.  \n- **Small teams or solo entrepreneurs** operating under limited token quotas and needing cost‑effective interaction patterns.  \n- **New Claude adopters** who are familiar with the UI but have not yet optimized their workflow for token efficiency.  \n\n## 4. Key Concepts & Principles  \n\n- **Context Compression (`/compact`)** – A built‑in command that replaces the full message history with a concise summary, preserving essential facts while discarding filler.  \n- **In‑Place Prompt Editing** – Modifying the original user message rather than appending a correction, which prevents the model from retaining the erroneous response in its context.  \n- **Conversation Reset Cadence** – Proactively starting a new chat after roughly 15‑20 exchanges, using a generated summary to transfer only the needed state.  \n- **Project‑Level File Caching** – Uploading recurring documents once to a Claude Project so that subsequent chats can reference them without re‑tokenizing the content.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Opus / Sonnet / Haiku** – The three model tiers offered by Anthropic; each has distinct token cost and reasoning capability, allowing users to match workload complexity to the appropriate engine.  \n- **Claude Projects** – A workspace feature that stores files, system prompts, and user preferences, making them globally available to every chat launched within the project.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Maintaining a Long‑Running Research Thread  \n1. **Start a Project** and upload the research PDFs, brand guidelines, and any reference PDFs.  \n2. **Set User Preferences** once (role, tone, brevity) in the Project’s Memory tab.  \n3. **Ask the first question**; after 12‑15 exchanges, type `/compact` to collapse the history.  \n4. **If a response is off‑target**, click the edit icon on the original prompt, adjust the wording, and resend.  \n5. **When the thread reaches ~20 messages**, request a summary (`Summarise everything we have covered…`), copy the output, open a new chat, paste the summary as the opening prompt, and continue.  \n\n### Use Case 2 – Batch‑Processing Customer Support Queries  \n1. **Collect all pending tickets** and list them as a numbered set in a single message.  \n2. **Add a length constraint** (`Answer each in ≤ 2 sentences`).  \n3. **Send the batch**; Claude processes the entire list in one context load, returning concise replies.  \n4. **Reference the uploaded FAQ document** from the Project instead of pasting its full text, saving token duplication.  \n\n## 7. Prerequisites  \n\n- An active Claude account with access to the web UI (or API) and the ability to create Projects.  \n- Basic familiarity with Claude’s chat interface (hover‑edit, system prompt area).  \n- Understanding of token concepts (input vs. output) to gauge cost impact.  \n\n## 8. Recommended Next Resources  \n\n- **Prompt Engineering Fundamentals** – Deep dive into crafting efficient system and user prompts.  \n- **Claude API Integration Guide** – How to automate the `/compact` and batch‑question patterns via programmatic calls.  \n- **Cost Management for Generative AI** – Strategies for monitoring token usage across teams and setting alerts.  \n- **Advanced Memory Management** – Leveraging long‑term memory features for multi‑session workflows."}, {"id": "AI-006", "slug": "claude-wispr-flow-and-cookiy-ai-setup-guide", "title": "Claude, Wispr Flow and Cookiy AI Setup Guide", "category": "Getting Started", "subcategory": "Account & Setup", "difficulty": "Intermediate", "description": "Set up voice-to-AI and browser automation together. Wispr Flow turns your voice into Claude prompts. Cookiy AI handles repetitive browser tasks. This guide wires them both up in under an hour.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Getting Started", "Chapter 01, Claude", "Chapter 02, Wispr Flow", "Installation", "Key features to know", "Chapter 03, Cookiy AI", "Setting up via the platform", "Account & Setup"], "ai_tools": ["Claude", "Cursor", "Figma", "Wispr Flow", "Cookiy AI"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-006_claude-wispr-flow-and-cookiy-ai-setup-guide.html", "summary_file": "summaries/AI-006.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-006 - Claude, Wispr Flow and Cookiy AI Setup Guide  \n\n- **Category:** Getting Started | **Subcategory:** Account & Setup  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a practitioner through the end‑to‑end provisioning of three complementary AI services—Claude (Anthropic’s conversational model), Wispr Flow (system‑wide voice dictation), and Cookiy AI (automated qualitative research). It details the minimal configuration required for each platform (account creation, project scaffolding, memory activation, hot‑key mapping, and skill installation) and then demonstrates how to stitch them together into a “think‑out‑loud → structure → validate” pipeline.  \n\nThe technical flow hinges on three architectural pillars: (1) **persistent context** in Claude via Projects and Memory, (2) **real‑time speech‑to‑text injection** across any UI using Wispr Flow’s accessibility hook, and (3) **AI‑driven research orchestration** via Cookiy’s skill that turns natural‑language prompts into full‑fledged user‑interview studies. By the end of the material, a user can dictate a hypothesis, have Claude refine it, automatically launch a Cookiy study, and then dictate the next iteration—all without manual copy‑pasting or switching applications.\n\n## 2. Why It Matters  \nTraditional knowledge work is throttled by keyboard latency and fragmented tooling. By replacing typing with voice, the workflow eliminates the “thinking‑to‑typing” bottleneck, delivering a 3‑5× speed boost in idea capture. Claude’s project‑level memory ensures that each interaction builds on prior context, reducing repetitive prompt engineering. Cookiy injects genuine human insight at a fraction of the time and cost of conventional research, turning speculative concepts into data‑backed decisions within a single workday. The combined stack therefore accelerates product discovery, content creation, and strategic planning while keeping the cognitive load low.\n\n## 3. Target Audience  \n- **Product managers** who need rapid hypothesis testing and user validation.  \n- **Content creators / marketers** looking to iterate scripts or messaging with real‑world feedback.  \n- **UX researchers** who want to prototype qualitative studies without manual recruitment.  \n- **Solo entrepreneurs or small agencies** that lack dedicated research budgets but require data‑driven decisions.  \n- **Technical writers or developers** comfortable with command‑line or UI configuration and seeking a voice‑first productivity boost.\n\n## 4. Key Concepts & Principles  \n\n- **Persistent Project Context (Claude):** A *Project* acts as a long‑lived workspace where every chat inherits a predefined brief, uploaded reference files, and learned preferences, eliminating the need to restate background on each session.  \n\n- **Memory‑Enabled Personalization:** Enabling Claude’s memory allows the model to store user‑specific facts (e.g., role, tone preferences) across conversations, making subsequent outputs more aligned without re‑prompting.  \n\n- **System‑Wide Voice Injection (Wispr Flow):** By granting microphone and accessibility permissions, Wispr Flow captures speech while a hotkey is held (or toggled) and injects the transcribed text directly into the active cursor location, making dictation app‑agnostic.  \n\n- **Command Mode & Voice Shortcuts:** In the paid tier, selected text can be transformed on‑the‑fly (e.g., “make this concise”) and custom phrases can expand into reusable blocks (e.g., inserting a Calendly link).  \n\n- **AI‑Orchestrated Qualitative Research (Cookiy AI):** The platform auto‑generates discussion guides, recruits participants from a massive panel, runs AI‑moderated interviews, and synthesizes findings (themes, sentiment, video clips) within 24 h.  \n\n- **Skill Integration (Claude ↔ Cookiy):** Uploading Cookiy’s “skill” package to Claude creates a native command surface—Claude can trigger a Cookiy study simply by recognizing a research‑oriented prompt, streamlining the hand‑off between ideation and validation.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic):** Conversational LLM with Projects, Memory, and a Skills marketplace. Used as the central reasoning engine that stores context, drafts content, and forwards research requests.  \n\n- **Wispr Flow:** Cross‑platform voice dictation utility that works via a configurable hotkey, microphone access, and OS accessibility services. Provides real‑time transcription, command‑mode editing, and custom dictionary support.  \n\n- **Cookiy AI:** Autonomous user‑research platform that leverages AI moderators to conduct and analyze qualitative interviews. Offers a GitHub‑hosted “skill” for Claude integration.  \n\n- **Supporting Services (optional):** Gmail, Google Calendar, Google Drive, Notion, Slack, Figma—connectable to Claude for data retrieval and action automation.\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid Video Concept Validation  \n1. **Activate Wispr Flow** (hold right‑Option) and dictate a rough video script into Claude.  \n2. **Claude** parses the input, suggests a hook‑content‑CTA structure, and asks if you want a research question.  \n3. **Trigger Cookiy** by saying “run a study on this hook” (Claude’s Cookiy skill creates a discussion guide).  \n4. **Cookiy** recruits 20 target viewers, runs 10‑minute interviews, and returns a report with sentiment scores and key quotes.  \n5. **Return to Wispr Flow**, dictate a revised script based on insights, and let Claude format it for the final storyboard.  \n\n### Use Case 2 – Solo Founder Pricing Experiment  \n1. **Speak** “I’m considering a $49/month tier for my SaaS” while Wispr Flow injects the sentence into Claude.  \n2. **Claude** expands the idea into a pricing hypothesis, then asks to validate.  \n3. **Ask Claude** “run a Cookiy test on willingness‑to‑pay for this tier.” The skill launches a 30‑interview study targeting potential buyers.  \n4. **Within 24 h**, Cookiy delivers a breakdown of price acceptance, objections, and suggested price points.  \n5. **Dictate** a decision memo via Wispr Flow; Claude formats it into a slide deck ready for investors.  \n\n## 7. Prerequisites  \n\n- Active accounts for Claude, Wispr Flow, and Cookiy AI (free tiers sufficient for initial trials).  \n- macOS (Intel or Apple Silicon) or Windows machine with microphone and accessibility permissions enabled.  \n- Basic familiarity with Claude’s UI (Projects, Settings → Memory, Settings → Connected Apps).  \n- Ability to run a Git clone or download a zip file from GitHub (for the Cookiy skill).  \n- Optional: Access to Google Workspace or Notion if you plan to connect Claude to external data sources.\n\n## 8. Recommended Next Resources  \n\n- **Claude Advanced Prompt Engineering** – deep‑dive into crafting system prompts, chaining skills, and using tool‑use APIs.  \n- **Voice‑First UI Design Patterns** – best practices for building efficient hot‑key workflows and custom dictionaries.  \n- **Qualitative Research Methodology** – fundamentals of interview guide design, participant screening, and thematic analysis to complement Cookiy’s automated output.  \n- **Automation with Claude Connectors** – tutorials on linking Claude to Zapier, Make, or custom webhooks for end‑to‑end pipeline automation.  \n- **Security & Privacy Checklist for AI Assistants** – guidance on handling sensitive data when using cloud‑based LLMs and research panels."}, {"id": "AI-007", "slug": "claude-routines-setup-guide", "title": "Claude Routines Setup Guide", "category": "Claude Code", "subcategory": "Environment Setup", "difficulty": "Intermediate", "description": "Build scheduled tasks that run automatically without you being at your desk. How to set up Claude Routines in Claude Desktop, connect your tools, and have Claude handle recurring work on autopilot.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "What Routines Are", "What a Routine Contains", "Where to Find It", "Chapter 02, Setting Up a Routine", "1 Write Your Prompt", "2 Connect Your Repositories", "Environment Setup"], "ai_tools": ["Claude Code", "Claude", "n8n", "Zapier"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-007_claude-routines-setup-guide.html", "summary_file": "summaries/AI-007.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-007 - Claude Routines Setup Guide  \n\n- **Category:** Claude Code | **Subcategory:** Environment Setup  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks the reader through the end‑to‑end creation of a **Claude Routine**, a cloud‑hosted automation construct that couples a natural‑language prompt with direct access to GitHub repositories and a suite of service connectors. Unlike traditional pipeline tools that execute a static series of nodes, a Routine lets Claude interpret the current context, make decisions, and produce varied outcomes on each invocation.  \n\nThe material explains how to define the four pillars of a Routine—prompt, repository list, environment (including secrets and pre‑run scripts), and connectors—then select one of three trigger modalities (scheduled cron‑style, GitHub event‑driven, or on‑demand API call). It also details the operational limits (run caps per plan, minimum hourly cadence, branch‑write safeguards) and security considerations such as one‑time bearer tokens for API triggers.  \n\nBy the end of the article, a practitioner can spin up a fully‑functional Routine from the web UI, desktop client, or CLI, configure it to react to code changes or time‑based events, and integrate it with Slack, Linear, Gmail, or Google Calendar for downstream notifications.\n\n## 2. Why It Matters  \nClaude Routines shift automation from **static orchestration** to **context‑aware AI execution**. Because the logic lives on Anthropic’s infrastructure, teams no longer need to maintain cron jobs, CI agents, or self‑hosted workers; the routine persists indefinitely and scales automatically. This reduces operational overhead, eliminates “forgotten” cron jobs, and provides a single source of truth for AI‑driven policies (e.g., security review checklists).  \n\nIn modern development pipelines, rapid feedback loops are critical. Routines can instantly react to pull‑request events, enforce labeling conventions, or generate on‑the‑fly reports, thereby accelerating triage, improving code quality, and freeing human reviewers to focus on higher‑level design concerns. The ability to invoke a Routine via a simple HTTP POST also makes it a natural extension point for monitoring systems, CD pipelines, or internal dashboards.\n\n## 3. Target Audience  \n- **DevOps engineers** looking to replace or augment existing cron‑based jobs with AI‑enhanced automation.  \n- **Software architects** who want to embed reasoning‑capable agents into their CI/CD flow without managing extra infrastructure.  \n- **Product managers / team leads** interested in automated backlog grooming, documentation drift detection, or release health checks.  \n- **Intermediate‑level developers** familiar with GitHub, basic HTTP tooling, and cloud‑based AI services, seeking to experiment with AI‑driven workflows.\n\n## 4. Key Concepts & Principles  \n\n- **Routine Definition**: A composite object consisting of a natural‑language instruction set, a list of GitHub repositories, an optional environment block (variables, pre‑run scripts), and a collection of service connectors. The prompt drives Claude’s reasoning each time the Routine fires.  \n\n- **Trigger Modalities**:  \n  1. **Schedule** – Recurring execution based on hourly, daily, weekday, weekly, or custom cron expressions (minimum granularity: one hour).  \n  2. **GitHub Event** – Real‑time activation when a selected repository event occurs (e.g., PR opened, merged, release published).  \n  3. **API Call** – Immediate fire via a unique endpoint secured with a bearer token, allowing any external system to invoke the Routine.  \n\n- **Connector Ecosystem**: Pre‑built adapters that expose external services (Slack, Linear, Gmail, Google Calendar, GitHub) to Claude. Connectors enable the Routine to post messages, create tickets, send emails, or manipulate repository objects without custom code.  \n\n- **Safety & Limits**: Routines are sandboxed to write only to branches prefixed with `claude/` unless explicitly relaxed, protecting mainline code. Plan tiers impose daily run caps (5‑25 runs) and enforce a minimum schedule interval of 60 minutes. API tokens are displayed only once and must be stored securely.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code** – Anthropic’s web‑based IDE where Routines are authored, edited, and inspected. It hosts the execution environment and provides the UI for trigger configuration.  \n- **GitHub** – Source‑code platform that supplies repositories for read/write access and emits webhook‑style events that can launch a Routine.  \n- **Connectors (Slack, Linear, Gmail, Google Calendar)** – Ready‑made integrations that let Claude interact with communication, issue‑tracking, and calendar services.  \n- **cURL / HTTP Client** – Command‑line utility used to POST to the Routine’s API endpoint, demonstrating how external systems can trigger a Routine programmatically.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Nightly Issue Triage (Schedule Trigger)  \n1. **Create Routine** in the Claude web UI, selecting “Schedule” as the trigger and configuring a daily run at 08:00 local time.  \n2. **Prompt**: Instruct Claude to fetch all newly opened GitHub issues, apply label heuristics based on keywords, assign owners from a predefined mapping, and compose a Slack digest.  \n3. **Repositories**: Add the target repo(s) where issues reside.  \n4. **Connectors**: Enable GitHub (for issue mutation) and Slack (for the digest).  \n5. **Environment**: Store any API keys (e.g., Slack bot token) as environment variables.  \n6. **Save** – Claude will automatically clone the repo, run the prompt logic, push label changes, and post the summary each night.  \n\n### Use Case 2 – On‑Demand Deploy Verification (API Trigger)  \n1. **Define Routine** with an API trigger; capture the generated endpoint URL and one‑time bearer token. Store the token in a CI secret store (e.g., GitHub Actions `secrets.ROUTINE_TOKEN`).  \n2. **Prompt**: Tell Claude to accept a JSON payload contain
