--------------|\n| **Product marketers / growth hackers** | Beginner‑to‑intermediate | Instantly run SEO audits, generate ad copy, and build email sequences without external tools. |\n| **UI/UX designers & front‑end engineers** | Junior‑to‑mid‑level | Gain AI‑assisted layout generation that respects visual hierarchy and design tokens. |\n| **Full‑stack developers** | Mid‑level | Adopt a test‑driven, clean‑architecture pipeline (superpowers + software‑architecture) inside Claude. |\n| **Data analysts & office admins** | Beginner | Manipulate spreadsheets, PDFs, and slide decks via plain English commands. |\n| **AI ops / platform engineers** | Mid‑level | Deploy MCP servers to expose external APIs to Claude, enabling custom integrations. |\n| **Team leads / CTOs** | Senior | Reduce token spend and enforce consistent engineering standards across AI‑augmented projects. |\n\n## 4. Key Concepts & Principles  \n\n- **Skill‑based augmentation:** A modular plug‑in that registers new prompt patterns and optional runtime helpers, allowing Claude to invoke specialized logic on demand.  \n- **Context engineering & KV caching:** Techniques that store intermediate results (key‑value pairs) to avoid re‑sending large context blocks, cutting token usage while preserving answer fidelity.  \n- **Design‑system enforcement:** Continuous validation of generated UI against a predefined token set, spacing scale, and colour palette to keep AI output aligned with brand guidelines.  \n- **Agentic workflow orchestration:** Using multiple skills together (e.g., “plan → build → test”) to emulate a human‑like development lifecycle, where each stage is a separate Claude‑driven agent.  \n\n## 5. Tools & Technologies Mentioned  \n\n| Tool | Role & Context |\n|------|----------------|\n| **npx (Node Package Executor)** | Executes the `skills add` command to fetch and register a skill from a GitHub repo. |\n| **Claude Code / Claude Desktop / Cursor** | Host environments where the installed skills become callable via natural‑language prompts. |\n| **Remotion (React‑based video engine)** | Provides the rendering backend for the `remotion` skill, turning textual video descriptions into frame‑by‑frame React components. |\n| **Anthropic MCP (Model Context Protocol)** | Protocol for exposing external services to Claude; the `mcp-builder` skill scaffolds a server that adheres to this spec. |\n| **GitHub repositories (e.g., `coreyhaines31/marketingskills`)** | Source of the skill implementations; each repo contains prompt templates, parsers, and optional helper scripts. |\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – End‑to‑end Marketing Campaign Generation  \n1. **Install the marketing toolkit**: `npx skills add coreyhaines31/marketingskills`.  \n2. **Run an SEO audit**: In Claude, type “run a full SEO audit on https://example.com”. Claude returns a structured report with on‑page recommendations.  \n3. **Create ad copy**: Prompt “write three Facebook ad variations for a SaaS product targeting small businesses, using the AIDA framework”. The skill pulls from the audit insights to tailor messaging.  \n4. **Build an email nurture flow**: Ask “generate a 5‑email welcome series for new sign‑ups, each email focusing on a different product benefit”. Claude outputs ready‑to‑send markdown or HTML.  \n5. **Export to a spreadsheet**: Invoke the `xlsx` skill: “create a spreadsheet summarizing the SEO findings, with columns for issue, severity, and remediation”. Claude writes an `.xlsx` file you can download.  \n\n### Use Case 2 – Design‑First Front‑End Development Pipeline  \n1. **Add UI‑UX intelligence**: `npx skills add nextlevelbuilder/ui-ux-pro-max-skill@ui-ux-pro-max`.  \n2. **Add design‑system validator**: `npx skills add vercel-labs/agent-skills@web-design-guidelines`.  \n3. **Describe the component**: “build a pricing card for a B2B SaaS product targeting SMEs, using a primary‑blue accent and a 4‑column grid”.  \n4. **Claude generates React code** that respects hierarchy, colour psychology, and token spacing.  \n5. **Run the validator**: “check the generated UI against our design system”. Claude flags any mismatches (e.g., missing accessibility attributes).  \n6. **Iterate**: Adjust the prompt based on validator feedback, re‑run until the UI passes.  \n\n## 7. Prerequisites  \n\n- **Node.js 18+** installed (required for Remotion and most skill scripts).  \n- **Access to a Claude‑compatible environment** (Claude Code, Claude Desktop, or a CLI wrapper like Cursor).  \n- **Git** (for cloning skill repos if manual inspection is needed).  \n- **Basic familiarity with command‑line usage** (`npx`, `npm`).  \n- **Optional:** A project folder with a pre‑scaffolded Remotion setup for the video skill, and a host (local or cloud) ready to run MCP servers if you plan to expose external APIs.  \n\n## 8. Recommended Next Resources  \n\n- **Deep dive into Claude’s agentic architecture** – official Anthropic documentation on multi‑agent orchestration and token budgeting.  \n- **“Supercharged Prompt Engineering”** – a workshop series that teaches how to craft prompts that trigger specific skill pathways.  \n- **Clean Architecture with Claude** – a community tutorial that expands on the `software-architecture` skill, adding domain‑driven design patterns.  \n- **MCP Server Deployment Guide** – step‑by‑step instructions for containerizing and scaling MCP services on platforms like Railway or Fly.io.  \n- **Remotion Advanced Rendering** – video‑production guide covering custom shaders, data‑driven animations, and CI/CD pipelines for automated video builds.  \n\n---  \n\n*All commands and workflow steps are original re‑interpretations; no text has been copied verbatim from the source material.*"}, {"id": "AI-028", "slug": "top-1-claude-skills", "title": "Top 1% Claude Skills", "category": "Prompts & Skills", "subcategory": "Custom Skills", "difficulty": "Intermediate", "description": "The advanced skill configurations used by the top 1% of Claude users. Custom skill architecture, skill chaining, and the patterns that separate power users from everyone else.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "Custom Skills"], "ai_tools": ["Claude Skills", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-028_top-1-claude-skills.html", "summary_file": "summaries/AI-028.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-028 - Top 1% Claude Skills  \n\n- **Category:** Prompts & Skills | **Subcategory:** Custom Skills  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide explains how to evolve a Claude “skill” from a single static markdown prompt into a modular, self‑correcting system. It introduces three complementary techniques: a “gotcha” log that records recurring errors, a folder‑based organization that leverages Claude’s progressive‑disclosure capability, and a constraint‑driven prompting style that supplies intent rather than rigid step‑by‑step scripts. Together, these practices let Claude remember past failures, keep the active context window lean, and adapt its output to edge cases without breaking.\n\nThe underlying architecture treats a skill as a lightweight project: a root `SKILL.md` file that contains the core prompt plus a “Gotcha Section,” and optional sub‑directories (`scripts/`, `examples/`, `templates/`, `references/`) that hold auxiliary assets. When Claude processes a request, it first reads the root file, then pulls in any referenced file only if the current task demands it. The gotcha list is consulted at the start of each run, allowing Claude to pre‑empt previously observed mis‑behaviors. The prompting style emphasizes “why” a rule exists (e.g., avoid jargon for a non‑technical audience) instead of prescribing exact phrasing, which yields more resilient outputs.\n\n## 2. Why It Matters  \nIn production‑grade AI‑assisted workflows, prompt brittleness and context overload are common failure points. By logging mistakes, the system creates a feedback loop that reduces the need for manual post‑processing. The folder‑centric layout prevents the prompt from being flooded with irrelevant data, preserving token budget and improving response latency. Finally, constraint‑oriented instructions enable Claude to handle unforeseen inputs gracefully, cutting down on repetitive re‑prompting and increasing overall throughput. Collectively, these tactics raise the reliability of Claude‑driven automation to a level comparable with custom‑coded solutions, while retaining the flexibility of a language model.\n\n## 3. Target Audience  \n- **Prompt Engineers** who already use Claude and want to scale their prompts into reusable assets.  \n- **Product Managers** building internal AI assistants that must evolve over time without constant re‑authoring.  \n- **Developers** integrating Claude into CI/CD pipelines, where deterministic behavior and low token usage are critical.  \n- **Content Strategists** needing consistent tone and formatting across large volumes of generated text.  \n\nThe material assumes familiarity with basic markdown prompting and a willingness to experiment with file‑system organization.\n\n## 4. Key Concepts & Principles  \n\n- **Gotcha Log**: A structured list inside the main prompt that records concrete errors (e.g., “do not start with a greeting”). Claude reads this list at the beginning of each execution, preventing recurrence of the same fault.  \n- **Progressive Disclosure**: Claude only loads supplemental files when the prompt explicitly references them, keeping the active context window minimal and focused on the task at hand.  \n- **Constraint‑Based Prompting**: Instead of hard‑coding every step, the prompt supplies the rationale behind each rule (e.g., “avoid technical jargon because the audience is non‑technical”), allowing Claude to adapt while still respecting the intended boundaries.  \n- **Skill as a Folder**: Treating a skill as a directory rather than a single file encourages modularity. Scripts, example outputs, templates, and style guides live side‑by‑side, making it easy to swap or extend components without rewriting the core prompt.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic’s LLM)**: The generative engine that interprets the `SKILL.md` prompt, consults the gotcha list, and optionally reads auxiliary files.  \n- **File System (POSIX commands)**: Basic shell utilities (`mkdir`, `touch`) are used to create the hierarchical skill structure; any OS that supports standard directory operations can host the layout.  \n\n*(No external libraries are required; the approach is language‑agnostic and works with any environment that can feed files to Claude via its API or UI.)*\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Consistent Business Report Generation  \n1. **Create the skill skeleton**:  \n   ```bash\n   mkdir report‑skill && cd report‑skill\n   mkdir scripts examples templates references\n   touch SKILL.md\n   ```  \n2. **Populate `examples/`** with a well‑crafted report (`good‑output.md`) and a deliberately flawed version (`bad‑output.md`).  \n3. **Add a template** (`templates/report‑template.md`) that defines sections such as Executive Summary, Findings, and Recommendations.  \n4. **Write the core prompt** in `SKILL.md`, referencing the template and examples, and include a Gotcha Section that bans opening salutations and mandates ending after the final bullet.  \n5. **Run the skill** via Claude’s API, passing the task description (e.g., “Summarize Q3 sales data”). Claude reads the prompt, pulls the template, and produces a report that respects tone and structure.  \n6. **Iterate**: If Claude adds an unwanted conclusion, add a specific entry to the Gotcha Section (“Do not add a conclusion unless asked”). Subsequent runs will omit it automatically.  \n\n### Use Case 2 – Adaptive Customer Support Drafts  \n1. **Set up the folder** `support‑drafts` with subfolders `templates/` (containing a ticket‑response template) and `references/` (holding a style guide).  \n2. **Define constraints** in `SKILL.md` such as “use a friendly tone for consumer‑facing replies” and “avoid technical jargon unless the ticket indicates a developer audience.”  \n3. **Add a Gotcha entry** after the first run if Claude inserts a generic “Thank you for contacting us” line that the team prefers to omit.  \n4. **Invoke the skill** with the ticket text; Claude reads the prompt, applies the constraints, and only loads the template if the ticket requires a structured response.  \n5. **Review and augment** the Gotcha list whenever a new pattern of error emerges (e.g., misuse of pronouns). Over time the skill self‑corrects, reducing manual editing.  \n\n## 7. Prerequisites  \n\n- Access to Claude (via Anthropic’s web UI or API).  \n- Basic command‑line proficiency to create directories and files.  \n- Familiarity with markdown syntax for prompt authoring.  \n- An initial prompt or use case that you wish to formalize into a reusable skill.  \n\n## 8. Recommended Next Resources  \n\n- **“Prompt Engineering for LLMs”** – a deeper dive into crafting intent‑driven prompts and managing token budgets.  \n- **Anthropic API Documentation** – details on sending file references and handling progressive disclosure programmatically.  \n- **Version‑Control for Prompt Assets** – tutorials on using Git to track changes to skill folders, enabling collaborative improvement.  \n- **Advanced Constraint Patterns** – a collection of reusable constraint templates for tone, formatting, and audience adaptation."}, {"id": "AI-029", "slug": "the-llm-council-setup-guide", "title": "The LLM Council Setup Guide", "category": "Prompts & Skills", "subcategory": "Custom Skills", "difficulty": "Intermediate", "description": "Set up a multi-model council where Claude, GPT-4, and other LLMs critique and improve each other's outputs. The architecture, the prompts, and the use cases where collective model reasoning wins.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "Chapter 02, How the Council Works", "Chapter 03, The Five Advisors", "Chapter 04, The Full Prompt", "Chapter 05, How to Run It", "Chapter 06, When to Use It", "Custom Skills"], "ai_tools": ["Claude", "Gemini"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-029_the-llm-council-setup-guide.html", "summary_file": "summaries/AI-029.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-029 – The LLM Council Setup Guide  \n\n- **Category:** Prompts & Skills | **Subcategory:** Custom Skills  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide explains how to transform a single‑model interaction into a structured “council” that forces an LLM to confront a problem from multiple, deliberately contrasting perspectives. By issuing a single, multi‑stage prompt to Claude (or any comparable chat model), the user obtains five distinct advisory outputs, an anonymous peer‑review of those outputs, and a concise synthesis from a designated “chairman.” The methodology hinges on role‑playing: each advisor adopts a fixed mental model (contrarian, first‑principles, expansionist, outsider, executor) and must answer without hedging. After the answers are shuffled and relabeled, the model critiques them blind, surfacing the strongest argument, the biggest blind spot, and any collective omission. Finally, the chairman distills a single recommendation, the core rationale, and an actionable next step.  \n\nBeyond the prompt mechanics, the article contrasts the single‑model pitfall—over‑agreeability and echo‑chamber bias—with the council’s ability to surface failure modes, hidden opportunities, and pragmatic actions. It also outlines a more elaborate multi‑model variant (Karpathy’s open‑source repo) that distributes the advisors across different providers (GPT, Claude, Gemini, Grok) via OpenRouter, but emphasizes that the Claude‑only version already captures the bulk of the benefit without any code.\n\n## 2. Why It Matters  \nIn practice, LLMs are tuned to be helpful and tend to reinforce the user’s framing, which can mask critical flaws in strategy, product design, or decision‑making. The council architecture injects systematic dissent and cross‑validation, turning a passive assistant into a miniature advisory board. This yields three strategic advantages:  \n\n1. **Risk mitigation** – the contrarian surface‑checks failure points that a single model would gloss over.  \n2. **Idea expansion** – the expansionist and outsider lenses surface growth avenues and blind spots that insiders routinely miss.  \n3. **Actionability** – the executor condenses the discussion into a concrete, near‑term deliverable, accelerating execution cycles.  \n\nAdopting this pattern reduces the need for manual “second‑opinion” prompting, shortens iteration loops, and improves the robustness of high‑stakes decisions (e.g., product pivots, hiring plans, pricing strategies). It also democratizes a form of peer review that previously required multiple human experts or a suite of API calls.\n\n## 3. Target Audience  \n- **Product managers & founders** who need rapid, multi‑angle validation before committing resources.  \n- **Data scientists & AI engineers** looking to embed structured prompting into internal tooling without writing extensive code.  \n- **Strategic consultants** who want a repeatable, low‑overhead method for generating balanced recommendations.  \n- **Advanced LLM users** (mid‑level prompt engineers) who already have access to Claude or similar chat interfaces and want to extend their utility.  \n\nThe material assumes familiarity with conversational AI concepts (prompt engineering, model temperature, token limits) but does not require programming expertise for the Claude‑only workflow.\n\n## 4. Key Concepts & Principles  \n\n- **Advisor Role‑Playing**: Each of the five personas is defined by a single guiding question (e.g., “What will fail?”). The model must stay in character, producing a decisive answer without qualifiers. This forces the LLM to explore a narrow, high‑signal line of reasoning.  \n\n- **Anonymous Peer Review**: After generation, the five outputs are relabeled (A‑E) and shuffled. The model then critiques them as a neutral reviewer, identifying the strongest argument, the most glaring omission, and any collective blind spot. This step eliminates bias that would arise from knowing which persona produced each answer.  \n\n- **Chairman Synthesis**: A final “chairman” voice reads the peer‑review and produces a succinct recommendation, a single supporting rationale, and a concrete next action. The output is deliberately limited to ~200 words to keep the decision digestible.  \n\n- **Prompt‑Driven Orchestration**: All three stages are encoded in a single, long prompt. The structure, not the number of distinct models, drives the multi‑stage workflow. The prompt must be fed to the longest‑thinking variant of Claude (e.g., Sonnet 4.5 or Opus) to allow sufficient reasoning depth.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (claude.ai)** – The primary chat interface used to run the entire council in a single conversation. The guide recommends the most capable model variant for maximal token budget.  \n- **OpenRouter** – An aggregation API that provides unified access to multiple LLM providers (GPT, Gemini, Grok, etc.). Required only for Karpathy’s multi‑model implementation.  \n- **Git & uv** – For cloning and managing the Python environment of the open‑source `llm‑council` repository. `uv` is a modern alternative to `pip`/`conda` for dependency isolation.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Strategic Decision Validation (Claude‑Only)  \n1. Open a fresh Claude chat window to avoid context leakage.  \n2. Paste the full council prompt verbatim.  \n3. Replace the placeholder with a concrete decision question, e.g., “Should we pivot our SaaS product to a subscription‑first model?”  \n4. Submit the prompt and wait for the model to output all three stages.  \n5. Read the chairman’s recommendation first; then review each advisor’s reasoning if deeper insight is needed.  \n\n### Use Case 2 – Multi‑Model Council via Karpathy’s Repo  \n1. Obtain an OpenRouter API key from `openrouter.ai`.  \n2. Clone the repository:  \n   ```bash\n   git clone https://github.com/karpathy/llm-council.git\n   cd llm-council\n   ```  \n3. Install dependencies with `uv`:  \n   ```bash\n   uv venv\n   uv pip install -r requirements.txt\n   ```  \n4. Edit `backend/config.py` to select the desired models for each advisor and set the chairman (default: GPT, Claude, Gemini, Grok; Gemini chairs).  \n5. Launch the local server:  \n   ```bash\n   uv run python -m backend.main\n   ```  \n6. Open the React frontend (usually `http://localhost:3000`) and submit your question. The backend will dispatch parallel calls to the configured models, aggregate the responses, perform the anonymous review, and display the chairman’s synthesis.  \n\n## 7. Prerequisites  \n\n- An active Claude account (or equivalent chat model with a long‑context variant).  \n- For the single‑model workflow: no code, just a web browser.  \n- For the multi‑model workflow: basic command‑line proficiency, Git, Python 3.10+, `uv` (or `pip`), and an OpenRouter API key.  \n- Understanding of prompt engineering fundamentals (system messages, role instructions, token budgeting).  \n\n## 8. Recommended Next Resources  \n\n- **Prompt Engineering Playbook** – deeper dive into role‑based prompting and chain‑of‑thought techniques.  \n- **OpenAI Function Calling Guide** – for integrating structured outputs into automated pipelines.  \n- **Karpathy’s “LLM‑Council” GitHub repo** – explore extending the council with custom advisors or integrating with internal tooling.  \n- **“Effective Decision‑Making with LLMs” webinar** – case studies on applying the council to product road‑mapping and risk assessment.  \n\n---  \n\n*All content above is an original analytical synthesis; no verbatim excerpts from the source material have been used.*"}, {"id": "AI-030", "slug": "marketing-skills-complete-setup-guide", "title": "Marketing Skills Complete Setup Guide for Claude Code", "category": "Prompts & Skills", "subcategory": "Marketing & Sales", "difficulty": "Beginner", "description": "Install and configure the complete Briix marketing skills stack, copywriting, social media, email, and ad creative skills wired together into a single marketing workflow inside Claude.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "What Else It Can Do", "Marketing & Sales"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-030_marketing-skills-complete-setup-guide.html", "summary_file": "summaries/AI-030.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-030 - Marketing Skills Complete Setup Guide for Claude Code  \n\n- **Category:** Prompts & Skills | **Subcategory:** Marketing & Sales  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a novice through the end‑to‑end process of turning Claude Code into a turnkey marketing engine. It starts with acquiring a curated collection of “skill” directories from a public GitHub repository, then shows how to embed those assets inside a local project folder that also houses brand‑specific collateral (logos, style guides, tone‑of‑voice documents). Once the folder is prepared, the user launches Claude Code from that directory, enabling the model to auto‑load the skill modules. The final steps verify that the modules are recognized and demonstrate a concrete task—generating a three‑email cold‑outreach sequence that references the brand assets.  \n\nUnderlying the tutorial is a simple architectural pattern: **file‑system‑driven plugin discovery**. Each sub‑folder (e.g., `ad-creative`, `cold-email`, `ai‑seo`) contains prompts, templates, or configuration files that Claude Code reads at runtime. By placing the folder on the local disk and invoking Claude Code from within it, the model treats the collection as a self‑contained knowledge base, eliminating the need for external API calls or manual prompt engineering for each marketing function.  \n\nThe resource also enumerates the breadth of capabilities that become instantly available—ad copy generation, SEO‑optimized content, competitor positioning, A/B test scaffolding, and full‑funnel launch planning—illustrating how a single, lightweight setup can replace a suite of disparate SaaS tools.\n\n## 2. Why It Matters  \nIn modern AI‑augmented marketing, teams often juggle multiple cloud services, each with its own pricing, integration overhead, and learning curve. This guide demonstrates a **cost‑effective, offline‑first alternative** that consolidates a wide range of marketing functions into a single, locally run LLM environment. By leveraging Claude Code’s native ability to ingest file‑based skill definitions, organizations can:  \n\n* **Accelerate prototyping** – generate copy, email sequences, and ad creatives in seconds without waiting for third‑party approvals.  \n* **Maintain brand consistency** – the model directly accesses brand assets, reducing the risk of tone drift that plagues generic AI outputs.  \n* **Control data residency** – all prompts and brand documents stay on the user’s machine, satisfying privacy or compliance constraints.  \n\nThe approach also scales: adding a new skill is as simple as dropping another folder into the project directory, making the system extensible for future marketing initiatives.\n\n## 3. Target Audience  \n- **Junior marketers or founders** who need a quick, no‑code way to produce professional‑grade assets.  \n- **Product managers** looking to prototype launch plans or content calendars without involving a development team.  \n- **Freelance copywriters** who want a reusable, brand‑aware assistant that works offline.  \n- **Small‑to‑medium enterprises (SMEs)** with limited budgets for multiple SaaS subscriptions but access to a workstation capable of running Claude Code.  \n\nThe material assumes basic familiarity with file navigation and command‑line usage, but no prior programming or AI expertise is required.\n\n## 4. Key Concepts & Principles  \n\n- **File‑System Plugin Architecture**: Claude Code scans the current working directory for specially named subfolders, each representing a discrete marketing capability. The presence of these folders automatically registers the associated prompts and templates.  \n- **Brand Asset Injection**: By storing logos, style guides, and tone documents in a dedicated `brand-assets` directory, the model can reference concrete visual and linguistic cues, ensuring outputs align with corporate identity.  \n- **Prompt Contextualization**: Effective results hinge on crafting prompts that explicitly point to the `brand-assets` folder and describe the target audience, channel, and constraints (e.g., word count). This reduces hallucination and improves relevance.  \n- **Iterative Verification**: A two‑step sanity check—first confirming that Claude Code lists the loaded skills, then running a test task—guarantees that the environment is correctly configured before production use.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code**: A locally executable version of Anthropic’s Claude model that can read skill files from the filesystem. It is launched via a terminal command (`claude`) and serves as the central inference engine.  \n- **GitHub (repo by Corey Haines)**: Hosts the open‑source collection of marketing skill folders. Users download the ZIP, extract only the `skills` directory, and integrate it into their project.  \n\n*(The guide also references generic OS utilities such as Terminal on macOS and Command Prompt on Windows for navigation.)*\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid Cold‑Email Campaign Generation  \n1. **Prepare brand assets** – place logo, brand guide, and tone examples in `brand-assets`.  \n2. **Launch Claude Code** from the project root (`cd path/to/project && claude`).  \n3. **Confirm skill loading** by asking Claude to enumerate available modules.  \n4. **Issue a targeted prompt**: request a three‑email sequence for UK small‑business owners unfamiliar with AI automation, specifying length and call‑to‑action.  \n5. **Review output** – ensure the copy references brand language and includes a clear next step.  \n6. **Export** the generated emails to a CSV or directly paste into an email platform.  \n\n### Use Case 2 – End‑to‑End Content Strategy & SEO Production  \n1. **Populate `brand-assets`** with existing blog posts, keyword lists, and SEO guidelines.  \n2. **Run the `content-strategy` skill** by prompting Claude to devise a 90‑day editorial calendar for LinkedIn, blog, and newsletter.  \n3. **Iterate**: ask Claude to flesh out each topic into an SEO‑optimized outline using the `ai‑seo` skill.  \n4. **Generate full articles** by feeding the outlines back into Claude, requesting a specific word count and meta description.  \n5. **Export** the finished copy to a content management system (CMS) or markdown files for later publishing.  \n\nBoth workflows emphasize **context‑rich prompting** and **file‑based skill activation**, allowing marketers to stay within a single interface throughout the creative process.\n\n## 7. Prerequisites  \n\n- A workstation (macOS, Windows, or Linux) with internet access to download the GitHub repository.  \n- Claude Code installed and added to the system PATH so it can be invoked via the `claude` command.  \n- Basic command‑line proficiency: navigating directories (`cd`), extracting ZIP archives, and launching terminal applications.  \n- Optional but recommended: a folder containing brand assets (logo, style guide, tone‑of‑voice documentation) to maximize output relevance.\n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – deep‑dive into structuring multi‑turn prompts for higher fidelity.  \n- **Git‑Based Skill Management** – tutorials on version‑controlling your skill folders and sharing them across teams.  \n- **AI‑Driven A/B Test Design** – explore the `ab-test-setup` skill in detail, including statistical considerations.  \n- **Integrating Claude Outputs with Automation Platforms** – guides for feeding generated copy into tools like Zapier, HubSpot, or Mailchimp via API or CSV import.  \n- **Data Privacy Best Practices for Local LLMs** – ensure compliance when handling sensitive brand assets on‑premises."}, {"id": "AI-031", "slug": "13-ways-to-stop-your-ai-designs-looking-like-slop", "title": "13 Ways to Stop Your AI Designs Looking Like Slop", "category": "Prompts & Skills", "subcategory": "Custom Skills", "difficulty": "Beginner", "description": "Thirteen specific techniques to make AI-generated designs look intentional and professional. Covers prompting, post-processing, skill configuration, and the visual tells that expose generic AI output.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Prompts & Skills", "1, Efford, efford.co", "2, Newform", "3, SuperDesign", "Tips 4 5", "4, Install a UI Design Skill", "Custom Skills"], "ai_tools": ["Claude Code", "Claude Projects", "Claude", "Cursor", "Canva"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-031_13-ways-to-stop-your-ai-designs-looking-like-slop.html", "summary_file": "summaries/AI-031.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-031 – 13 Ways to Stop Your AI Designs Looking Like Slop  \n\n- **Category:** Prompts & Skills | **Subcategory:** Custom Skills  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide walks readers through a systematic approach for turning raw AI‑generated UI output into polished, production‑ready designs. It emphasizes the importance of anchoring every prompt to a concrete visual reference—whether a live site, a component library, or a design‑system file—so the model can copy proven patterns instead of hallucinating generic layouts.  \n\nBeyond reference selection, the article introduces a set of “design skills” and Model‑Component‑Providers (MCPs) that extend Claude’s native knowledge base with real‑world token sets, spacing rules, and reusable components. By installing these assets, the AI gains deterministic behavior for typography, colour palettes, and interactive elements.  \n\nFinally, the material presents a series of prompt‑crafting tactics: replace vague adjectives with explicit CSS‑like specifications, embed negative constraints (e.g., “no drop shadows”), and adopt a two‑stage workflow where Claude first critiques a draft before you iterate. The cumulative effect is a repeatable, low‑friction pipeline that yields UI mockups that look intentionally designed rather than AI‑generated filler.  \n\n## 2. Why It Matters  \nIn modern product development, speed is often measured in how quickly a visual concept can be turned into a clickable prototype. Relying on generic AI output wastes time because designers must repeatedly clean up sloppy spacing, inconsistent colour usage, and placeholder graphics. By feeding the model a concrete reference and a well‑defined design system, teams can cut iteration cycles dramatically, freeing senior designers to focus on higher‑level problems instead of low‑level polishing.  \n\nMoreover, the approach aligns AI‑assisted design with established design‑ops practices: version‑controlled design tokens, reusable component libraries, and explicit style guides. This makes the AI a compliant member of the design pipeline, reducing the risk of brand drift and ensuring that every generated screen adheres to the same visual language. The result is higher throughput, lower rework cost, and a more professional output that can be shipped directly to developers or handed off to tools like Canva without additional styling.  \n\n## 3. Target Audience  \n- **Product designers** who are experimenting with AI‑assisted mockups but lack a systematic way to keep outputs on‑brand.  \n- **Front‑end engineers** looking for rapid prototyping tools that produce clean, reusable code snippets.  \n- **UX researchers** who need quick visual variations for user testing without spending hours on manual design.  \n- **Small‑team founders or solo creators** who want to generate marketing assets (e‑books, guides) at scale while preserving a consistent visual identity.  \n\nAll of these personas benefit from a beginner‑friendly, reference‑driven workflow that does not require deep knowledge of AI internals.  \n\n## 4. Key Concepts & Principles  \n\n- **Reference‑First Prompting**: Attach a live design example, a component file, or a design‑system markdown before describing the desired outcome. The model then treats the reference as a concrete target rather than an abstract idea.  \n\n- **Design Skill Packages**: A folder containing a `SKILL.md` (or `CLAUDE.md`) that encodes tokens, spacing scales, typography pairings, and component definitions. Loading this package gives Claude a deterministic design vocabulary for the entire session.  \n\n- **Model‑Component‑Providers (MCPs)**: External services (e.g., Google Stitch, Nano Banana 2, 21st.dev) that expose curated UI patterns and animated assets via API. Adding an MCP lets Claude fetch ready‑made components instead of fabricating them from memory.  \n\n- **Specification Over Description**: Replace subjective adjectives (“clean”, “modern”) with measurable properties (hex colour, pixel size, border‑radius). Precise specifications dramatically improve fidelity and reduce the need for post‑generation cleanup.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Claude.ai / Claude Code)** – The primary LLM used for generating UI code and design assets. It can ingest design‑skill files and interact with MCPs.  \n- **Efford (efford.co)** – A curated library of real‑world UI screenshots and associated prompts/code snippets that serve as instant visual references.  \n- **Newform** – A free repository of UI component definitions that can be saved as a Claude skill file or a `design.md` reference.  \n- **SuperDesign** – A visual style browser that outputs ready‑to‑paste prompts for whole pages or specific sections.  \n- **Google Stitch & Nano Banana 2 (MCPs)** – Command‑line‑installable providers that enrich Claude’s component knowledge base.  \n- **21st.dev** – An API‑driven component marketplace offering 3D, animated, and reactive UI pieces.  \n- **Canva Native Connector** – An integration that lets Claude create and edit Canva documents directly, streamlining the production of digital assets.  \n- **Claude Projects** – A workspace feature where you can store persistent design standards (palette, typography, constraints) that automatically apply to every conversation within the project.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid Landing‑Page Mockup with Brand Consistency  \n1. **Gather a reference**: Open `efford.co`, locate a landing page that matches your brand vibe, and copy the provided prompt.  \n2. **Load the design skill**: Download the “UI UX Pro Max” skill from GitHub, zip it, and upload via Claude Settings → Capabilities → Skills.  \n3. **Add MCPs**: Run `claude mcp add google-stitch` and `claude mcp add nano-banana-2` in your terminal, then verify with `claude mcp list`.  \n4. **Compose the prompt**: Paste the reference prompt, then append a precise specification block (e.g., “hero background #0D1117, headline 64 px, teal pill‑shaped CTA”).  \n5. **Generate**: Submit to Claude Code; the model will output HTML/CSS that follows the reference, uses the loaded design tokens, and pulls components from the MCPs.  \n6. **Validate**: Use Claude Projects to store your brand palette and spacing rules, ensuring any subsequent tweaks inherit the same standards.  \n\n### Use Case 2 – Automated E‑Book Layout in Canva  \n1. **Enable the Canva connector**: In Claude’s settings, toggle the Canva integration on.  \n2. **Create content**: Ask Claude to write a 10‑page guide for “remote‑team productivity” with a defined tone and bullet‑point structure.  \n3. **Structure for design**: Prompt Claude to split the output into pages, each containing a title, a short paragraph, and up to five bullets.  \n4. **Push to Canva**: Issue a command like “Create a new Canva document with these pages, using my brand palette stored in the project.” Claude will populate the Canva file directly.  \n5. **Iterate**: If any page looks off, ask Claude to critique that page (“What would a senior designer change about page 3?”) and then re‑prompt with the suggested adjustments.  \n\n## 7. Prerequisites  \n\n- A Claude account with access to Claude Code and Projects.  \n- Basic familiarity with command‑line operations to install MCPs (`claude mcp add …`).  \n- API key for 21st.dev (free tier registration).  \n- Optional: GitHub account to download the UI UX Pro Max skill package.  \n- Internet access to browse reference sites (Efford, Newform, SuperDesign).  \n\n## 8. Recommended Next Resources  \n\n- **“Design Systems for AI‑Generated UI”** – Deep dive into building custom token libraries and component catalogs that can be consumed by Claude.  \n- **“Advanced Prompt Engineering for Visual Tasks”** – Techniques for chaining prompts, using few‑shot examples, and controlling temperature for more deterministic outputs.  \n- **“Integrating Claude with Front‑End Build Pipelines”** – Guide on automating Claude‑generated code into CI/CD workflows (e.g., using GitHub Actions).  \n- **“Canva API Automation”** – Extends the native connector concept to programmatic batch updates across multiple design assets.  \n\n---  \n\n*Apply at least three of the listed tactics to your current project today, and you’ll notice a measurable lift in visual quality and a reduction in manual cleanup time.*"}, {"id": "AI-032", "slug": "the-startup-stack", "title": "The Startup Stack", "category": "Building & Monetising", "subcategory": "Startup & Products", "difficulty": "Beginner", "description": "The full toolstack for building a software startup with Claude, from idea validation through build, launch, and early growth. Every tool, every integration, and the order to set them up.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "01, Claude", "02, Cookiy", "03, Figma", "04, Claude Code", "05, N8N", "Startup & Products"], "ai_tools": ["Claude Code", "Claude", "n8n", "Figma"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-032_the-startup-stack.html", "summary_file": "summaries/AI-032.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-032 – The Startup Stack  \n\n- **Category:** Building & Monetising | **Subcategory:** Startup & Products  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide walks a founder through a tightly‑coupled five‑tool pipeline that covers the entire product lifecycle—from ideation to continuous operation. It explains how to treat a conversational AI (Claude) as a strategic “brain,” augment it with a built‑in interview skill (Cookiy) for rapid user validation, translate validated concepts into visual mock‑ups with Figma, hand those mock‑ups to an AI‑driven code generator (Claude Code), and finally stitch everything together with an open‑source workflow engine (n8n) that automates repetitive tasks.  \n\nBeyond listing the tools, the article demonstrates how to feed context continuously, preserve “memory” across sessions, and iterate in short feedback loops. By the end of the tutorial, a solo founder should be able to produce a market‑ready MVP without hiring a separate design, research, or engineering team, while keeping the process reproducible and auditable.\n\n## 2. Why It Matters  \nTraditional startup pipelines require distinct specialists, each adding hand‑off friction and cost. Consolidating strategy, validation, design, implementation, and automation into a single, AI‑augmented workflow compresses timelines from months to weeks and reduces cash burn dramatically. The stack also democratizes access to high‑quality user research (via Cookiy) and production‑grade code (via Claude Code), which were previously gated behind expensive agencies or senior developers. Moreover, because n8n is self‑hostable, founders retain full data sovereignty and avoid per‑execution fees that can explode at scale. The net effect is a lean, repeatable engine for hypothesis‑driven product development.\n\n## 3. Target Audience  \n- **First‑time founders** who need a low‑cost, end‑to‑end prototype pipeline.  \n- **Solo technical founders** looking to offload routine coding and automation.  \n- **Product managers** in early‑stage teams who must validate ideas quickly.  \n- **Design‑savvy entrepreneurs** who can sketch wireframes but lack development resources.  \n- **Bootstrapped startups** that cannot afford external research agencies or dev contractors.\n\n## 4. Key Concepts & Principles  \n\n- **Context‑Driven Prompting**: Supplying the AI with rich background (project briefs, prior chats, design assets) before each interaction dramatically improves relevance and reduces the need for corrective iterations.  \n- **Iterative Validation Loop**: Conduct a minimal‑cost user interview before any code is written, then repeat the interview after each major design change to keep the product aligned with real needs.  \n- **Component‑First Design**: Building reusable UI primitives in Figma (buttons, cards, inputs) creates a single source of truth that can be directly referenced by Claude Code, ensuring visual‑to‑code fidelity.  \n- **Automation‑First Mindset**: Identify the most repetitive weekly task (e.g., syncing interview insights to a project board) and automate it first in n8n; expand gradually to avoid workflow sprawl.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (LLM)** – Serves as the strategic advisor; used for risk analysis, roadmap brainstorming, and as a central hub for feeding context to downstream tools.  \n- **Cookiy (Claude skill)** – Automates recruitment and interview of target users, delivering video, transcript, and sentiment analysis directly inside Claude.  \n- **Figma** – Industry‑standard UI/UX design platform; leveraged for low‑fidelity wireframes and high‑fidelity component libraries that become inputs for code generation.  \n- **Claude Code** – Code‑generation extension that consumes Figma assets and natural‑language specifications to emit production‑ready front‑end snippets; also acts as a debugging assistant.  \n- **n8n** – Open‑source workflow orchestrator; connects APIs of the above tools (Claude, Cookiy, Figma, Notion, Slack, etc.) to automate data movement and trigger AI actions on schedule or event.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid MVP from Idea to Deployable Front‑End  \n1. **Strategic Brief** – Open Claude, upload a one‑page project brief, and ask it to list top risks and target personas.  \n2. **User Validation** – Invoke the `/cookiy` command, specify demographic filters (e.g., “30‑45 yr, SaaS product managers, US”), and schedule a 15‑minute interview batch.  \n3. **Insight Synthesis** – Once recordings arrive, let Claude summarize key pain points and rank feature ideas.  \n4. **Design** – In Figma, create a wireframe reflecting the top‑ranked features; convert UI elements into components.  \n5. **Code Generation** – Feed the Figma file URL and a precise functional description to Claude Code (e.g., “Create a responsive card component that fetches data from `/api/insights` and displays a headline, subtitle, and CTA”).  \n6. **Review & Iterate** – Examine the generated code, run a quick local test, and ask Claude Code to fix any lint errors or adjust styling.  \n7. **Automation** – Set up an n8n workflow that triggers on new Cookiy interview results, runs a Claude summarization node, and posts the distilled insights to a Slack channel and a Notion page.  \n\n### Use Case 2 – Continuous Feedback Loop for Feature Expansion  \n1. **Feature Hypothesis** – Use Claude to draft a hypothesis statement (“Adding a dark‑mode toggle will increase weekly active users by 5 %”).  \n2. **Targeted Interviews** – Run a Cookiy interview targeting existing users who have expressed UI preferences.  \n3. **Data Normalization** – n8n pulls the transcript, runs a Claude node to extract sentiment scores, and writes them to an Airtable base.  \n4. **Design Update** – Update the Figma component library with a dark‑mode variant; version the file.  \n5. **Code Refresh** – Prompt Claude Code with the new component version and ask it to generate CSS variables and a toggle handler.  \n6. **Deploy & Monitor** – Push the changes to a staging environment; use n8n to schedule daily health checks and send alerts to Slack if error rates rise.  \n\n## 7. Prerequisites  \n\n- An active Claude account with access to custom skills.  \n- Basic familiarity with Figma (ability to create frames, components, and export URLs).  \n- API keys for Claude, Cookiy (if separate), and n8n (self‑hosted instance or cloud).  \n- Minimal command‑line knowledge to spin up n8n (Docker command: `docker run -p 5678:5678 n8nio/n8n`).  \n- A code editor for reviewing Claude Code output (VS Code recommended).  \n\n## 8. Recommended Next Resources  \n\n- **Prompt Engineering for LLMs** – Deep dive into crafting high‑precision prompts that reduce hallucination.  \n- **n8n Advanced Workflow Patterns** – Courses covering conditional branching, error handling, and custom node development.  \n- **Design Systems in Figma** – Guides on building scalable component libraries and exporting design tokens.  \n- **AI‑Assisted Debugging** – Tutorials on using Claude (or similar models) to diagnose runtime errors and generate test suites.  \n- **Data Privacy for Self‑Hosted Automation** – Best practices for securing user interview data when running n8n on-premises."}, {"id": "AI-033", "slug": "ai-print-on-demand-setup-guide", "title": "AI Print-On-Demand Setup Guide", "category": "Building & Monetising", "subcategory": "Monetisation Strategy", "difficulty": "Beginner", "description": "Build a print-on-demand business with Claude handling design generation, listing copy, and product research. Full setup from Printful or Printify through to live product listings.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "How It Works, The Full Picture", "Step 01, Pick Your Niche", "Monetisation Strategy"], "ai_tools": ["Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-033_ai-print-on-demand-setup-guide.html", "summary_file": "summaries/AI-033.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-033 - AI Print‑On‑Demand Setup Guide  \n\n- **Category:** Building & Monetising | **Subcategory:** Monetisation Strategy  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a newcomer through the end‑to‑end pipeline for launching a print‑on‑demand (POD) storefront that leverages generative AI for design creation. It breaks the process into three logical layers: market selection, creative production, and automated fulfillment. The learner discovers how to identify a narrowly defined consumer segment, harvest visual and textual cues from top‑selling items on a major marketplace, and then translate those cues into a ready‑to‑print graphic using Claude’s design‑generation interface.  \n\nThe technical backbone rests on two free services—Printify for on‑demand manufacturing and Etsy as the sales channel. Once the design is uploaded to Printify and the store is linked, the system automatically routes orders from Etsy to the nearest Printify printer, which handles production, packaging, and direct shipping. The only manual interventions are the initial niche research, the AI prompt crafting, and the price‑setting step.  \n\n## 2. Why It Matters  \nTraditional e‑commerce requires inventory capital, logistics coordination, and design expertise, creating high entry barriers. By substituting physical stock with a POD model and outsourcing creative work to a large‑language‑model‑driven image generator, the approach reduces upfront costs to zero and compresses the time‑to‑revenue to under an hour. This efficiency aligns with the broader trend of “AI‑first” side‑hustles, where rapid iteration and low‑risk testing dominate. Moreover, the workflow is fully scalable: once a niche‑design‑listing pipeline is codified, dozens of variations can be spun out with minimal incremental effort, enabling a portfolio of micro‑brands that collectively generate passive income.  \n\n## 3. Target Audience  \n- **Aspiring solopreneurs** who want a low‑cost entry into e‑commerce without handling inventory.  \n- **Creative freelancers** seeking to monetize visual concepts without relying on client contracts.  \n- **Marketers or brand managers** looking for a quick‑launch channel to test product‑market fit for niche audiences.  \n- **Beginner‑level AI enthusiasts** who have basic familiarity with web tools but no deep programming background.  \n\n## 4. Key Concepts & Principles  \n\n- **Niche Granularity** – Focusing on a tightly defined audience (e.g., “van‑life travelers” rather than generic “travel”) improves relevance, reduces competition, and yields clearer design cues.  \n- **Competitive Reference Mining** – Analyzing best‑selling listings on a marketplace provides empirical data on popular motifs, phrasing, and color schemes, which serve as a blueprint for AI‑generated artwork.  \n- **Prompt Engineering for Visual AI** – Supplying concise, attribute‑rich instructions (style, palette, target demographic) to Claude’s design engine maximizes the likelihood of a market‑ready graphic within seconds.  \n- **Automated Fulfillment Loop** – Connecting a POD provider (Printify) to a sales platform (Etsy) creates a closed‑loop where order capture, production, and shipping occur without manual handling, allowing the creator to focus solely on ideation and marketing.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Design (claude.ai/design)** – A generative AI interface that accepts textual prompts and returns ready‑to‑use graphics. It is used for rapid prototyping of niche‑specific artwork.  \n- **Printify (printify.com)** – A free‑to‑join POD service that offers a catalog of printable products, integrates with major marketplaces, and manages manufacturing and logistics on demand.  \n- **Etsy (etsy.com)** – A high‑traffic marketplace that provides immediate access to a large buyer base; it also supports direct integration with Printify for seamless order fulfillment.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Launching a “Gym Meme” T‑Shirt Line  \n1. **Define the micro‑niche** – Target gym‑goers who enjoy humor (“gym memes”).  \n2. **Research winning designs** – Search Etsy for “gym meme t‑shirt”, sort by best‑selling, note recurring slogans (“No Pain No Gain”) and illustration styles (bold typography, high‑contrast colors).  \n3. **Craft the AI prompt** – Example: “Create a bold graphic for a gym‑themed tee, dark background, neon green accents, include the phrase ‘No Days Off’ in a modern street‑wear font.”  \n4. **Generate and download** – Use Claude Design, iterate if needed, then export the PNG at 300 dpi.  \n5. **Upload to Printify** – Choose a premium‑fit tee, place the graphic, adjust sizing, and save the mock‑up.  \n6. **Connect to Etsy** – In Printify’s dashboard, add the Etsy sales channel, authorize the store, and sync the product.  \n7. **Publish the listing** – Set a competitive price (cost + desired margin), write SEO‑rich title and description, and activate the listing.  \n8. **Monitor sales** – When an order arrives, Printify automatically prints, packs, and ships; the creator receives the profit margin.  \n\n### Use Case 2 – Creating a “Van‑Life Travel Mug” Collection  \n1. **Select niche** – Focus on digital nomads who live in vans.  \n2. **Extract market cues** – On Etsy, search “van life mug”, filter by top sellers, capture common motifs (mountain silhouettes, retro color palettes) and popular tag lines (“Home is wherever we park”).  \n3. **Prompt Claude** – “Design a 11 oz travel mug graphic for van‑life enthusiasts, featuring a minimalist mountain outline, pastel teal background, and the phrase ‘Home is wherever we park’ in hand‑drawn script.”  \n4. **Generate artwork** – Run the prompt, refine until the composition fits the mug’s printable area.  \n5. **Printify workflow** – Choose a ceramic travel mug, upload the design, preview the wrap‑around view, and confirm.  \n6. **Etsy integration** – Link the Printify account, push the mug product to Etsy, and configure shipping profiles.  \n7. **Launch** – Publish with targeted keywords (“van life travel mug”, “digital nomad coffee cup”), set price, and promote via niche forums or Instagram.  \n8. **Scale** – Duplicate the process for related accessories (stickers, tote bags) using the same design assets.  \n\n## 7. Prerequisites  \n\n- A functional internet connection and a modern web browser.  \n- Free accounts on Claude Design, Printify, and Etsy (each requires email verification).  \n- Basic graphic‑design literacy to evaluate AI outputs (understanding of resolution, color mode, and printable dimensions).  \n- Optional: a simple spreadsheet or note‑taking app to track niche ideas, keyword research, and pricing calculations.  \n\n## 8. Recommended Next Resources  \n\n- **Advanced Prompt Engineering** – Guides on structuring multi‑modal prompts for higher fidelity outputs (e.g., “Prompt Engineering for Visual AI”).  \n- **Etsy SEO Deep Dive** – Tutorials on keyword research, tag optimization, and conversion‑focused product descriptions to boost discoverability.  \n- **Printify Product Catalog Mastery** – Documentation on selecting high‑margin items, understanding base costs, and customizing fulfillment settings.  \n- **Automation with Zapier or Make** – Integrations that can auto‑post new listings to social media, sync order data to accounting tools, or trigger email marketing sequences.  \n- **Scaling Strategies for POD Portfolios** – Case studies on managing dozens of niche stores, cross‑selling, and brand clustering for diversified revenue streams."}, {"id": "AI-034", "slug": "from-zero-to-warm-inbound-how-to-get-clients-with-ai-skills", "title": "From Zero to Warm Inbound: How to Get Clients With AI Skills", "category": "Building & Monetising", "subcategory": "Agency & Client Acquisition", "difficulty": "Beginner", "description": "Free work. Outreach. Social media. The exact path from your first unpaid AI project to a point where clients come to you, with no cold outreach required. Includes scripts, pricing ladders, and a 12-month roadmap.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "Work for Free First", "How to Choose Who to Work For", "How to Ask for the Testimonial", "The Finders Fee Offer", "Raising Your Prices as You Grow", "Agency & Client Acquisition"], "ai_tools": ["Claude", "Apollo"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-034_from-zero-to-warm-inbound-how-to-get-clients-with-ai-skills.html", "summary_file": "summaries/AI-034.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-034 – From Zero to Warm Inbound: How to Get Clients With AI Skills  \n\n- **Category:** Building & Monetising | **Subcategory:** Agency & Client Acquisition  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide outlines a repeatable acquisition engine for solo AI consultants, moving from an initial “free‑work” phase to a self‑sustaining inbound pipeline. It breaks the journey into three interlocking “engines”: (1) delivering unpaid projects that generate real‑world experience, testimonial proof, and reusable content; (2) leveraging those early clients for referral commissions (the “finder’s fee” model); and (3) building a disciplined social‑media presence that turns passive viewers into warm leads.  \n\nOperationally, the material teaches how to select target niches, craft outreach scripts that embed proof points, price‑scale as credibility accumulates, and execute a weekly content cadence (2‑2‑1 structure) that repurposes high‑performing short‑form videos. The roadmap is time‑boxed into a 12‑month plan, showing when to transition from pure outreach to inbound, when to raise rates, and when to introduce ancillary revenue streams such as digital products or sponsorships.  \n\nUnderlying the tactics is a systems‑thinking architecture: each free project feeds testimonial assets, which feed outreach copy, which fuels social posts, which in turn amplify inbound demand—creating a self‑reinforcing flywheel.\n\n## 2. Why It Matters  \nIn the crowded AI freelance market, technical skill alone rarely translates into paying work. This framework converts *experience* into *social proof* and *content* that can be scaled without additional human effort. By front‑loading free engagements, a practitioner accelerates the learning curve, avoids costly trial‑and‑error, and builds a portfolio that resonates with the exact buyer persona they intend to serve.  \n\nThe referral‑fee mechanism turns satisfied clients into low‑cost sales agents, dramatically improving conversion rates compared with blind cold outreach. Meanwhile, a systematic content strategy leverages platform algorithms (TikTok, Instagram Reels, LinkedIn, YouTube) to generate perpetual lead flow, reducing the marginal cost of acquisition over time. For anyone looking to monetize AI expertise sustainably, the model delivers a measurable ROI by aligning effort (daily outreach, weekly posts) with predictable revenue milestones.\n\n## 3. Target Audience  \n- **Emerging AI freelancers** who have technical chops but lack a client base.  \n- **Solo agency founders** seeking a low‑budget, high‑velocity go‑to‑market plan.  \n- **Technical consultants** transitioning from project‑based work to productized services.  \n- **Career‑switchers** (e.g., developers, data scientists) who want to monetize AI skills quickly.  \n- **Anyone with basic familiarity with LinkedIn, email, and short‑form video platforms** and who can allocate ~1‑2 hours daily to outreach and content creation.\n\n## 4. Key Concepts & Principles  \n\n- **Free‑Work Leverage** – Treat the first 3‑5 unpaid projects as an investment: they provide hands‑on problem solving, authentic testimonials, and a library of before‑after case studies that can be sliced into outreach copy and social posts.  \n\n- **Referral Finder’s Fee** – After delivering value, ask the client to introduce you to similar businesses in exchange for a percentage (e.g., 10 %) of the new contract. This creates a performance‑based incentive for the client to act as a sales partner.  \n\n- **Price‑Scaling Curve** – Align pricing tiers with proof depth:  \n  1. **Stage 1 (Free/Low‑Cost)** – Acquire experience.  \n  2. **Stage 2 (£250‑£500)** – Early paid work, still proof‑heavy.  \n  3. **Stage 3 (£1k‑£3k)** – Niche‑specific case studies, faster delivery.  \n  4. **Stage 4 (Premium)** – Established ROI, justified high fees.  \n\n- **Content Flywheel (2‑2‑1 Weekly Rhythm)** – Publish five pieces per week: two “viral‑style” repurposed videos, two testimonial breakdowns, and one educational tutorial. Consistency fuels algorithmic favor, while varied formats keep the audience engaged and provide multiple proof points.  \n\n- **Specificity Over Generality** – Target a narrow vertical (e.g., dental practices, roofing firms) so that each testimonial and piece of content speaks directly to the next prospect’s pain points, dramatically increasing conversion odds.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic LLM)** – Used to generate personalized outreach openers, script rewrites, and to help re‑frame viral video structures into original content. Example prompt: “Write a 30‑second TikTok hook about automating lead capture for a local plumber, using the structure of this top‑performing video.”  \n\n- **Apollo.io** – Provides bulk email list extraction and enrichment for targeted outreach campaigns. Typical workflow: export a CSV of prospects filtered by industry, then feed the list into a mail‑merge tool for daily 20‑30 message blasts.  \n\n*(Other platforms such as LinkedIn, Instagram, TikTok, YouTube, and Google Maps are leveraged for prospect discovery and content distribution, but they are not proprietary tools.)*\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Building the First Three Paid Projects  \n1. **Identify Target Niche** – Use LinkedIn keyword search (`site:linkedin.com/in \"dentist\"`), filter for active practices with ≥10 reviews.  \n2. **Outreach** – Send 25 personalized messages per day via Apollo.io, embedding a short case‑study snippet (e.g., “Recovered £4k in missed jobs for a local plumber”).  \n3. **Deliver Free Solution** – Deploy a simple AI‑driven lead‑capture bot (e.g., using Zapier + OpenAI) for the client.  \n4. **Collect Testimonial** – After 2 weeks, request a 60‑second video focusing on concrete metrics (“30 % more enquiries captured”).  \n5. **Create Content** – Turn the before‑after data into a TikTok Reel (hook: “How this dentist stopped losing £2k/month”). Repurpose the same script for a LinkedIn carousel and a short YouTube Shorts.  \n\n### Use Case 2 – Referral Finder’s Fee Engine  \n1. **Close the Free Project** – Ensure the client sees measurable ROI.  \n2. **Pitch Referral Deal** – Email: “If you know another practice that could benefit, I’ll give you 10 % of the contract value as a thank‑you.”  \n3. **Provide a Referral Template** – Supply a one‑sentence blurb the client can forward (“Hey, I worked with Max on an AI lead‑capture system that saved us £3k/month; you might be interested”).  \n4. **Track Referrals** – Use a simple Google Sheet with columns: Referrer, Prospect, Date, Contract Value, Fee Paid.  \n5. **Pay Out** – When the new contract signs, issue a PayPal or Stripe transfer of the agreed percentage.  \n\n## 7. Prerequisites  \n\n- Basic proficiency with AI APIs (OpenAI, Anthropic) and automation tools (Zapier, Make).  \n- Access to a professional email account and a LinkedIn profile.  \n- Ability to record short video testimonials (smartphone + basic lighting).  \n- Familiarity with CSV handling for prospect lists (Excel/Google Sheets).  \n- A minimum of 1 hour per day to allocate to outreach and 1 hour for content creation.  \n\n## 8. Recommended Next Resources  \n\n- **“AI Prompt Engineering for Business Automation”** – deep dive into building reusable prompts for lead‑capture bots.  \n- **“Growth Hacking with Short‑Form Video”** – tactics for scaling TikTok/Instagram reach beyond the first 10 k followers.  \n- **“Advanced Referral Marketing Playbooks”** – structures for multi‑tier referral programs and automated tracking.  \n- **“Pricing Strategies for Knowledge‑Based Services”** – frameworks for value‑based pricing and contract negotiation.  \n- **“Building a Digital Product Funnel”** – step‑by‑step guide to turning a testimonial library into a sellable course or template pack."}, {"id": "AI-035", "slug": "the-3-business-processes-you-can-automate-this-week", "title": "The 3 Business Processes You Can Automate This Week", "category": "Building & Monetising", "subcategory": "Business Automation", "difficulty": "Beginner", "description": "Lead follow-up, meeting summaries, and weekly reporting, three complete automation walkthroughs you can have running by Friday. Full build steps, variations, and 11 15 hours back every week.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "Intro", "Who this is for", "Before You Start: One-Time Setup", "Automation 01: Lead Follow-Up", "The problem", "What we're building", "Business Automation"], "ai_tools": ["Claude Code", "Claude Desktop", "Claude", "n8n", "Zapier", "PostHog"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-035_the-3-business-processes-you-can-automate-this-week.html", "summary_file": "summaries/AI-035.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-035 - The 3 Business Processes You Can Automate This Week\n\n- **Category:** Building & Monetising | **Subcategory:** Business Automation\n- **Difficulty:** Beginner\n- **Local Asset:** N/A (Web Only)\n- **Status:** WEB_ONLY\n\n## 1. What This Resource Teaches\nThis resource provides a practical, step-by-step framework for implementing three high-impact business automations using the Claude ecosystem, specifically leveraging Claude Code for scheduled tasks and Claude Desktop for interface management. The core educational objective is to shift users from manual, reactive workflows to proactive, automated systems that reclaim 11–15 hours per week. It focuses on three specific operational processes: automated lead follow-up via Gmail, structured meeting summaries with action items, and automated weekly executive reporting.\n\nThe technical mechanics rely heavily on the concept of \"Skills\" and \"Scheduled Tasks\" within Claude Code. Instead of writing complex Python scripts or paying for third-party iPaaS (Integration Platform as a Service) subscriptions like Zapier or Make, the guide teaches users to define agent behavior through Markdown-based configuration files (`SKILL.md`). These files instruct the AI agent on how to interact with connected APIs (specifically Google Workspace) to perform specific actions, such as filtering emails, drafting responses, and staging them in drafts. The architecture emphasizes a strict \"human-in-the-loop\" model where the AI prepares the work, but the user retains final approval authority before any communication is dispatched.\n\n## 2. Why It Matters\nThe strategic value of this resource lies in lowering the barrier to entry for AI-driven business automation. Traditionally, implementing reliable, low-latency automations required significant software engineering expertise or brittle multi-step webhook architectures. By utilizing native Claude capabilities (scheduled tasks, memory, and connectors), businesses can achieve equivalent outcomes with near-zero software overhead and granular control over prompt behaviors.\n\nFrom an efficiency standpoint, the guide targets the critical \"speed-to-lead\" metric, which is a primary determinant of conversion rates in professional services and agencies. By automating the initial intake analysis and response drafting within an hour of submission, businesses dramatically improve their conversion pipeline. Furthermore, the resource highlights the compounding leverage of routine automation: removing low-cognitive-load administrative tasks frees founders and operators to focus on strategic execution and client delivery.\n\n## 3. Target Audience\n- **Solo Entrepreneurs & Freelancers:** Individuals wearing multiple hats (sales, operations, client management) who need to eliminate administrative drag and reclaim 10+ billable hours every week.\n- **Small Business Owners & Agency Operators:** Teams without dedicated in-house software engineers who seek automated pipeline management without costly enterprise software contracts.\n- **Technical Non-Developers & Operations Leads:** Practitioners comfortable navigating basic terminal environments and editing Markdown configuration files.\n- **AI Practitioners & Power Users:** Users transitioning from ad-hoc web chat interactions into autonomous, scheduled agentic pipelines.\n\n## 4. Key Concepts & Principles\n- **Agentic Scheduled Tasks**: The principle of configuring an AI agent to execute specific background routines at defined intervals (e.g., hourly or daily) without requiring manual human prompting.\n- **Markdown-Defined Skills (`SKILL.md`)**: The architectural pattern of using structured Markdown files to define an agent's persona, operating constraints, tool permissions, and step-by-step logic.\n- **Human-in-the-Loop (HITL) Safety Guardrails**: A design pattern where the AI executes data aggregation, classification, and drafting, but halts before irreversible actions (such as sending emails or modifying databases), ensuring complete accountability.\n- **Native Connector Architecture**: Leveraging standardized OAuth connectors (such as Google Workspace) to give Claude scoped, secure access to inboxes and documents without managing raw API keys.\n\n## 5. Tools & Technologies Mentioned\n- **Claude Code**: Terminal-based agentic CLI used to schedule and execute local background routines.\n- **Claude Desktop & Web**: Interactive environments used to test prompts, review drafts, and manage Project memory.\n- **Google Workspace (Gmail, Docs, Sheets)**: Core communication and data storage backends connected via native OAuth connectors.\n- **Zapier / n8n**: Referenced as legacy automation alternatives compared against native agentic routines.\n\n## 6. Practical Use Cases & Workflows\n- **Inbound Lead Intake & Response Staging**: Claude scans inbound inquiries in Gmail hourly, extracts contact details and intent, drafts tailored personalized responses into Gmail drafts, and alerts the operator for one-click review.\n- **Meeting Synthesis & Task Extraction**: At the end of every call, transcripts are deposited into a dedicated folder; Claude extracts key agreements, decisions, and action items with deadlines, formatting them into an executive recap.\n- **Friday Executive KPI Digest**: A scheduled Friday afternoon routine pulls weekly metrics, summarizes wins and blockers, and generates a structured digest for stakeholder review.\n\n## 7. Prerequisites\n- Active Anthropic Claude account (Pro, Team, or Max tier recommended for full connector and Project access).\n- Claude Code CLI installed and authenticated on the local workstation.\n- Google Workspace account with OAuth permissions enabled for Claude connectors.\n- Basic familiarity with text editing and command-line execution.\n\n## 8. Recommended Next Resources\n- **AI-007**: Claude Routines Setup Guide\n- **AI-062**: 10 AI Automations That Run Your Week\n- **AI-065**: 15 Claude Routines To Automate Your Business"}, {"id": "AI-036", "slug": "the-creator-tracking-system", "title": "The Creator Tracking System", "category": "Building & Monetising", "subcategory": "Monetisation Strategy", "difficulty": "Intermediate", "description": "Stop guessing what's working. Build a content pillar system with a five-tab Excel tracker and seven AI prompts that analyse your posts automatically, showing exactly what drives reach, authority, and revenue.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Building & Monetising", "The Content Pillar System", "The Five-Tab Spreadsheet", "Agent Mode Prompts: Plan & Grow", "Monetisation Strategy"], "ai_tools": [], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-036_the-creator-tracking-system.html", "summary_file": "summaries/AI-036.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-036 – The Creator Tracking System  \n\n- **Category:** Building & Monetising | **Subcategory:** Monetisation Strategy  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \n\nThe guide introduces a data‑driven framework that turns ad‑hoc social‑media posting into a repeatable “content‑operator” process. It starts by classifying every piece of output into one of four **content pillars**—each pillar has a distinct business purpose (reach, authority, conversion, or trust) and a corresponding key performance indicator (KPI). By tagging posts at creation time, creators can later aggregate results by pillar rather than by raw volume, allowing them to see which strategic function is actually moving the needle.  \n\nTo capture and analyse this information, the author proposes a **five‑tab spreadsheet** built inside Excel (or any compatible spreadsheet app). The tabs record raw post data, automatically summarise pillar‑level metrics, compare performance across platforms, track follower growth, and hold a forward‑looking 90‑day content plan. The spreadsheet is powered by a series of **Agent‑Mode prompts** (Excel’s built‑in large‑language‑model assistant) that generate calculations, conditional formatting, and narrative insights on demand. By running the prompts monthly and quarterly, the creator receives actionable recommendations for adjusting volume, format, or topic mix before the next batch of content is produced.  \n\n## 2. Why It Matters  \n\nIn the crowded creator economy, merely counting posts or publishing frequency provides no insight into ROI. The pillar system forces a strategic lens: each post is evaluated against the outcome it is meant to achieve, and the associated KPI makes success measurable. This alignment reduces wasted effort, shortens the feedback loop, and enables predictive planning (e.g., forecasting follower milestones).  \n\nEmbedding the workflow in Excel leverages a tool most creators already own, while the Agent‑Mode prompts automate the heavy lifting that would otherwise require manual formulas or separate analytics dashboards. The result is a low‑cost, high‑velocity decision engine that scales with the creator’s output and can be adapted to any platform mix (TikTok, Instagram, YouTube Shorts, etc.).  \n\n## 3. Target Audience  \n\n- **Independent creators** (video, short‑form, or written) who publish multiple times per week and need a systematic way to evaluate impact.  \n- **Social‑media managers** overseeing several accounts and looking for a lightweight alternative to paid analytics suites.  \n- **Growth‑focused freelancers or solopreneurs** who want to tie content output directly to measurable business goals (lead generation, sales, community building).  \n- **Mid‑level marketers** comfortable with spreadsheets and basic AI prompting, but not yet invested in custom BI tooling.  \n\n## 4. Key Concepts & Principles  \n\n- **Content Pillar Architecture** – A taxonomy that groups each post into one of four strategic categories (Tutorial/Tool, Concept/Insight, Social‑Proof/Results, Founder/Behind‑the‑Scenes). The pillar determines the primary KPI (e.g., views & saves for tutorials, comments & shares for concepts).  \n- **Metric‑Driven Decision Loop** – Instead of reacting to raw volume, creators assess pillar‑level performance, diagnose whether low results stem from insufficient quantity or poor quality, and iterate before the next publishing cycle.  \n- **Five‑Tab Tracking Spreadsheet** – A modular workbook where Tab 1 logs raw post data, Tab 2 aggregates pillar statistics, Tab 3 cross‑compares platforms, Tab 4 tracks follower growth, and Tab 5 holds a provisional 90‑day content roadmap.  \n- **Agent‑Mode Prompt Automation** – Pre‑crafted natural‑language commands that instruct Excel’s AI assistant to build the workbook, calculate summaries, flag outliers, and generate narrative recommendations without writing formulas manually.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Microsoft Excel (or compatible spreadsheet software)** – Serves as the central repository for raw data, calculations, and visualisations.  \n- **Excel Agent Mode (LLM‑powered assistant)** – Executes the custom prompts that create tables, apply conditional formatting, and produce analytical commentary directly inside the workbook.  \n\n*(The workflow can be replicated in Google Sheets with an external LLM integration, but the guide is written for native Excel capabilities.)*  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Monthly Performance Review  \n\n1. **Log every post** in Tab 1 immediately after publishing, filling in date, platform, pillar, title, format, and raw metrics (views, saves, comments, etc.).  \n2. **Run the “Monthly Performance Analysis” prompt** on the month’s rows. The AI returns:  \n   - Which pillar delivered the most reach, saves, and new followers.  \n   - Any under‑performing pillar (e.g., low average views).  \n
