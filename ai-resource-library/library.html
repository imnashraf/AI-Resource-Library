ing `deploy_id` and `environment`, run smoke tests against the new deployment, scan logs for regressions, and post a “go/no‑go” message to a release channel.  \n3. **Connectors**: Add GitHub (to fetch logs or open a verification PR) and Slack (to broadcast the result).  \n4. **CI Integration** – In a GitHub Actions workflow, add a step:  \n\n   ```yaml\n   - name: Trigger Claude Routine\n     env:\n       ROUTINE_URL: ${{ secrets.ROUTINE_URL }}\n       ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}\n     run: |\n       curl -X POST \"$ROUTINE_URL\" \\\n         -H \"Authorization: Bearer $ROUTINE_TOKEN\" \\\n         -H \"anthropic-beta: experimental-cc-routine-2026-04-01\" \\\n         -H \"Content-Type: application/json\" \\\n         -d '{\"deploy_id\":\"v1.2.3\",\"environment\":\"prod\"}'\n   ```  \n\n5. **Result** – After the deployment finishes, the Routine runs instantly, performs the checks, and notifies the team without manual intervention.  \n\n## 7. Prerequisites  \n\n- An Anthropic account with access to Claude Code (research preview enabled).  \n- At least one GitHub repository you own or have admin rights to, plus a personal access token with repo read/write scopes.  \n- Familiarity with cron syntax if custom schedules are needed.  \n- Ability to store secrets securely (e.g., environment variables, CI secret stores).  \n- Basic command‑line proficiency for issuing `curl` requests or using HTTP clients.  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – Deep dive into crafting deterministic prompts for AI agents.  \n- **Anthropic API Reference (v1)** – Full specification of endpoint parameters, rate limits, and beta features.  \n- **GitHub Actions & Webhooks** – How to complement Claude Routines with native CI pipelines.  \n- **Secure Secret Management** – Best practices for handling bearer tokens, API keys, and environment variables in cloud environments.  \n- **Automation Design Patterns** – Comparative study of static workflow engines (n8n, Zapier) vs. AI‑driven routines for scalability and maintainability."}, {"id": "AI-008", "slug": "claude-code-10x-setup-guide", "title": "Claude Code 10x Setup Guide", "category": "Claude Code", "subcategory": "Environment Setup", "difficulty": "Intermediate", "description": "The full Claude Code setup that maximises output quality, CLAUDE.md configuration, hooks, permissions, MCP servers, and the project structure that makes agentic coding actually reliable.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Environment Setup"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-008_claude-code-10x-setup-guide.html", "summary_file": "summaries/AI-008.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-008 - Claude Code 10x Setup Guide\n\n- **Category:** Claude Code | **Subcategory:** Environment Setup  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks developers through three advanced capabilities of Claude Code that dramatically accelerate the development loop: remote control of a live session, deterministic hook‑based automation, and vision‑driven app previews. It explains how to expose a secure tunnel from the local CLI so a phone or any browser can issue commands, how to author a JSON‑based hook manifest that automatically runs linters and test suites after every file mutation, and how to enable the desktop preview pane that launches a dev server, captures screenshots, interacts with UI elements, and feeds visual feedback back to Claude for corrective actions.  \n\nUnderlying all three features is a consistent architectural pattern: the Claude Code runtime stays on the developer’s machine, while auxiliary services (tunnel, hook executor, embedded browser) act as thin, stateless bridges. By configuring these bridges once, the developer transforms a traditional “write‑compile‑run” cycle into a continuous, self‑correcting workflow where code quality, functional correctness, and UI fidelity are enforced automatically.\n\n## 2. Why It Matters  \nIn conventional setups, developers must manually switch contexts—running a linter, launching a test runner, opening a browser, and monitoring a remote build—all of which introduces latency and human error. Remote control eliminates desk‑bound bottlenecks, letting long‑running builds be supervised from a mobile device. Deterministic hooks guarantee that every code alteration is immediately vetted, preventing technical debt from accumulating unnoticed. Vision‑based previews give Claude a perceptual understanding of the UI, catching layout or interaction bugs that static logs cannot reveal. Collectively, these mechanisms shrink feedback cycles from minutes to seconds, raise overall code health, and free cognitive bandwidth for higher‑level design work.\n\n## 3. Target Audience  \n- **Full‑stack engineers** who regularly spin up local dev servers and need rapid visual validation.  \n- **AI‑augmented development teams** leveraging Claude Code to generate or edit code and seeking tighter integration with CI‑like checks.  \n- **DevOps or tooling specialists** tasked with automating quality gates in a developer‑centric environment.  \n- **Intermediate‑level programmers** comfortable with CLI operations, JSON configuration, and npm‑style scripts, but who have not yet adopted remote or visual automation.\n\n## 4. Key Concepts & Principles  \n- **Secure Remote Tunneling (`/rc`)**: A one‑command operation that creates a temporary, encrypted endpoint exposing the local Claude Code session to any web‑enabled device, without copying source files off‑machine.  \n- **Deterministic Hook Engine**: A rule‑based dispatcher that watches Claude‑generated file actions and triggers predefined shell commands (e.g., lint, test) in a predictable order, ensuring repeatable outcomes.  \n- **Matcher Syntax**: Pattern strings (e.g., `Write|Edit|MultiEdit`) that filter which Claude actions should fire hooks, allowing fine‑grained control over automation triggers.  \n- **Vision‑Based App Preview**: An embedded Chromium instance that renders the application, captures pixel data, performs scripted interactions, and feeds visual observations back to Claude for corrective suggestions.  \n\n## 5. Tools & Technologies Mentioned  \n- **Claude Code CLI** – The command‑line interface that drives code generation, accepts the `/rc` command, and orchestrates hook execution.  \n- **Claude Code Desktop** – A GUI wrapper that hosts the preview pane, auto‑detects dev server configurations, and provides a point‑and‑click feedback channel.  \n- **ngrok‑style Tunnel Provider** – Implicitly used by the `/rc` command to expose a secure URL (e.g., `https://rc.claude.ai/s/...`).  \n- **Node/NPM ecosystem** – The typical environment for lint (`npm run lint`) and test (`npm run test`) scripts referenced in hook definitions.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Continuous Quality Enforcement with Hooks  \n1. **Create Hook Directory**: `mkdir -p .claude && touch .claude/hooks.json`.  \n2. **Define Post‑Tool Hook**: Insert a JSON object that matches Claude’s write/edit actions and lists shell commands for linting and testing.  \n3. **Validate Exit Codes**: Ensure `npm run lint` and `npm run test` return non‑zero status on failure so Claude can react.  \n4. **Run Claude Code**: As Claude edits files, the hook engine automatically invokes the commands, halting further generation if a step fails.  \n5. **Iterate**: Claude receives the failure signal, revises the code, and re‑triggers the hooks until all checks pass.  \n\n### Use Case 2 – Mobile‑First Monitoring via Remote Control  \n1. **Start a Build**: Initiate a long‑running compilation or bundling task in the CLI.  \n2. **Activate Tunnel**: Execute `/rc` to receive a unique secure URL.  \n3. **Share URL**: Open the link on a smartphone or any external browser; the Claude Code app (if installed) will connect automatically.  \n4. **Observe & Interact**: From the mobile device, monitor build logs, cancel tasks, or issue additional commands without returning to the workstation.  \n5. **Terminate**: Closing the CLI session or issuing a stop command tears down the tunnel, guaranteeing no lingering exposure.  \n\n## 7. Prerequisites  \n- A functional installation of **Claude Code CLI** (latest version).  \n- **Node.js** and **npm** (or equivalent package manager) for running lint/test scripts.  \n- Basic familiarity with JSON configuration files and shell command semantics.  \n- For visual previews: a desktop environment capable of running **Claude Code Desktop** and a web project that can be started via `npm start` or similar script.  \n\n## 8. Recommended Next Resources  \n- **Claude Code Advanced Prompt Engineering** – Techniques for crafting prompts that maximize Claude’s ability to generate testable, lint‑compliant code.  \n- **CI/CD Integration with Claude Code** – Guide on wiring hook outputs into external CI pipelines (GitHub Actions, GitLab CI).  \n- **Secure Tunneling Deep Dive** – Exploration of underlying tunnel protocols, custom domain configuration, and access‑control best practices.  \n- **Vision‑Based Testing Frameworks** – Comparative study of tools like Playwright, Cypress, and how Claude’s visual preview complements them."}, {"id": "AI-009", "slug": "7-claude-code-agent-types", "title": "7 Claude Code Agent Types", "category": "Claude Code", "subcategory": "Agent Architecture", "difficulty": "Intermediate", "description": "The seven distinct ways to use Claude Code as an agent, from single-task runners to persistent multi-step workflows. Understand what each type is built for and when to reach for each one.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Agent Architecture"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-009_7-claude-code-agent-types.html", "summary_file": "summaries/AI-009.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-009 – 7 Claude Code Agent Types  \n\n- **Category:** Claude Code | **Subcategory:** Agent Architecture  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide introduces a taxonomy of seven reusable patterns for building autonomous agents inside the Claude Code environment. It moves from the simplest “tool‑enabled” agent that can read/write calendars, email, and contacts, to sophisticated orchestrators that dynamically spin up specialist sub‑agents on demand. For each pattern the article explains the core responsibilities, the data flow model (e.g., linear hand‑offs vs. concurrent execution), and the minimal prompt syntax required to instantiate the behavior.\n\nBeyond the individual patterns, the material stresses a compositional mindset: agents can be combined—routers can dispatch to human‑in‑the‑loop validators, which in turn can trigger orchestrators that employ parallel or sequential sub‑agents, all of which may be backed by MCP‑connected services (Notion, Jira, databases, etc.). Mastery of these building blocks equips a developer to construct end‑to‑end automation pipelines that are both modular and extensible.\n\n## 2. Why It Matters  \nIn production AI systems the ability to break a business problem into discrete, reusable components directly translates into faster iteration cycles, clearer debugging, and lower maintenance overhead. By leveraging Claude’s built‑in tool access together with MCP server integrations, engineers can bridge the gap between LLM reasoning and concrete enterprise data stores. The parallel and sequential patterns address performance bottlenecks—parallelism reduces wall‑clock time for independent subtasks, while sequential chaining preserves deterministic data flow for dependent steps. The router and human‑in‑the‑loop patterns add governance, enabling high‑volume triage without sacrificing oversight for risky actions. Ultimately, the orchestrator pattern provides a scalable “team‑lead” abstraction that can auto‑compose the right mix of agents for any new request, future‑proofing the automation stack.\n\n## 3. Target Audience  \n- **AI engineers** building production‑grade Claude Code agents who need a systematic design framework.  \n- **Automation architects** responsible for integrating LLMs with existing SaaS tools and internal databases.  \n- **Product managers** looking to evaluate which agent pattern best matches a given workflow complexity.  \n- **Developers with intermediate Python/CLI experience** who are comfortable issuing `claude` commands and handling JSON payloads.  \n\n## 4. Key Concepts & Principles  \n\n- **Tool‑Enabled Autonomy (Basic Agent)** – Granting the model direct access to external services (calendar, Gmail, contacts) so it can plan and execute multi‑step tasks without prompting at each step.  \n- **MCP Server Connectivity** – Using Claude’s Managed Connection Protocol to attach external SaaS platforms (Notion, Atlassian, SQL databases) as additional knowledge and action domains for the agent.  \n- **Sequential Chaining** – Organizing agents into a pipeline where the output of one becomes the structured input of the next, enabling specialization while keeping error containment.  \n- **Parallel Execution** – Dispatching multiple independent agents simultaneously, then aggregating their JSON results, to achieve time‑savings on orthogonal subtasks.  \n- **Routing Logic** – Embedding a classification layer that inspects incoming requests and forwards them to the appropriate downstream workflow (e.g., urgent, sales, support).  \n- **Human‑In‑The‑Loop (HITL)** – Enforcing a pause for explicit user confirmation before any irreversible operation, providing a safety net for high‑risk automation.  \n- **Orchestrator Agent** – A meta‑agent that dynamically spawns specialist agents based on the current goal, coordinates their outputs, and can recursively invoke further orchestrators for deeper complexity.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code CLI (`claude`)** – Command‑line interface for invoking agents, adding MCP connections, and managing execution flow.  \n- **MCP (Managed Connection Protocol)** – Standardized bridge for exposing external SaaS APIs (Notion, Atlassian, relational databases) to Claude agents.  \n- **JSON Payloads** – Structured data interchange format used for hand‑offs between sequential or parallel agents, ensuring type‑safe consumption.  \n- **Shell Background Jobs (`&` and `wait`)** – Unix‑style process control employed to run parallel agents and synchronize their completion before merging results.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Automated Outreach Campaign  \n1. **Router** receives a batch of lead identifiers and classifies them as “sales”.  \n2. **Orchestrator** spawns three parallel agents:  \n   - **Research Agent** pulls company background from Notion via MCP.  \n   - **Content Agent** generates a personalized email template using Claude’s language model.  \n   - **Compliance Agent** validates email content against internal policy stored in a database.  \n3. **Parallel agents** output JSON objects; the orchestrator merges them into a final payload.  \n4. **Human‑In‑The‑Loop** agent presents the assembled email and asks the operator to approve sending.  \n5. Upon approval, the **Basic Agent** uses the Gmail tool to dispatch the email and logs the activity back to the CRM via MCP.  \n\n### Use Case 2 – Incident Response Automation  \n1. **Router** ingests incoming support tickets and tags them as “urgent”.  \n2. **Human‑In‑The‑Loop** agent extracts the ticket details, proposes a remediation plan, and waits for a manager’s sign‑off.  \n3. After approval, an **Orchestrator** creates a sequential chain:  \n   - **Data Collector** reads relevant logs from a monitoring database (MCP).  \n   - **Root‑Cause Analyzer** runs a diagnostic model on the logs.  \n   - **Patch Deployer** uses the calendar tool to schedule a maintenance window and the internal API tool to push a fix.  \n4. Each step returns a structured JSON report; the orchestrator compiles a final incident summary and updates the ticket in Jira via MCP.  \n\n## 7. Prerequisites  \n\n- Access to a Claude Code account with CLI installed and authenticated.  \n- API keys for any external services you plan to connect (e.g., Notion, Atlassian, database credentials).  \n- Basic familiarity with shell scripting, JSON handling, and asynchronous command execution (`&`, `wait`).  \n- Understanding of the business process you intend to automate (task granularity, risk level, required approvals).  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – Deep‑dive into crafting system prompts that guide multi‑step reasoning.  \n- **MCP Integration Guide** – Step‑by‑step tutorial for exposing internal micro‑services to Claude agents.  \n- **Concurrency Patterns for LLM‑Powered Automation** – Academic paper covering parallelism, race conditions, and deterministic merging strategies.  \n- **Human‑Centric AI Governance** – Framework for designing HITL checkpoints and audit trails in autonomous systems.  \n- **Orchestration Frameworks (Airflow, Prefect) + Claude** – Exploring how traditional workflow orchestrators can interoperate with Claude‑generated agents for enterprise‑scale pipelines."}, {"id": "AI-010", "slug": "claude-code-commands-guide", "title": "Claude Code Commands Guide", "category": "Claude Code", "subcategory": "CLI Commands", "difficulty": "Beginner", "description": "Every slash command, keyboard shortcut, and CLI flag explained. A reference guide for Claude Code users who want to move faster and use the tool the way it was designed to be used.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Command 01, /ultra plan", "Command 02, /power up", "Command 03, /insights", "Now Go Try Them.", "CLI Commands"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-010_claude-code-commands-guide.html", "summary_file": "summaries/AI-010.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-010 - Claude Code Commands Guide  \n\n- **Category:** Claude Code | **Subcategory:** CLI Commands  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide introduces three recently added slash‑commands that extend the capabilities of Claude Code, Anthropic’s code‑generation assistant. Each command is invoked from within an active Claude Code session and runs autonomously, allowing developers to keep their terminal workflow uninterrupted.  \n\n- **`/ultra plan`** launches a parallel web‑research process, spawns lightweight sub‑agents, and automatically creates supporting artefacts (e.g., diagrams, reference material) while the user continues coding.  \n- **`/power up`** inspects the user’s interaction history with Claude Code, pinpoints knowledge gaps, and synthesizes a set of ten custom tutorials that target those specific deficiencies.  \n- **`/insights`** compiles a diagnostic report that maps current usage patterns, highlights repetitive manual steps, and proposes concrete automation opportunities.  \n\nCollectively, the material explains the purpose of each command, the underlying workflow (background agents + usage‑analytics), and the exact CLI invocation required to activate them.\n\n## 2. Why It Matters  \nIn modern AI‑augmented development, time spent context‑switching between the editor, browser, and documentation is a major source of inefficiency. The three commands address this friction point by embedding research, learning, and self‑audit directly into the coding environment.  \n\n- **Productivity boost:** Parallel planning eliminates the need to pause coding for web searches, shrinking the “think‑search‑implement” loop.  \n- **Personalized upskilling:** Auto‑generated tutorials adapt to the developer’s real‑world usage, accelerating mastery of Claude Code’s advanced features.  \n- **Continuous improvement:** The insights report surfaces hidden manual bottlenecks, enabling teams to codify repeatable patterns into reusable snippets or automation scripts.  \n\nAdopting these commands can therefore reduce cognitive load, shorten iteration cycles, and increase the overall ROI of integrating Claude Code into a software delivery pipeline.\n\n## 3. Target Audience  \n- **Junior to mid‑level developers** who are already experimenting with Claude Code and want to streamline their workflow.  \n- **Technical leads / engineering managers** seeking data‑driven ways to gauge how their teams leverage AI assistance.  \n- **DevOps or tooling engineers** interested in embedding AI‑driven research and reporting into CI/CD or internal developer portals.  \n- **Educators and mentors** who want to provide learners with on‑demand, usage‑specific training material without manual curriculum design.\n\n## 4. Key Concepts & Principles  \n\n- **Parallel Agent Execution:** Sub‑agents run concurrently with the main Claude Code session, performing web queries and asset generation without blocking the user’s terminal.  \n- **Usage‑Based Personalization:** Historical interaction logs are mined to identify skill gaps, ensuring that generated tutorials are directly relevant to the individual’s workflow.  \n- **Self‑Audit & Automation Recommendation:** The insights engine performs a heuristic analysis of command frequency and manual steps, then outputs actionable automation suggestions.  \n- **Command‑Centric Extensibility:** By exposing functionality through slash‑commands, Claude Code maintains a lightweight, discoverable interface that can be expanded without altering the core CLI.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code (CLI package):** The primary interface for interacting with Anthropic’s code‑generation model; installed via npm and executed in a terminal session.  \n- **Node Package Manager (npm):** Used to fetch the `@anthropic-ai/claude-code` package globally, making the slash‑commands available system‑wide.  \n- **Sub‑Agents (internal):** Lightweight processes spawned by `/ultra plan` that handle web scraping, data extraction, and diagram creation.  \n- **Usage Analytics Engine:** Backend component that aggregates session logs to feed `/power up` and `/insights`.\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Parallel Research While Coding  \n1. **Start a Claude Code session** (`claude-code` or via your IDE integration).  \n2. **Enter the planning prompt** describing the feature you intend to implement.  \n3. **Trigger parallel research** by typing `/ultra plan`.  \n4. **Continue writing code**; the sub‑agents silently browse the web, collect relevant APIs, and generate diagrams.  \n5. **Review the delivered assets** (links, SVGs, markdown summaries) as they appear in the terminal output.  \n6. **Incorporate the findings** directly into your implementation, eliminating the need to open a browser manually.  \n\n### Use Case 2 – Automated Skill Gap Coaching  \n1. **Complete a series of Claude Code interactions** (e.g., generating functions, refactoring snippets).  \n2. **Run `/power up`** to request a personalized learning bundle.  \n3. **Receive ten tutorial modules** that address the exact patterns where the engine detected under‑utilized features (e.g., advanced prompting, multi‑file scaffolding).  \n4. **Follow each tutorial** in the order suggested, applying the new techniques to a sandbox project.  \n5. **Re‑run `/insights`** after a week to verify that the previously identified gaps have been closed and that manual steps have decreased.  \n\n## 7. Prerequisites  \n\n- A working Node.js environment (v14+ recommended).  \n- Global installation of the Claude Code CLI: `npm install -g @anthropic-ai/claude-code`.  \n- An active Anthropic API key configured in your environment (`export ANTHROPIC_API_KEY=…`).  \n- Basic familiarity with terminal navigation and the concept of prompting an LLM.  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – deep‑dive into crafting high‑impact prompts for multi‑step tasks.  \n- **Anthropic Mythos Model Overview** – understanding the underlying model that powers Claude Code’s latest features.  \n- **Automation with Claude Code & GitHub Actions** – tutorial on embedding Claude‑generated scripts into CI pipelines.  \n- **Developer Productivity Metrics** – guide to measuring the impact of AI‑assisted tooling on cycle time and code quality."}, {"id": "AI-011", "slug": "claude-code-codex-setup-guide", "title": "Claude Code + Codex Setup Guide", "category": "Claude Code", "subcategory": "Environment Setup", "difficulty": "Intermediate", "description": "How to connect Claude Code to OpenAI Codex and run both models in the same agentic workflow. Setup, configuration, and the use cases where having both models available pays off.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Environment Setup"], "ai_tools": ["Claude Code", "Claude", "ChatGPT", "OpenAI Codex"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-011_claude-code-codex-setup-guide.html", "summary_file": "summaries/AI-011.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-011 – Claude Code + Codex Setup Guide  \n\n- **Category:** Claude Code | **Subcategory:** Environment Setup  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis tutorial walks a developer through wiring Claude Code to the OpenAI Codex command‑line interface (CLI) so the two models can jointly audit, test, and simulate code. It explains how to install the Codex CLI, pull the community‑maintained *skill‑codex* plugin, embed a declarative hook inside a `CLAUDE.md` manifest, and validate the end‑to‑end flow with a simple audit request.  \n\nBeyond the mechanical steps, the guide clarifies the architectural pattern: Claude Code performs high‑level reasoning and intent extraction, then automatically hands the same task to Codex, which excels at concrete execution‑path analysis. The dual‑model feedback loop produces a merged result that surfaces discrepancies and edge‑case failures that would otherwise slip through a single‑model review.  \n\n## 2. Why It Matters  \nPairing two complementary LLMs reduces blind spots inherent to any single model, delivering more trustworthy code reviews without manual intervention. By automating the hand‑off via a `CLAUDE.md` hook, teams can embed continuous AI‑driven quality gates directly into their development workflow, cutting down on missed logical bugs and production regressions. The approach also leverages existing OpenAI API credits through the lightweight Codex CLI, keeping costs predictable while scaling across multiple projects.  \n\n## 3. Target Audience  \n- **Software engineers** who already use Claude Code for design‑level assistance and want a tighter safety net for generated code.  \n- **DevOps / CI engineers** looking to integrate AI checks into automated pipelines.  \n- **Technical leads** responsible for code‑review standards and seeking to augment human reviewers with AI.  \n- **Intermediate‑level practitioners** comfortable with terminal commands, npm, and basic Git operations.  \n\n## 4. Key Concepts & Principles  \n\n- **Dual‑Model Review Loop**: Claude Code supplies contextual reasoning, while Codex evaluates concrete execution paths; their outputs are reconciled to highlight mismatches.  \n- **Skill‑Based Plugin Architecture**: The *skill‑codex* repository provides a reusable plugin that tells Claude Code how to invoke the Codex CLI and interpret its JSON responses.  \n- **Declarative Hook in `CLAUDE.md`**: A YAML‑style block defines trigger conditions (e.g., testing, auditing) and the sequence of actions (run Codex, compare results, flag discrepancies).  \n- **Environment Variable Authentication**: The Codex CLI authenticates via an `OPENAI_API_KEY` exported in the shell, ensuring secure API calls without embedding secrets in code.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Codex CLI (`@openai/codex`)** – A Node‑based command‑line client that forwards prompts to the OpenAI Codex model and returns structured output.  \n- **Claude Code** – Anthropic’s code‑focused assistant that reads `CLAUDE.md` hooks, orchestrates tasks, and presents synthesized results.  \n- **skill‑codex GitHub repo** – Community plugin that bridges Claude Code and the Codex CLI, containing the skill definition and runtime scripts.  \n- **npm** – Package manager used to install the Codex CLI globally.  \n- **Git** – Version‑control tool for cloning the plugin repository.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Automated Test‑Run Auditing  \n1. **Install Codex CLI**: `npm install -g @openai/codex`.  \n2. **Expose API key**: `export OPENAI_API_KEY=sk-…` (add to `~/.bashrc` or `~/.zshrc` for persistence).  \n3. **Clone plugin**: `git clone https://github.com/klaudworks/skill-codex.git`.  \n4. **Copy plugin into project**: `cp -r skill-codex/plugins/skill-codex ./my-app/.claude-plugin/skill-codex`.  \n5. **Add hook** to `CLAUDE.md` (trigger on “running tests”).  \n6. **Run a test suite** inside Claude Code: ask it to “run the unit tests”. Claude executes the tests, then automatically invokes Codex to re‑evaluate the same code paths.  \n7. **Review merged output**: discrepancies are highlighted; fix any issues flagged by Codex.  \n\n### Use Case 2 – Pre‑Release Code Audit Pipeline  \n1. Follow steps 1‑4 from Use Case 1 to set up the environment.  \n2. Extend the `CLAUDE.md` hook to also fire on “auditing” events (e.g., before a merge).  \n3. Integrate Claude Code into CI (e.g., via a script that launches Claude with the project directory).  \n4. When a pull request is opened, the CI script triggers Claude to perform a high‑level audit, then Codex runs a parallel static‑analysis pass.  \n5. The pipeline fails if the merged report contains any “medium‑severity” discrepancy, enforcing a quality gate before merge.  \n\n## 7. Prerequisites  \n\n- A functional installation of **Claude Code** on the local workstation.  \n- An **OpenAI** account with API access and a valid API key.  \n- Basic familiarity with **npm**, **Git**, and shell configuration files (`.bashrc`, `.zshrc`).  \n- A project directory where a `.claude-plugin` folder can be created.  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – Deep dive into crafting prompts that maximize Claude’s reasoning capabilities.  \n- **OpenAI Codex API Reference** – Official documentation for fine‑tuning request parameters and handling response formats.  \n- **CI/CD Integration Patterns for AI‑Assisted Reviews** – Guides on embedding Claude Code and Codex checks into GitHub Actions, GitLab CI, or Jenkins pipelines.  \n- **Security Best Practices for API Keys** – Strategies for secret management (e.g., using `dotenv`, secret managers, or environment‑variable vaults)."}, {"id": "AI-012", "slug": "run-claude-code-free-with-ollama", "title": "Run Claude Code Free With Ollama", "category": "Claude Code", "subcategory": "Model & Tool Interop", "difficulty": "Intermediate", "description": "Run local open-source models through Claude Code using Ollama, no API costs, fully offline. Covers installation, model selection, and the practical limits of local models versus Claude's hosted API.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Without Ollama", "With Ollama", "Chapter 02, Step 1, Install Ollama", "Model & Tool Interop"], "ai_tools": ["Claude Code", "Claude", "Ollama"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-012_run-claude-code-free-with-ollama.html", "summary_file": "summaries/AI-012.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-012 – Run Claude Code Free With Ollama  \n\n- **Category:** Claude Code | **Subcategory:** Model & Tool Interop  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide explains how to replace the default Anthropic cloud endpoint used by Claude Code with a locally hosted Ollama server, thereby eliminating API fees and preserving code privacy. It walks the reader through installing Ollama, selecting an appropriate open‑source coding model, configuring three environment variables, and confirming that Claude Code is now routing its requests to the local model.  \n\nThe underlying architecture hinges on Ollama’s ability to expose an HTTP API that mirrors the Anthropic Messages format. By pointing Claude Code at `http://localhost:11434` and supplying a dummy auth token, the tool believes it is communicating with the official service while the heavy lifting is performed on the user’s own hardware. The tutorial also outlines performance expectations, hardware requirements, and troubleshooting tactics for common pitfalls such as missing environment variables or GPU mis‑configuration.\n\n## 2. Why It Matters  \nRedirecting Claude Code to a self‑hosted model removes recurring usage costs and eliminates rate‑limiting constraints that can stall development pipelines. For teams handling proprietary or regulated codebases, keeping all data on‑premises satisfies compliance and confidentiality mandates. Moreover, the approach democratizes access to advanced coding assistants: anyone with a modest GPU or sufficient RAM can run a capable model without relying on external services. This shift aligns with broader industry trends toward edge AI and cost‑effective, privacy‑first tooling.\n\n## 3. Target Audience  \n- **Software engineers** who regularly invoke Claude Code for code generation, refactoring, or debugging and want to avoid cloud billing.  \n- **DevOps / infrastructure specialists** tasked with provisioning local AI inference services for internal teams.  \n- **Security‑focused developers** handling sensitive code or client data that must never leave the corporate network.  \n- **Intermediate‑level practitioners** comfortable with command‑line environments, environment‑variable management, and basic GPU/CPU inference concepts.\n\n## 4. Key Concepts & Principles  \n\n- **Local API Proxying**: Ollama implements a thin wrapper that accepts Anthropic‑style payloads, enabling existing Claude Code clients to operate unchanged while the request is processed locally.  \n- **Mixture‑of‑Experts (MoE) Scaling**: The recommended 30‑billion‑parameter model activates only a subset of its parameters per token, delivering near‑30B quality with 3‑B‑like latency when sufficient VRAM is present.  \n- **Environment‑Variable Redirection**: Three variables (`ANTHROPIC_BASE_URL`, `ANTHROPIC_AUTH_TOKEN`, `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`) control the endpoint, authentication stub, and telemetry suppression, respectively.  \n- **Hardware‑Aware Model Selection**: Choosing between a 30B MoE model and a 7B baseline depends on GPU VRAM (≥16 GB) or system RAM (≥32 GB) availability, balancing speed, memory footprint, and model capability.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code** – A CLI‑driven coding assistant from Anthropic that normally talks to the Anthropic API; here it is repurposed to consume a locally hosted model.  \n- **Ollama** – A cross‑platform runtime that downloads, quantizes, and serves open‑source LLMs via a RESTful endpoint on port 11434; it abstracts GPU/CPU execution details.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Zero‑Cost Local Coding Assistant  \n1. **Install Ollama** (macOS/Windows installer or `curl -fsSL https://ollama.com/install.sh | sh` on Linux).  \n2. **Pull the desired model**:  \n   - For high‑end hardware: `ollama pull qwen3-coder:30b`  \n   - For laptops or limited RAM: `ollama pull qwen2.5-coder:7b`  \n3. **Add environment variables** to `~/.bashrc` or `~/.zshrc`:  \n   ```bash\n   export ANTHROPIC_BASE_URL=\"http://localhost:11434\"\n   export ANTHROPIC_AUTH_TOKEN=\"ollama\"\n   export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1\n   source ~/.zshrc   # or source ~/.bashrc\n   ```  \n4. **Start Claude Code** with `claude`. The tool should launch directly into the chat UI without prompting for an Anthropic key.  \n5. **Validate** by asking “What model are you running?” – the response should echo the model name you pulled.  \n\n### Use Case 2 – Rapid Switching Between Local and Cloud Back‑ends  \n1. Define two shell aliases in your profile:  \n   ```bash\n   alias claude-local='export ANTHROPIC_BASE_URL=http://localhost:11434 && export ANTHROPIC_AUTH_TOKEN=ollama'\n   alias claude-api='unset ANTHROPIC_BASE_URL && unset ANTHROPIC_AUTH_TOKEN'\n   ```  \n2. When you need to conserve API quota, run `claude-local` before invoking `claude`.  \n3. For tasks that demand the higher quality of Claude Sonnet/Opus, execute `claude-api` to revert to the official Anthropic endpoint.  \n4. This pattern enables on‑the‑fly cost management without reinstalling or reconfiguring software.\n\n## 7. Prerequisites  \n\n- Node.js/npm installed to obtain the global `@anthropic-ai/claude-code` package.  \n- Administrative rights to install system software (Ollama) on macOS, Windows, or Linux.  \n- Sufficient GPU VRAM (≥16 GB) or system RAM (≥32 GB) for the 30B model; at least 4‑5 GB VRAM or 8 GB RAM for the 7B variant.  \n- Basic familiarity with shell configuration files (`.bashrc`, `.zshrc`, PowerShell profile).  \n\n## 8. Recommended Next Resources  \n\n- **Ollama Documentation** – Deep dive into model quantization options, GPU acceleration flags, and custom context window tuning (`OLLAMA_NUM_CTX`).  \n- **Claude Code Advanced Features** – Exploration of tool‑calling, file‑system permissions, and integration with IDE extensions.  \n- **GPU Inference Optimization** – Guides on installing CUDA/cuDNN, configuring `torch`/`tensorflow` back‑ends for Ollama, and monitoring GPU utilization.  \n- **Security Hardening for Local AI Services** – Best practices for sandboxing Ollama, managing network exposure, and auditing generated code for vulnerabilities."}, {"id": "AI-013", "slug": "dynamic-workflows-in-claude-code", "title": "Dynamic Workflows in Claude Code", "category": "Claude Code", "subcategory": "CLI Workflows", "difficulty": "Intermediate", "description": "Build workflows that adapt based on outputs, conditional logic, branching agents, and decision trees inside Claude Code. Moves beyond simple task execution into genuinely intelligent automation.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Chapter 02, How It Actually Works", "Chapter 04, The Review Layer", "CLI Workflows"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-013_dynamic-workflows-in-claude-code.html", "summary_file": "summaries/AI-013.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-013 – Dynamic Workflows in Claude Code  \n\n- **Category:** Claude Code | **Subcategory:** CLI Workflows  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThe guide explains how Claude Code can automatically decompose a single, high‑level instruction into a network of cooperating “sub‑agents” that execute in parallel. Rather than a linear, turn‑by‑turn dialogue, Claude first drafts an orchestration script, launches up to 16 concurrent workers (and up to 1 000 workers overall), and iteratively cross‑validates their outputs until a consensus is reached. The result is a single consolidated report, while the original chat remains responsive.  \n\nKey operational details include:  \n* **Dynamic planning** – Claude reads the prompt, decides the task granularity, and creates a bespoke workflow without any manual architecture definition.  \n* **Parallel execution** – Independent agents explore different slices of the problem simultaneously, dramatically reducing wall‑clock time for large code‑base analyses.  \n* **Review layer** – A dedicated verification pass runs on agents that were not involved in the initial build, catching inconsistencies before the final payload is delivered.  \n\nThe article also covers how to activate the feature (auto‑mode, “ultracode” setting, or explicit workflow prompts), how to request a preview of the generated plan, and practical tips for managing token consumption and ensuring reliable results.\n\n## 2. Why It Matters  \nParallelism transforms Claude Code from a conversational assistant into a scalable compute engine capable of tackling tasks that would otherwise exceed the model’s context window. By off‑loading intermediate results to script variables, the system sidesteps token limits, enabling massive refactors, security sweeps, or performance audits that would normally require a full engineering team. The built‑in verification step improves reliability, making the output suitable for production‑grade code changes or compliance reviews. In environments where time‑to‑insight is critical—such as continuous integration pipelines or rapid incident response—dynamic workflows can shave days or weeks off traditional manual processes.\n\n## 3. Target Audience  \n* **Software engineers** who need to run large‑scale code analyses, migrations, or refactors without writing custom scripts.  \n* **DevOps / SRE teams** looking for automated security or performance audits across sprawling repositories.  \n* **Technical leads** evaluating AI‑augmented tooling for accelerating delivery pipelines.  \n* **AI practitioners** familiar with Claude Code who want to move beyond single‑prompt interactions to orchestrated, multi‑agent pipelines.  \n* **Enterprise architects** seeking a proof‑of‑concept for AI‑driven parallel processing within existing CI/CD ecosystems.\n\n## 4. Key Concepts & Principles  \n\n- **Dynamic Orchestration** – Claude autonomously designs a workflow graph from a natural‑language request, deciding how many agents to spawn and what each should accomplish.  \n- **Parallel Agent Execution** – Up to 16 agents run concurrently, each handling a distinct sub‑task (e.g., scanning a file subset, generating test cases, or performing static analysis). The system caps total agents at 1 000 per run to keep resource usage bounded.  \n- **Iterative Refutation & Convergence** – After initial results are produced, a second set of agents attempts to falsify those findings. The loop repeats until the answers stabilize, mirroring a peer‑review process.  \n- **Review Layer** – A separate verification stage, invoked explicitly, employs agents that were not part of the original build to audit the consolidated output, flagging discrepancies before delivery.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude Code CLI** – Command‑line interface used to launch dynamic workflows, toggle auto‑mode, and set the “ultracode” effort level.  \n- **Claude Code Desktop / VS Code Extension** – GUI front‑ends that expose the same workflow capabilities within an IDE context.  \n- **Claude API (including Bedrock, Vertex AI, Microsoft Foundry)** – Programmatic endpoints that allow integration of dynamic workflows into custom pipelines or cloud‑native services.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Large‑Scale Refactor of a Monolithic Repository  \n1. **Initialize** – Open Claude Code (CLI or IDE) and enable auto‑mode.  \n2. **Prompt** – `Create a dynamic workflow to refactor the authentication module across the entire repo, preserving existing tests.`  \n3. **Review Request** – Append: `After the build agents finish, run a dedicated review pass with fresh agents and report any mismatches.`  \n4. **Plan Inspection (optional)** – `Show me the agent map before execution.` Claude returns a table listing agents (e.g., “Parser”, “Transformer”, “Test‑Validator”) and their responsibilities.  \n5. **Execution** – Accept the plan; Claude spawns up to 16 parallel workers, each handling a file shard.  \n6. **Verification** – Independent agents cross‑check the transformed code against the original test suite.  \n7. **Result** – A consolidated diff and a validation report are delivered, ready for a PR.  \n\n### Use Case 2 – Security Audit of a Microservices Architecture  \n1. **Start Session** – Activate “ultracode” via the effort menu to let Claude decide when a workflow is needed.  \n2. **Prompt** – `Run a security audit across all services, checking for insecure deserialization, open redirects, and hard‑coded secrets.`  \n3. **Automatic Workflow** – Claude detects the breadth of the task, creates a parallel scan for each service, and adds a review layer automatically.  \n4. **Progress Monitoring** – Use `claude status` (CLI) to view live agent counts and completed steps.  \n5. **Review Layer** – Fresh agents re‑run the findings, flagging false positives.  \n6. **Deliverable** – A structured JSON report enumerating vulnerabilities, severity scores, and remediation suggestions.  \n\n## 7. Prerequisites  \n\n- Access to a **Claude Code** subscription (Max, Team, or Enterprise) with the dynamic workflow feature enabled.  \n- Familiarity with the **CLI** (`claude` command) or the **VS Code extension** for Claude Code.  \n- Sufficient token quota (dynamic workflows can consume several hundred thousand tokens for large runs).  \n- A codebase accessible locally or via a remote repository that Claude can read (e.g., cloned Git repo).  \n- Optional: API keys for **Amazon Bedrock**, **Google Vertex AI**, or **Microsoft Foundry** if integrating into cloud pipelines.  \n\n## 8. Recommended Next Resources  \n\n- **Claude Code Advanced Prompt Engineering** – Deep‑dive into crafting prompts that steer agent behavior and control token budgets.  \n- **Parallel Computing Fundamentals** – Concepts such as task decomposition, concurrency limits, and result aggregation, useful for understanding the underlying orchestration model.  \n- **CI/CD Integration Guide for Claude API** – Step‑by‑step instructions for embedding dynamic workflows into GitHub Actions, Azure Pipelines, or Jenkins.  \n- **Security Auditing with AI** – Best practices for interpreting AI‑generated vulnerability reports and integrating them with existing security tooling.  \n- **Performance Profiling at Scale** – Techniques for using Claude’s parallel agents to generate code‑level performance baselines across large repositories."}, {"id": "AI-014", "slug": "ruflo-multi-agent-framework-setup-guide", "title": "Ruflo Multi-Agent Framework Setup Guide", "category": "Claude Code", "subcategory": "Agent Architecture", "difficulty": "Intermediate", "description": "Set up Ruflo, the multi-agent orchestration framework built for Claude Code. Coordinate parallel agents, manage shared context, and build production-grade automation pipelines step by step.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Overview", "Setup Steps", "Optional, Spawn a Manual Swarm", "How the Cost Reduction Works", "Useful Commands", "Agent Architecture"], "ai_tools": ["Claude Code", "Claude", "Ruflo"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-014_ruflo-multi-agent-framework-setup-guide.html", "summary_file": "summaries/AI-014.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-014 – Ruflo Multi‑Agent Framework Setup Guide  \n\n- **Category:** Claude Code | **Subcategory:** Agent Architecture  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a developer through installing and activating Ruflo, an open‑source orchestration layer that runs dozens of specialized agents inside Claude Code. It explains how to bootstrap the framework with a single wizard, register Ruflo as a Claude Code MCP (Model‑Centric Plugin) server, and launch the background daemon that continuously learns from successful runs.  \n\nBeyond the mechanics of installation, the material details Ruflo’s three‑tier routing logic: trivial transformations are handled by a WebAssembly kernel (no LLM cost), medium‑complexity jobs are delegated to a low‑price Claude model, and only the most demanding decisions invoke the premium Opus model. By exposing 313 pre‑packaged MCP tools, the framework enables automatic task delegation without the user needing to master each tool individually.  \n\nFinally, the document provides optional commands for manually constructing a “swarm” of agents with a hierarchical topology, useful for long‑running builds or when fine‑grained control over agent composition is required.\n\n## 2. Why It Matters  \nRuflo tackles two pain points that are common in modern AI‑augmented development environments: **scalability** and **cost efficiency**. By parallelizing over 60 specialist agents, developers can keep many subtasks (coding, testing, security scanning, review, etc.) active simultaneously, dramatically shortening feedback loops. The intelligent routing layer reduces Claude API spend by up to three‑quarters because most routine transformations never invoke a language model.  \n\nIn addition, the self‑learning daemon captures successful execution patterns and refines routing decisions over time, meaning the system becomes more accurate and cheaper the longer it runs. For teams already invested in Claude Code, Ruflo offers a plug‑and‑play extension that unlocks enterprise‑grade multi‑agent capabilities without additional licensing fees.\n\n## 3. Target Audience  \n- **Full‑stack or backend engineers** who already use Claude Code for code‑assisted development and want to scale assistance across many micro‑tasks.  \n- **DevOps / CI engineers** interested in automating parallel builds, tests, and security checks via AI agents.  \n- **AI platform integrators** looking for an open‑source, MIT‑licensed alternative to proprietary multi‑agent orchestration services.  \n- **Intermediate‑level developers** comfortable with Node.js, npm (or Bun), and command‑line tooling, but not necessarily experts in LLM cost optimization.\n\n## 4. Key Concepts & Principles  \n\n- **Three‑Tier Model Routing**: A decision engine that classifies incoming work into “simple”, “mid‑level”, or “complex”. Simple tasks are processed by a WebAssembly kernel (zero LLM cost), mid‑level tasks are sent to a cheaper Claude model, and only truly complex decisions trigger the high‑performance Opus model.  \n\n- **Self‑Learning Daemon**: A persistent background service that records successful task‑agent pairings, updates routing heuristics, and gradually improves both accuracy and cost‑effectiveness without manual intervention.  \n\n- **MCP (Model‑Centric Plugin) Integration**: Ruflo registers itself as an MCP server inside Claude Code, exposing 313 ready‑to‑use tools. This registration enables Claude to invoke any tool via a unified API, eliminating the need for explicit prompting.  \n\n- **Manual Swarm Construction**: While the default automatic routing suffices for most projects, Ruflo also supports explicit creation of a coordinated swarm with a defined topology (e.g., hierarchical) and a capped number of agents, giving developers deterministic control over parallelism.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Node.js (≥ v18)** – Runtime environment required for executing Ruflo’s JavaScript package and its CLI utilities.  \n- **Claude Code** – The IDE‑like environment where Ruflo’s agents are embedded and where the MCP server is registered.  \n- **npm / Bun** – Package managers used to fetch and run the `ruflo` CLI (`npx` for npm, `bunx` for Bun).  \n- **WebAssembly Kernel** – Lightweight execution engine that handles trivial transformations without invoking an LLM.  \n- **Opus Model** – Claude’s premium, high‑capacity model reserved for tasks that demand deep reasoning.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid Project Bootstrapping  \n1. **Create a workspace**: `mkdir my‑project && cd my‑project`.  \n2. **Run the wizard**: `npx ruflo@latest init --wizard` (or `bunx …` for Bun). The wizard scaffolds configuration files (`CLAUDE.md`, settings) and installs the 313 MCP tools.  \n3. **Register MCP**: `claude mcp add ruflo -- npx -y ruflo@latest mcp start`. Verify with `claude mcp list`.  \n4. **Health check**: `npx ruflo doctor --fix` to auto‑repair any missing dependencies.  \n5. **Start learning daemon**: `npx ruflo daemon start`. The daemon now runs in the background, collecting routing data.  \n6. **Open Claude Code** and work as usual; Ruflo silently routes each request to the appropriate specialist agent.  \n\n### Use Case 2 – Controlled Parallel Build with a Manual Swarm  \n1. **Initialize a hierarchical swarm**: `npx ruflo swarm init --topology hierarchical --max-agents 8 --strategy specialized`.  \n2. **Spawn dedicated agents**:  \n   - `npx ruflo agent spawn -t coder --name build‑coder`  \n   - `npx ruflo agent spawn -t tester --name build‑tester`  \n   - `npx ruflo agent spawn -t reviewer --name build‑reviewer`  \n   - `npx ruflo agent spawn -t security --name build‑sec`  \n3. **Trigger the build** (e.g., via a Claude Code command or script). The swarm coordinates the agents, each handling its domain in parallel.  \n4. **Monitor**: Use `npx ruflo doctor --fix` to inspect health, and `npx ruflo daemon stop` when the build completes.  \n\n## 7. Prerequisites  \n\n- A functional installation of **Claude Code** (latest version).  \n- **Node.js** runtime version 18 or newer (`node --version`).  \n- Access to a **Claude API key** (the cost‑reduction benefits assume you have a paid plan that includes Opus).  \n- Familiarity with a terminal, and either **npm** or **Bun** as a package manager.  \n\n## 8. Recommended Next Resources  \n\n- **Ruflo GitHub Repository** – Dive into the source code, explore contribution guidelines, and review advanced configuration options.  \n- **Claude Code Advanced Prompt Engineering** – Learn how to craft prompts that synergize with Ruflo’s automatic routing for maximal productivity.  \n- **Cost‑Optimization Strategies for Claude APIs** – A deeper look at budgeting, usage monitoring, and custom routing policies beyond the default three‑tier model.  \n- **MCP Tool Development Guide** – If you want to author your own MCP tools to extend the 313‑tool ecosystem, this guide provides the necessary SDK references.  \n\n---  \n\n*All commands and concepts have been re‑phrased to respect copyright while preserving actionable information.*"}, {"id": "AI-015", "slug": "graphify-setup-guide", "title": "Graphify Setup Guide", "category": "Claude Code", "subcategory": "Environment Setup", "difficulty": "Intermediate", "description": "Connect Graphify to Claude and turn natural language into data visualisations. Setup guide covers installation, connecting your data sources, and the prompts that produce the best chart outputs.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Without Graphify", "With Graphify", "Environment Setup"], "ai_tools": ["Claude Code", "Claude", "Gemini CLI", "Gemini", "Cursor", "Graphify"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-015_graphify-setup-guide.html", "summary_file": "summaries/AI-015.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-015 – Graphify Setup Guide  \n\n- **Category:** Claude Code | **Subcategory:** Environment Setup  \n- **Difficulty:** Intermediate  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a developer through constructing a persistent, graph‑based representation of a code repository so that Claude‑powered coding assistants can retrieve context without repeatedly ingesting raw source files. The core idea is to run Graphify once (or whenever the code changes significantly) to produce a knowledge graph that captures file relationships, imports, and functional boundaries. After the graph exists, a tiny directive placed in `CLAUDE.md` instructs Claude to query that graph first, falling back to raw file reads only when explicitly requested.  \n\nThe tutorial is split into three practical phases: (1) installing the open‑source Graphify package, (2) optionally visualising the generated markdown graph with Obsidian, and (3) wiring the `CLAUDE.md` file so Claude automatically leverages the graph at session start. By the end of the walkthrough, the reader can reduce token consumption dramatically—up to two orders of magnitude—because Claude now works with a compact, structured index rather than scanning entire source files for every prompt.  \n\n## 2. Why It Matters  \nLarge language model (LLM) coding assistants are token‑hungry; each time they need to understand a function they must read the whole file and its dependencies, inflating cost and latency. Graphify’s pre‑computed graph acts as a high‑density map, delivering only the nodes relevant to a query. This yields three strategic benefits:  \n\n1. **Cost Efficiency** – Token usage scales with the logical complexity of the request instead of the raw size of the repository, delivering up to ~70× savings on big projects.  \n2. **Speed & Responsiveness** – Claude can locate the needed artifact instantly via graph lookup, cutting down the round‑trip time for each prompt.  \n3. **Consistency Across Sessions** – Because the graph persists, the assistant no longer re‑reads unchanged files, ensuring stable context and reducing the chance of drift between sessions.  \n\nIn modern AI‑augmented development pipelines, where continuous prompting is common, these gains translate directly into faster iteration cycles and lower operational spend.  \n\n## 3. Target Audience  \n- **AI‑assisted developers** who use Claude Code, Cursor, Gemini CLI, or similar LLM‑driven IDE extensions.  \n- **DevOps engineers** looking to optimise token budgets for large monorepos.  \n- **Technical leads** interested in scaling AI‑pair programming across teams without exploding costs.  \n- **Intermediate‑level programmers** comfortable with command‑line tools, Python environments, and markdown‑based note‑taking apps.  \n\n## 4. Key Concepts & Principles  \n\n- **Knowledge Graph Indexing** – Transforming a collection of source files into a node‑edge structure that records file hierarchy, import relationships, and functional groupings, enabling rapid semantic lookup.  \n- **Token Economy** – Understanding how LLMs charge per token and why compressing context into a graph reduces the number of tokens needed for each interaction.  \n- **Prompt‑Driven Context Switching** – Using a small instruction set in `CLAUDE.md` to force the model to query the graph before falling back to raw file reads, thereby controlling the flow of information.  \n- **Visual Feedback Loop** – Leveraging Obsidian’s graph view to audit the generated knowledge graph, spot high‑dependency clusters, and validate that the indexing aligns with developer expectations.  \n\n## 5. Tools & Technologies Mentioned  \n\n- **Graphify (Python package)** – An open‑source utility that scans a directory, parses files, and emits a markdown‑based knowledge graph. Installable via `pip`.  \n- **Claude Code** – The LLM‑driven coding environment that reads `CLAUDE.md` at session start and can execute `/graphify query` commands.  \n- **Obsidian** – A markdown vault application that renders the graph output from Graphify, providing an interactive visual map of the codebase.  \n- **Python 3.10+** – Minimum interpreter version required for Graphify; ensures compatibility with modern type‑hinting and parsing libraries.  \n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – One‑Time Project Indexing for Large Repos  \n1. **Prepare environment** – Verify Python 3.10+ (`python3 --version`).  \n2. **Install Graphify** – Run `pip install graphifyy && graphify install`.  \n3. **Generate the graph** – From the root of the Claude project, execute `graphify run`. Wait for the indexing pass (time grows with repo size).  \n4. **Persist the map** – The command creates a `graphify-out/` directory containing markdown files that encode the graph.  \n\n### Use Case 2 – Integrating the Graph into Claude Sessions  \n1. **Edit `CLAUDE.md`** – Add a block under a `## Context Navigation` heading that (a) forces a graph query (`/graphify query \"<question>\"`), (b) restricts raw file reads to explicit commands, and (c) points Claude to `graphify-out/wiki/index.md` as the navigation root.  \n2. **Start a Claude session** – The assistant automatically loads the new instructions and will first consult the graph for any context‑related request.  \n3. **Optional visual audit** – Open the same folder in Obsidian, enable Graph View (`Cmd+G` / `Ctrl+G`), and inspect node clusters to understand dependency hotspots.  \n\nBoth workflows can be repeated whenever the codebase undergoes substantial changes (e.g., after a major refactor).  \n\n## 7. Prerequisites  \n\n- Working installation of **Python 3.10** or newer.  \n- Access to a terminal within the Claude project directory.  \n- Basic familiarity with **markdown** and the concept of a **vault** in Obsidian.  \n- Permission to install third‑party Python packages (`pip`).  \n- A Claude Code environment that reads `CLAUDE.md` at startup.  \n\n## 8. Recommended Next Resources  \n\n- **Advanced Prompt Engineering for Claude** – Techniques to craft queries that maximise graph retrieval efficiency.  \n- **Scaling LLM‑Assisted Development** – Strategies for multi‑repo indexing and cross‑project graph federation.  \n- **Obsidian Plugin Development** – Building custom views or scripts to enrich the visual graph with additional metadata (e.g., test coverage, code ownership).  \n- **Token Management Best Practices** – Guides on budgeting tokens across teams and integrating usage monitoring into CI pipelines."}, {"id": "AI-016", "slug": "claude-code-design-stack-setup-guide", "title": "Claude Code Design Stack Setup Guide", "category": "Claude Code", "subcategory": "Environment Setup", "difficulty": "Beginner", "description": "The design stack that works with Claude Code, frontend skills, component libraries, and the configuration that makes Claude produce production-quality UI from natural language descriptions.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Claude Code", "Environment Setup"], "ai_tools": ["Claude Code", "Claude"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-016_claude-code-design-stack-setup-guide.html", "summary_file": "summaries/AI-016.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-016 - Claude Code Design Stack Setup Guide\n\n- **Category:** Claude Code | **Subcategory:** Environment Setup  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis tutorial walks a newcomer through the creation of a professional‑grade design environment for Claude Code. It explains how to enrich Claude’s native capabilities with three complementary assets: a GitHub‑hosted UX/UI design skill, two Model‑Component‑Providers (MCPs) that supply vetted layout patterns, and a third‑party 3D component library. By the end of the guide, the learner can spin up a Claude Code session that automatically draws from a structured design system, references proven UI patterns, and injects high‑fidelity 3D widgets without additional prompting.\n\nThe underlying architecture is a lightweight stack that leverages Claude’s ability to ingest a `CLAUDE.md` file placed in the project root, and to resolve external MCPs via the `claude mcp` CLI. The guide also demonstrates a quick verification step—issuing a single design prompt and confirming that Claude synthesizes output from all three sources. The process is designed to be repeatable across projects, requiring only a one‑time installation of each component.\n\n## 2. Why It Matters  \nEmbedding a formal design system directly into Claude Code eliminates the trial‑and‑error loop that typically occurs when AI generates UI mock‑ups. The design skill supplies concrete spacing, typography, and component conventions, ensuring visual consistency. The MCPs (Google Stitch and Nano Banana 2) act as curated pattern libraries, steering Claude toward industry‑standard hero sections, navigation bars, and other common constructs. Finally, the 21st.dev asset library adds production‑ready 3D and animated elements, raising the perceived quality of generated prototypes.\n\nCollectively, the stack reduces iteration time, cuts down on manual post‑processing, and aligns AI‑generated assets with brand guidelines. For teams that rely on rapid prototyping or low‑code UI generation, this setup translates into faster stakeholder reviews, fewer redesign cycles, and a smoother handoff to developers.\n\n## 3. Target Audience  \n- **Product designers** who want to prototype UI concepts quickly while staying within a predefined design language.  \n- **Front‑end engineers** seeking to offload repetitive layout drafting to an AI assistant that respects existing component standards.  \n- **AI‑tool integrators** or **dev‑ops engineers** tasked with configuring Claude Code for multiple projects.  \n- **Junior developers** or **students** looking for a hands‑on introduction to AI‑augmented design pipelines.\n\nThe guide assumes basic familiarity with a terminal, Node.js, and version control, but no prior experience with Claude Code is required.\n\n## 4. Key Concepts & Principles  \n- **Design Skill Ingestion (`CLAUDE.md`)**: A markdown‑style configuration that Claude reads automatically at runtime, embedding a full design system (layout grids, spacing tokens, component definitions) into every session.  \n- **Model‑Component‑Provider (MCP)**: A plug‑in mechanism that registers external pattern libraries with Claude, enabling the model to reference concrete UI templates rather than improvising.  \n- **Secure API Key Management**: When connecting to third‑party asset services (e.g., 21st.dev), the key is stored in Claude’s local configuration, preventing accidental exposure in source control.  \n- **Verification Prompt**: A single, comprehensive design request that serves as a functional test, confirming that the skill file, MCPs, and asset library are all active and correctly linked.\n\n## 5. Tools & Technologies Mentioned  \n- **Claude Code (`@anthropic-ai/claude-code`)** – The command‑line interface that powers AI‑driven code and UI generation; it reads `CLAUDE.md` files and resolves MCPs.  \n- **Node.js (v18+)** – Runtime environment required for the Claude CLI and for executing the `npm` installation commands.  \n- **GitHub** – Host for the open‑source UX/UI design skill file; the guide uses `curl` to fetch the raw markdown into the project.  \n- **Google Stitch MCP** – A pattern repository that supplies best‑practice hero and layout structures.  \n- **Nano Banana 2 MCP** – Another curated pattern set focusing on modern UI components and interaction flows.  \n- **21st.dev Asset Library** – A marketplace of premium 3D models and reactive UI widgets that Claude can embed directly via an API key.\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid Hero Section Prototyping  \n1. **Prepare the project**: `cd` into the target folder and ensure Node.js ≥ 18 is installed.  \n2. **Add the design skill**: `curl -O https://raw.githubusercontent.com/<repo>/main/CLAUDE.md`.  \n3. **Install MCPs**:  \n   ```bash\n   claude mcp add google-stitch\n   claude mcp add nano-banana-2\n   ```  \n4. **Connect 21st.dev**: Obtain an API key from the 21st.dev dashboard, then run  \n   ```bash\n   claude mcp add 21st-dev --api-key <YOUR_API_KEY>\n   ```  \n5. **Validate**: `claude mcp list` should list all three providers.  \n6. **Generate**: Launch Claude Code in the folder and issue the prompt:  \n   *“Create a landing‑page hero with a 3D animated gradient background, bold headline, sub‑headline, and CTA button. Use 21st.dev for the 3D element, follow the design‑skill spacing, and apply Stitch/Nano Banana patterns.”*  \n7. **Inspect**: Verify that the output references the design skill (e.g., spacing tokens), includes a Stitch‑derived layout, and embeds a 21st.dev component tag.\n\n### Use Case 2 – Consistent Component Library Expansion  \n1. **Create a new component repo** and place a `CLAUDE.md` file that defines the component’s visual language.  \n2. **Add MCPs** once at the global level (they persist across projects).  \n3. **Register a secondary asset source** (e.g., a custom 3D asset service) using the same `claude mcp add` syntax with its own API key.  \n4. **Run a batch generation script** that iterates over a list of component names, feeding each to Claude with a prompt like:  \n   *“Generate a reusable card component that follows the design‑skill grid, uses Nano Banana’s card pattern, and includes a 21st.dev animated icon.”*  \n5. **Collect outputs** into a shared component library, ensuring each artifact adheres to the same design system without manual tweaking.\n\n## 7. Prerequisites  \n- Node.js version 18 or newer installed locally.  \n- Global installation of the Claude Code CLI (`npm install -g @anthropic-ai/claude-code`).  \n- An active Anthropic account for authentication.  \n- Internet access to fetch the GitHub skill file and to register MCPs.  \n- Optional but recommended: a free 21st.dev account to obtain an API key for 3D assets.\n\n## 8. Recommended Next Resources  \n- **Claude Code Advanced Prompt Engineering** – Deep dive into crafting prompts that exploit the design skill and MCPs for complex UI flows.  \n- **Version‑Controlled Design Systems** – Strategies for storing `CLAUDE.md` alongside source code in Git, enabling CI/CD validation of AI‑generated UI.  \n- **Secure Credential Management for AI Tools** – Best practices for handling API keys and tokens in local development environments.  \n- **Integrating Claude Code with Front‑End Frameworks** – Tutorials on feeding Claude‑generated markup into React, Vue, or Svelte projects.  \n- **Exploring Additional MCPs** – Catalog of community‑maintained pattern libraries that can be added via `claude mcp add`."}, {"id": "AI-017", "slug": "figma-claude-setup-guide", "title": "Figma + Claude Setup Guide", "category": "Tools & Integrations", "subcategory": "Creative & Design", "difficulty": "Beginner", "description": "Connect Figma to Claude via MCP and work with your design files in conversation. Covers the Figma MCP server setup, authentication, and the most useful prompts for design workflows.", "source_url": "", "download_url": null, "content_type": "Guide", "author": "AI Resource Library", "date": "2025", "topics": ["Tools & Integrations", "Creative & Design"], "ai_tools": ["Claude", "Figma"], "status": "WEB_ONLY", "local_file": null, "local_html": "web-pages/AI-017_figma-claude-setup-guide.html", "summary_file": "summaries/AI-017.md", "copyright_status": "Public Web / Personal Reference", "notes": "Public web guide cataloged", "summary_markdown": "# AI-017 - Figma + Claude Setup Guide  \n\n- **Category:** Tools & Integrations | **Subcategory:** Creative & Design  \n- **Difficulty:** Beginner  \n- **Local Asset:** N/A (Web Only)  \n- **Status:** WEB_ONLY  \n\n## 1. What This Resource Teaches  \nThis guide walks a newcomer through the end‑to‑end process of linking Claude (Anthropic’s conversational model) with Figma, enabling the AI to generate visual diagrams automatically. The core learning outcome is the ability to issue a natural‑language description of a workflow, system, or concept and receive a fully‑formed Figma file—without manually opening the design tool or possessing any graphic‑design expertise.  \n\nTechnically, the integration hinges on an OAuth handshake that authorizes Claude to act on the user’s behalf inside the Figma drafts space. Once the connector is active, Claude parses the prompt, selects appropriate diagram primitives (shapes, connectors, layout styles), and creates a new Figma document via the platform’s API. The user can then retrieve a shareable link, view the diagram in a browser, and request iterative refinements through the same chat session, with Claude applying targeted edits directly to the existing file.  \n\nArchitecturally, the workflow demonstrates a lightweight “AI‑as‑a‑design‑assistant” pattern: a front‑end chat interface (Claude) communicates with a third‑party design service (Figma) via a secure token, while the AI maintains context of the diagram state to support incremental updates. This pattern can be generalized to other design or documentation APIs.\n\n## 2. Why It Matters  \n- **Speed to Insight:** Transforming abstract ideas into visual artifacts in under a minute eliminates the bottleneck of manual wireframing, accelerating brainstorming sessions and stakeholder alignment.  \n- **Lower Skill Barrier:** Teams without dedicated designers can still produce professional‑looking flowcharts, architecture maps, or org charts, democratizing visual communication.  \n- **Iterative Agility:** Because Claude can edit an existing Figma file on demand, the feedback loop is reduced to a single conversational turn, fostering rapid experimentation and version control without leaving the chat environment.  \n- **Cost Efficiency:** Both Claude’s free tier and Figma’s starter plan are sufficient, meaning organizations can pilot the integration without any upfront licensing expense.  \n\nIn modern AI‑augmented workflows, the ability to blend natural‑language reasoning with visual output bridges the gap between strategic planning and concrete deliverables, making this integration a valuable addition to product, UX, and operations toolkits.\n\n## 3. Target Audience  \n- **Product Managers** who need quick user‑flow sketches for feature proposals.  \n- **UX Researchers** looking to map interview findings or journey maps without a design handoff.  \n- **Developers & DevOps engineers** who want to visualize system architecture or CI/CD pipelines on the fly.  \n- **Small‑team founders or freelancers** lacking a dedicated designer but requiring polished diagrams for pitches or documentation.  \n- **Educators & trainers** who wish to generate illustrative diagrams for teaching complex processes.\n\nAll of the above benefit from a “no‑design‑skill” approach and can operate within the free tiers of the involved services.\n\n## 4. Key Concepts & Principles  \n\n- **OAuth‑Based Connector:** A secure, single‑click authorization that grants Claude write access to a user’s Figma drafts, eliminating the need for manual API key handling.  \n- **Prompt‑Driven Diagram Synthesis:** Claude interprets plain‑English descriptions, maps them to diagrammatic elements (nodes, edges, containers), and decides on an appropriate layout (flowchart, swimlane, decision tree).  \n- **Stateful Editing Loop:** The AI retains the identifier of the generated Figma file, allowing subsequent prompts to target the same canvas for incremental changes (e.g., adding steps, re‑layout).  \n- **Design‑Neutral Output:** The system automatically applies default styling (stroke, fill, typography) that adheres to Figma’s default UI kit, ensuring the diagram looks clean without custom styling instructions.\n\n## 5. Tools & Technologies Mentioned  \n\n- **Claude (Anthropic):** Conversational LLM that parses user intent, orchestrates diagram creation, and issues API calls to Figma. Operates via a web UI where integrations can be toggled.  \n- **Figma:** Cloud‑based design platform exposing a RESTful API for file creation, component insertion, and layer manipulation. The integration uses the “drafts” workspace to store AI‑generated files.  \n\nBoth tools are accessible on free plans, making the stack inexpensive for prototyping.\n\n## 6. Practical Use Cases & Workflows  \n\n### Use Case 1 – Rapid User‑Onboarding Flow Sketch  \n1. **Activate Connector:** In Claude’s settings, locate the Figma integration and click “Connect”; complete the OAuth prompt.  \n2. **Prompt Claude:** “Create a diagram that shows the steps a new user experiences from sign‑up to first login, including email verification.”  \n3. **Receive Link:** Claude returns a URL; open it to view the auto‑generated flowchart in Figma.  \n4. **Iterate (optional):** If a decision point for “choose subscription tier” is missing, ask Claude “Add a decision node after email verification with options ‘Free’ and ‘Premium’.” Claude updates the same file instantly.  \n\n### Use Case 2 – System Architecture Blueprint for a SaaS Product  \n1. **Connector Setup:** Same one‑time OAuth step.  \n2. **Initial Prompt:** “Map out the high‑level architecture of a SaaS billing platform, including front‑end, API gateway, subscription service, payment processor, and database.”  \n3. **Open Diagram:** Click the provided Figma link; the diagram appears with labeled boxes and arrows.  \n4. **Refinement Loop:** To clarify data flow, ask “Show a bidirectional sync between the subscription service and the database.” Claude injects the new connectors without manual editing.  \n\nBoth workflows emphasize a single prompt followed by optional conversational refinements, all within the Claude chat window.\n\n## 7. Prerequisites  \n\n- Active Claude account (free tier sufficient).  \n- Active Figma account (free tier sufficient).  \n- Stable internet connection for OAuth handshake and API calls.  \n- Basic familiarity with natural‑language prompting (no special syntax required).  \n\nNo prior Figma files need to be open; the integration will generate a new draft automatically.\n\n## 8. Recommended Next Resources  \n\n- **Claude Prompt Engineering Guide** – deep dive into crafting precise prompts for visual tasks.  \n- **Figma API Documentation** – explore advanced styling, component libraries, and programmatic version control.  \n- **AI‑Powered Design Systems** – articles on extending the Claude‑Figma pattern to other design tools (e.g., Sketch, Adobe XD).  \n- **Workflow Automation with Zapier / Make** – learn how to chain Claude‑generated diagrams into downstream processes (e.g., auto‑export to PNG, embed in Confluence).  \n\nThese resources will help users expand beyond basic diagramming into more sophisticated, automated design pipelines."}, {"id": "AI-018", "slug": "notebooklm-claude-code-
